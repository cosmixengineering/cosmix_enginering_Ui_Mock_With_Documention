buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

allprojects {
    layout.buildDirectory = file("C:/tmp/b/${project.name}")
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                defaultConfig {
                    externalNativeBuild {
                        cmake {
                            arguments "-DANDROID_STL=c++_shared", "-DCMAKE_SHARED_LINKER_FLAGS=-lc++_shared -lstdc++", "-DCMAKE_MODULE_LINKER_FLAGS=-lc++_shared -lstdc++"
                        }
                    }
                }
                externalNativeBuild {
                    cmake {
                        buildStagingDirectory = file("C:/tmp/cxx/${project.name}")
                    }
                }
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
