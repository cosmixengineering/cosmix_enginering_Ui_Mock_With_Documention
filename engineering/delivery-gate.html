<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3-Stage Delivery Gate Clearance - Cosmix ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans flex h-screen overflow-hidden text-xs">

    <div id="app-layout" class="flex w-full h-full"></div>

    <!-- Modals Container -->
    <div id="modal-container"></div>

    <!-- Challan Preview Modal -->
    <div id="challan-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-xs flex items-center justify-center hidden z-50 p-4 overflow-y-auto">
        <div class="bg-white w-full max-w-4xl rounded-2xl shadow-2xl border border-slate-200 flex flex-col max-h-[92vh] overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
                <div class="flex items-center gap-2">
                    <span class="w-8 h-8 rounded-lg bg-[#1e2552] text-white flex items-center justify-center font-bold text-xs">
                        <i class="fas fa-file-invoice"></i>
                    </span>
                    <div>
                        <h3 class="font-bold text-sm text-slate-900">Goods Delivery Challan (Official Release)</h3>
                        <p class="text-[11px] text-slate-500">Security Gate Outward Pass & 3-Stage Authorization Document</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button id="modal-print-btn" class="px-3.5 py-1.5 bg-[#1e2552] hover:bg-[#121736] text-white rounded-lg font-semibold text-xs flex items-center gap-1.5 transition-all shadow-xs">
                        <i class="fas fa-print"></i> Print Document
                    </button>
                    <button onclick="closeChallanModal()" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg hover:bg-slate-200/50 transition">
                        <i class="fas fa-times text-base"></i>
                    </button>
                </div>
            </div>
            <div id="challan-modal-content" class="p-6 overflow-y-auto bg-slate-100/50">
                <!-- Dynamically Populated -->
            </div>
        </div>
    </div>

    <script src="../assets/js/engineering-store.js"></script>
    <script src="../assets/js/shared.js"></script>
    <script>
        let currentFilter = 'ALL';
        let searchQuery = '';
        let activeOtpTimer = null;

        document.addEventListener('DOMContentLoaded', () => {
            renderLayout('delivery-gate');
            buildMainUI();
            renderGates();
        });

        function buildMainUI() {
            const main = document.getElementById('main-content');
            if (!main) return;

            main.innerHTML = `
                <div class="p-4 sm:p-6 space-y-5 max-w-7xl mx-auto pb-16">
                    
                    <!-- Header -->
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs">
                        <div>
                            <div class="flex items-center gap-2">
                                <a href="index.html" class="text-slate-400 hover:text-[#1e2552] text-[11px] transition">
                                    <i class="fas fa-arrow-left mr-1"></i> Engineering Operations
                                </a>
                                <span class="text-slate-300">/</span>
                                <span class="text-xs font-bold text-[#1e2552] uppercase tracking-wider">Logistics & Security Gate</span>
                            </div>
                            <h1 class="text-xl font-bold text-slate-900 mt-1">3-Stage Delivery Gate Clearance</h1>
                            <p class="text-xs text-slate-500 mt-0.5">Automated Gate Pass Protocol: 1. Fleet & Staff Ready &rarr; 2. Payment Milestone / CEO Credit &rarr; 3. Site Recipient OTP Challenge.</p>
                        </div>
                        <div class="flex items-center gap-2.5 flex-wrap">
                            <button onclick="openNewGatePassModal()" class="px-3.5 py-2 bg-[#1e2552] hover:bg-[#121736] text-white rounded-xl text-xs font-semibold shadow-xs flex items-center gap-2 transition-all">
                                <i class="fas fa-plus"></i> New Gate Pass
                            </button>
                            <button onclick="resetDemoData()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold border border-slate-200 transition-all flex items-center gap-1.5" title="Reset to Initial Demo State">
                                <i class="fas fa-rotate-left"></i> Reset Demo
                            </button>
                        </div>
                    </div>

                    <!-- KPI Statistics Summary Bar -->
                    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3" id="kpi-container">
                        <!-- Populated Dynamically -->
                    </div>

                    <!-- Filter Tabs & Search Bar -->
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 bg-white p-3 rounded-xl border border-slate-200/80 shadow-2xs">
                        <div class="flex items-center gap-1.5 overflow-x-auto pb-1 md:pb-0" id="filter-tabs">
                            <button onclick="setFilter('ALL')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition ${currentFilter === 'ALL' ? 'bg-[#1e2552] text-white' : 'text-slate-600 hover:bg-slate-100'}">
                                All Dispatches
                            </button>
                            <button onclick="setFilter('PendingGate1')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition ${currentFilter === 'PendingGate1' ? 'bg-[#1e2552] text-white' : 'text-slate-600 hover:bg-slate-100'}">
                                Awaiting Fleet Ready
                            </button>
                            <button onclick="setFilter('PendingGate2')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition ${currentFilter === 'PendingGate2' ? 'bg-[#1e2552] text-white' : 'text-slate-600 hover:bg-slate-100'}">
                                Awaiting Payment
                            </button>
                            <button onclick="setFilter('PendingGate3')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition ${currentFilter === 'PendingGate3' ? 'bg-[#1e2552] text-white' : 'text-slate-600 hover:bg-slate-100'}">
                                Awaiting Site OTP
                            </button>
                            <button onclick="setFilter('ClearedForDispatch')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition ${currentFilter === 'ClearedForDispatch' ? 'bg-[#1e2552] text-white' : 'text-slate-600 hover:bg-slate-100'}">
                                Cleared for Dispatch
                            </button>
                        </div>
                        <div class="relative min-w-[240px]">
                            <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                            <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="Search Gate Pass #, Vehicle, Client..." class="w-full pl-8 pr-3 py-1.5 border border-slate-200 rounded-lg text-xs outline-none focus:ring-1 focus:ring-[#1e2552] focus:border-[#1e2552] bg-slate-50/50">
                        </div>
                    </div>

                    <!-- Gate Pass Cards List -->
                    <div class="space-y-4" id="gates-container">
                        <!-- Populated Dynamically -->
                    </div>

                </div>
            `;
        }

        function setFilter(filter) {
            currentFilter = filter;
            buildMainUI();
            renderGates();
        }

        function handleSearch(val) {
            searchQuery = (val || '').toLowerCase().trim();
            renderGates();
        }

        function renderKpis() {
            const kpis = CosmixEngineering.getGateSummaryKpis();
            const container = document.getElementById('kpi-container');
            if (!container) return;

            container.innerHTML = `
                <div class="bg-white p-3.5 rounded-xl border border-slate-200/80 shadow-2xs">
                    <div class="flex items-center justify-between">
                        <span class="text-[11px] font-semibold text-slate-500">Total Gate Passes</span>
                        <div class="w-7 h-7 rounded-lg bg-slate-100 text-slate-700 flex items-center justify-center text-xs">
                            <i class="fas fa-truck-ramp-box"></i>
                        </div>
                    </div>
                    <div class="mt-2 flex items-baseline gap-2">
                        <span class="text-lg font-bold text-slate-900 font-mono">${kpis.total}</span>
                        <span class="text-[10px] text-slate-400 font-medium">Consignments</span>
                    </div>
                </div>

                <div class="bg-white p-3.5 rounded-xl border border-slate-200/80 shadow-2xs">
                    <div class="flex items-center justify-between">
                        <span class="text-[11px] font-semibold text-slate-500">Stage 1: Fleet Ready</span>
                        <div class="w-7 h-7 rounded-lg bg-teal-50 text-teal-700 flex items-center justify-center text-xs">
                            <i class="fas fa-user-shield"></i>
                        </div>
                    </div>
                    <div class="mt-2 flex items-baseline gap-2">
                        <span class="text-lg font-bold text-teal-700 font-mono">${kpis.total - kpis.pendingGate1}</span>
                        <span class="text-[10px] ${kpis.pendingGate1 > 0 ? 'text-amber-600 font-semibold' : 'text-slate-400'}">${kpis.pendingGate1} Pending</span>
                    </div>
                </div>

                <div class="bg-white p-3.5 rounded-xl border border-slate-200/80 shadow-2xs">
                    <div class="flex items-center justify-between">
                        <span class="text-[11px] font-semibold text-slate-500">Stage 2: Payment Gate</span>
                        <div class="w-7 h-7 rounded-lg bg-blue-50 text-blue-700 flex items-center justify-center text-xs">
                            <i class="fas fa-file-invoice-dollar"></i>
                        </div>
                    </div>
                    <div class="mt-2 flex items-baseline gap-2">
                        <span class="text-lg font-bold text-blue-700 font-mono">${kpis.total - kpis.pendingGate1 - kpis.pendingGate2}</span>
                        <span class="text-[10px] ${kpis.pendingGate2 > 0 ? 'text-amber-600 font-semibold' : 'text-slate-400'}">${kpis.pendingGate2} Pending</span>
                    </div>
                </div>

                <div class="bg-white p-3.5 rounded-xl border border-slate-200/80 shadow-2xs">
                    <div class="flex items-center justify-between">
                        <span class="text-[11px] font-semibold text-slate-500">Stage 3: Site OTP</span>
                        <div class="w-7 h-7 rounded-lg bg-purple-50 text-purple-700 flex items-center justify-center text-xs">
                            <i class="fas fa-key"></i>
                        </div>
                    </div>
                    <div class="mt-2 flex items-baseline gap-2">
                        <span class="text-lg font-bold text-purple-700 font-mono">${kpis.cleared}</span>
                        <span class="text-[10px] ${kpis.pendingGate3 > 0 ? 'text-purple-600 font-semibold' : 'text-slate-400'}">${kpis.pendingGate3} Challenged</span>
                    </div>
                </div>

                <div class="bg-white p-3.5 rounded-xl border border-emerald-200 shadow-2xs bg-emerald-50/20">
                    <div class="flex items-center justify-between">
                        <span class="text-[11px] font-semibold text-emerald-800">Cleared & Dispatched</span>
                        <div class="w-7 h-7 rounded-lg bg-emerald-100 text-emerald-700 flex items-center justify-center text-xs">
                            <i class="fas fa-circle-check"></i>
                        </div>
                    </div>
                    <div class="mt-2 flex items-baseline gap-2">
                        <span class="text-lg font-bold text-emerald-700 font-mono">${kpis.cleared}</span>
                        <span class="text-[10px] text-emerald-600 font-semibold">Challan Released</span>
                    </div>
                </div>
            `;
        }

        function renderGates() {
            renderKpis();
            const allGates = CosmixEngineering.getDeliveryGates();
            const container = document.getElementById('gates-container');
            if (!container) return;

            let filtered = allGates;
            if (currentFilter !== 'ALL') {
                filtered = filtered.filter(g => g.gateStatus === currentFilter);
            }

            if (searchQuery) {
                filtered = filtered.filter(g => {
                    const text = `${g.gatePassNo} ${g.challanNo} ${g.poRef} ${g.projectRef} ${g.destinationSite} ${g.vehicleNo} ${g.driverName} ${g.clientContactName}`.toLowerCase();
                    return text.includes(searchQuery);
                });
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl border border-slate-200/80 p-12 text-center space-y-3">
                        <div class="w-12 h-12 rounded-full bg-slate-100 text-slate-400 mx-auto flex items-center justify-center text-lg">
                            <i class="fas fa-truck-ramp-box"></i>
                        </div>
                        <h3 class="font-bold text-sm text-slate-800">No Gate Passes Match the Current Filter</h3>
                        <p class="text-xs text-slate-500 max-w-sm mx-auto">Adjust your search parameters or filter category to inspect active consignment gate clearances.</p>
                        <button onclick="setFilter('ALL')" class="px-4 py-1.5 bg-[#1e2552] text-white rounded-lg text-xs font-semibold">View All Dispatches</button>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(g => {
                const isCleared = g.gateStatus === 'ClearedForDispatch';
                const s1 = g.gate1StaffReady;
                const s2 = g.gate2CommercialTax;
                const s3 = g.gate3SiteOtp;

                return `
                    <div class="bg-white rounded-2xl border ${isCleared ? 'border-slate-200/80' : 'border-[#1e2552]/30 ring-1 ring-[#1e2552]/10'} shadow-xs p-5 space-y-4 transition-all">
                        
                        <!-- Card Header -->
                        <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3 border-b border-slate-100 pb-3.5">
                            <div>
                                <div class="flex items-center gap-2 flex-wrap">
                                    <span class="px-2.5 py-1 rounded-lg bg-[#1e2552]/10 text-[#1e2552] font-mono font-bold text-xs border border-[#1e2552]/20">
                                        ${g.gatePassNo}
                                    </span>
                                    <span class="px-2 py-0.5 rounded bg-slate-100 text-slate-700 font-mono font-semibold text-[11px] border border-slate-200">
                                        Challan: ${g.challanNo}
                                    </span>
                                    <span class="text-slate-300">•</span>
                                    <span class="font-bold text-slate-900 text-xs">${g.projectRef}</span>
                                </div>
                                <div class="text-[11.5px] text-slate-600 mt-1 flex items-center gap-3 flex-wrap">
                                    <span><i class="fas fa-location-dot text-rose-500 mr-1"></i> ${g.destinationSite}</span>
                                    <span class="text-slate-300">|</span>
                                    <span><i class="fas fa-truck text-blue-500 mr-1"></i> Vehicle: <strong class="font-mono text-slate-800">${g.vehicleNo}</strong> (${g.vehicleType})</span>
                                    <span class="text-slate-300">|</span>
                                    <span><i class="fas fa-user-gear text-slate-500 mr-1"></i> Driver: <strong class="text-slate-800">${g.driverName}</strong> (${g.driverPhone})</span>
                                </div>
                            </div>

                            <div class="flex items-center gap-2 shrink-0">
                                <span class="px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 ${
                                    isCleared ? 'bg-emerald-100 text-emerald-800 border border-emerald-200' :
                                    g.gateStatus === 'PendingGate3' ? 'bg-purple-100 text-purple-800 border border-purple-200' :
                                    g.gateStatus === 'PendingGate2' ? 'bg-blue-100 text-blue-800 border border-blue-200' :
                                    'bg-amber-100 text-amber-800 border border-amber-200'
                                }">
                                    ${
                                        isCleared ? '<i class="fas fa-circle-check"></i> Cleared For Dispatch' :
                                        g.gateStatus === 'PendingGate3' ? '<i class="fas fa-key animate-pulse"></i> Awaiting Site OTP' :
                                        g.gateStatus === 'PendingGate2' ? '<i class="fas fa-file-invoice-dollar"></i> Awaiting Payment Gate' :
                                        '<i class="fas fa-user-shield"></i> Awaiting Fleet Readiness'
                                    }
                                </span>
                            </div>
                        </div>

                        <!-- 3-Stage Clearance Verification Pillars -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3.5">
                            
                            <!-- Stage 1: Field Staff / Fleet Ready -->
                            <div class="bg-slate-50/80 p-3.5 rounded-xl border ${s1.passed ? 'border-emerald-200 bg-emerald-50/20' : 'border-amber-200 bg-amber-50/20'} space-y-2.5 flex flex-col justify-between">
                                <div>
                                    <div class="flex items-center justify-between mb-1.5">
                                        <span class="font-bold text-slate-900 text-xs flex items-center gap-1.5">
                                            <i class="fas fa-truck-ramp-box text-teal-600"></i> Stage 1: Fleet & Staff Ready
                                        </span>
                                        <span class="px-2 py-0.5 rounded text-[10px] font-bold ${s1.passed ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                                            ${s1.passed ? 'PASSED' : 'PENDING'}
                                        </span>
                                    </div>
                                    <p class="text-[11px] text-slate-600 leading-relaxed">${s1.notes || 'Departure safety checklist verification required.'}</p>
                                    
                                    <div class="mt-2 space-y-1 text-[10.5px]">
                                        <div class="flex items-center justify-between text-slate-500">
                                            <span>Driver & License:</span>
                                            <span class="font-mono font-semibold text-slate-700">${g.driverLicense}</span>
                                        </div>
                                        <div class="flex items-center justify-between text-slate-500">
                                            <span>Vehicle Strapping:</span>
                                            <span class="font-semibold ${s1.passed ? 'text-emerald-700' : 'text-slate-600'}">${s1.passed ? 'Tensioned & Tarped' : 'Pending Inspection'}</span>
                                        </div>
                                        <div class="flex items-center justify-between text-slate-500">
                                            <span>Staff PPE Pass:</span>
                                            <span class="font-semibold ${s1.passed ? 'text-emerald-700' : 'text-slate-600'}">${s1.passed ? 'Compliant (3 Helpers)' : 'Pending'}</span>
                                        </div>
                                    </div>
                                </div>

                                <div class="pt-2 border-t border-slate-200/60">
                                    ${s1.passed ? `
                                        <div class="text-[10px] text-emerald-700 font-medium flex items-center justify-between">
                                            <span><i class="fas fa-check-circle mr-1"></i> Verified by ${s1.verifier?.split(' ')[0] || 'Lead'}</span>
                                            <span class="font-mono text-[9.5px] text-slate-400">${s1.verifiedAt?.substring(5) || ''}</span>
                                        </div>
                                    ` : `
                                        <button onclick="openStage1Modal('${g.id}')" class="w-full py-1.5 bg-teal-600 hover:bg-teal-700 text-white rounded-lg text-xs font-semibold transition flex items-center justify-center gap-1.5">
                                            <i class="fas fa-clipboard-check"></i> Inspect & Approve Fleet
                                        </button>
                                    `}
                                </div>
                            </div>

                            <!-- Stage 2: Payment Gate Clearance -->
                            <div class="bg-slate-50/80 p-3.5 rounded-xl border ${s2.passed ? 'border-blue-200 bg-blue-50/20' : 'border-amber-200 bg-amber-50/20'} space-y-2.5 flex flex-col justify-between">
                                <div>
                                    <div class="flex items-center justify-between mb-1.5">
                                        <span class="font-bold text-slate-900 text-xs flex items-center gap-1.5">
                                            <i class="fas fa-file-invoice-dollar text-blue-600"></i> Stage 2: Payment Gate
                                        </span>
                                        <span class="px-2 py-0.5 rounded text-[10px] font-bold ${s2.passed ? 'bg-blue-100 text-blue-800' : 'bg-amber-100 text-amber-800'}">
                                            ${s2.passed ? 'CLEARED' : 'PENDING'}
                                        </span>
                                    </div>
                                    <p class="text-[11px] text-slate-600 leading-relaxed">${s2.notes || 'Financial milestone verification required.'}</p>
                                    
                                    <div class="mt-2 space-y-1 text-[10.5px]">
                                        <div class="flex items-center justify-between text-slate-500">
                                            <span>Milestone Threshold:</span>
                                            <span class="font-mono font-bold ${s2.advancePercentage >= 30 ? 'text-blue-700' : 'text-amber-700'}">${s2.advancePercentage || 0}% (Req: 30%)</span>
                                        </div>
                                        <div class="flex items-center justify-between text-slate-500">
                                            <span>Approval Mode:</span>
                                            <span class="font-semibold text-slate-700">${s2.ceoOverrideApproved ? 'CEO Special Override' : 'Milestone Advance Ledger'}</span>
                                        </div>
                                        <div class="flex items-center justify-between text-slate-500">
                                            <span>Tax Undertaking:</span>
                                            <span class="font-semibold ${s2.taxUndertakingObtained ? 'text-blue-700' : 'text-slate-600'}">${s2.taxUndertakingObtained ? 'Signed & Validated' : 'Pending'}</span>
                                        </div>
                                    </div>
                                </div>

                                <div class="pt-2 border-t border-slate-200/60">
                                    ${s2.passed ? `
                                        <div class="text-[10px] text-blue-700 font-medium flex items-center justify-between">
                                            <span><i class="fas fa-check-circle mr-1"></i> ${s2.ceoOverrideApproved ? 'CEO Approved' : 'Accounts Cleared'}</span>
                                            <span class="font-mono text-[9.5px] text-slate-400">${s2.verifiedAt?.substring(5) || ''}</span>
                                        </div>
                                    ` : `
                                        <button onclick="openStage2Modal('${g.id}')" class="w-full py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-semibold transition flex items-center justify-center gap-1.5">
                                            <i class="fas fa-stamp"></i> Authorize Payment Gate
                                        </button>
                                    `}
                                </div>
                            </div>

                            <!-- Stage 3: Site Recipient OTP Challenge -->
                            <div class="bg-slate-50/80 p-3.5 rounded-xl border ${s3.passed ? 'border-purple-200 bg-purple-50/20' : 'border-purple-300 bg-purple-50/30'} space-y-2.5 flex flex-col justify-between">
                                <div>
                                    <div class="flex items-center justify-between mb-1.5">
                                        <span class="font-bold text-slate-900 text-xs flex items-center gap-1.5">
                                            <i class="fas fa-key text-purple-600"></i> Stage 3: Site OTP Challenge
                                        </span>
                                        <span class="px-2 py-0.5 rounded text-[10px] font-bold ${s3.passed ? 'bg-purple-100 text-purple-800' : 'bg-purple-200 text-purple-900'}">
                                            ${s3.passed ? 'AUTHENTICATED' : 'CHALLENGE ACTIVE'}
                                        </span>
                                    </div>
                                    
                                    <div class="text-[11px] text-slate-700">
                                        Site Lead: <strong>${g.clientContactName}</strong>
                                        <div class="font-mono text-[10.5px] text-slate-500">${g.clientPhone}</div>
                                    </div>

                                    ${!s3.passed ? `
                                        <div class="mt-2.5 space-y-2">
                                            <div class="flex items-center justify-between bg-white px-2.5 py-1.5 rounded-lg border border-purple-200">
                                                <span class="text-[10px] text-purple-800 font-semibold">Demo OTP Token:</span>
                                                <span class="font-mono font-bold text-purple-900 text-xs bg-purple-50 px-2 py-0.5 rounded border border-purple-200 tracking-wider">${s3.otpCode}</span>
                                            </div>
                                            <div class="flex items-center gap-1.5">
                                                <input type="text" id="otp-input-${g.id}" maxlength="6" placeholder="Enter 6-digit OTP" class="w-full px-2.5 py-1.5 bg-white border border-slate-300 rounded-lg font-mono text-center text-xs font-bold tracking-widest outline-none focus:ring-1 focus:ring-purple-500">
                                                <button onclick="submitVerifyOtp('${g.id}')" class="px-3 py-1.5 bg-purple-700 hover:bg-purple-800 text-white rounded-lg font-bold text-xs shrink-0 transition">
                                                    Verify
                                                </button>
                                            </div>
                                        </div>

                renderGates();
            } else {
                alert(res.message);
            }
        }

        function submitVerifyOtp(gateId) {
            const input = document.getElementById('otp-input-' + gateId);
            if (!input || !input.value) {
                alert('Please enter the 6-digit OTP code received by the site recipient.');
                return;
            }
            const res = CosmixEngineering.verifySiteOtpAndClearGate(gateId, input.value);
            if (res.success) {
                showToastNotification(res.message, 'success');
                renderGates();
                setTimeout(() => {

            } else {
                alert(res.message);

                advancePercentage,
                items: [
                    { itemCode: '0-0001-01', description: itemDesc, qty: 500, uom: 'Kg', weightKg: 500, remarks: 'Workshop Outward Dispatch' }
                ]
            });

            closeModal('new-gate-modal');
            showToastNotification('New Outward Delivery Gate Pass initialized successfully.', 'success');
            renderGates();
        }

        function resetDemoData() {
            if (confirm('Reset all Delivery Gate Passes and OTP challenges to initial standard demo state?')) {
                CosmixEngineering.resetToDefaults();
                showToastNotification('State reset to standard enterprise demo data.', 'info');
                renderGates();
            }
        }

        // Modal Helpers
        function showModal(html) {
            const container = document.getElementById('modal-container');
            if (container) {
                container.innerHTML = html;
            }
        }

        function closeModal(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function showToastNotification(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-xl border text-xs font-semibold flex items-center gap-2 transition-all transform translate-y-0 opacity-100 ${
                type === 'success' ? 'bg-[#1e2552] text-white border-slate-700' :
                type === 'error' ? 'bg-rose-700 text-white border-rose-800' :
                'bg-slate-800 text-white border-slate-700'
            }`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-circle-check text-emerald-400' : 'fa-info-circle text-blue-400'}"></i> <span>${message}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }
    </script>
</body>
</html>
