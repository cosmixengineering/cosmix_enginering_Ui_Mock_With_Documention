<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factory QC Clearance - Cosmix ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans flex h-screen overflow-hidden text-xs">

    <div id="app-layout" class="flex w-full h-full"></div>

    <script src="../assets/js/engineering-store.js"></script>
    <script src="../assets/js/shared.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderLayout('factory-qc');

            const content = `
                <div class="p-4 space-y-4 max-w-7xl mx-auto pb-12">
                    
                    <!-- Header -->
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white p-4 rounded-xl border border-slate-200/80 shadow-xs">
                        <div>
                            <div class="flex items-center gap-2">
                                <a href="index.html" class="text-slate-400 hover:text-orange-600 text-[11px]"><i class="fas fa-arrow-left mr-1"></i> Operations</a>
                                <span class="text-slate-300">/</span>
                                <span class="text-xs font-bold text-emerald-700 uppercase tracking-wider">Quality Assurance</span>
                            </div>
                            <h1 class="text-lg font-bold text-slate-800 mt-0.5">Factory QC Clearance Gate</h1>
                            <p class="text-[11px] text-slate-500">Inspection checklist before packaging & dispatch: Dimensional tolerances, sheet gauge, hydro/smoke pressure test & surface finishing.</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="px-2.5 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-lg text-xs font-bold flex items-center gap-1.5">
                                <i class="fas fa-certificate"></i> ISO 9001:2015 QC Protocols
                            </span>
                        </div>
                    </div>

                    <!-- Inspection Cards Container -->
                    <div class="space-y-4" id="qc-cards-container">
                        <!-- Populated Dynamically -->
                    </div>

                </div>
            `;

            document.getElementById('main-content').innerHTML = content;
            renderQcCards();
        });

        function renderQcCards() {
            const orders = CosmixEngineering.getProductionOrders();
            const container = document.getElementById('qc-cards-container');
            if (!container) return;

            container.innerHTML = orders.map(order => {
                const checks = order.qcChecks || {};
                const isPassed = order.qcStatus === 'Passed';

                return `
                    <div class="bg-white rounded-xl border ${isPassed ? 'border-slate-200/80' : 'border-amber-300'} shadow-xs p-4 space-y-3.5">
                        
                        <!-- Header -->
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-2 border-b border-slate-100 pb-3">
                            <div>
                                <div class="flex items-center gap-2">
                                    <span class="px-2 py-0.5 rounded bg-orange-50 text-orange-700 font-mono font-bold text-xs border border-orange-200">${order.orderNo}</span>
                                    <span class="text-slate-300">•</span>
                                    <h3 class="font-bold text-slate-800 text-xs">${order.productName}</h3>
                                </div>
                                <div class="text-[11px] text-slate-500 mt-0.5">
                                    Project: <strong class="text-slate-700">${order.projectRef}</strong> | Stage: <strong class="text-orange-700">${order.currentStage}</strong>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="px-2.5 py-1 rounded text-[10px] font-bold ${isPassed ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                                    ${order.qcStatus === 'Passed' ? '<i class="fas fa-check-circle mr-1"></i> Quality Clearance PASSED' : '<i class="fas fa-clock mr-1"></i> Inspection In Progress'}
                                </span>
                            </div>
                        </div>

                        <!-- 4 QC Verification Tests Grid -->
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3">
                            
                            <!-- Test 1: Dimensional -->
                            <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 flex flex-col justify-between space-y-2">
                                <div>
                                    <div class="flex items-center justify-between">
                                        <span class="font-bold text-slate-700 text-[11px]">1. Dimensional Accuracy</span>
                                        <span class="w-2 h-2 rounded-full ${checks.dimensional?.passed ? 'bg-emerald-500' : 'bg-amber-400'}"></span>
                                    </div>
                                    <p class="text-[10px] text-slate-500 mt-1">${checks.dimensional?.note || 'Tolerance check'}</p>
                                </div>
                                <div class="flex gap-1 pt-1">
                                    <button onclick="toggleQc('${order.id}', 'dimensional', true)" class="flex-1 py-1 rounded text-[10px] font-bold ${checks.dimensional?.passed ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-700'}">
                                        Pass
                                    </button>
                                    <button onclick="toggleQc('${order.id}', 'dimensional', false)" class="flex-1 py-1 rounded text-[10px] font-bold ${!checks.dimensional?.passed ? 'bg-rose-600 text-white' : 'bg-slate-200 text-slate-700'}">
                                        Fail
                                    </button>
                                </div>
                            </div>

                            <!-- Test 2: Gauge & Material Thickness -->
                            <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 flex flex-col justify-between space-y-2">
                                <div>
                                    <div class="flex items-center justify-between">
                                        <span class="font-bold text-slate-700 text-[11px]">2. Material Gauge & Wall</span>
                                        <span class="w-2 h-2 rounded-full ${checks.sheetGauge?.passed ? 'bg-emerald-500' : 'bg-amber-400'}"></span>
                                    </div>
                                    <p class="text-[10px] text-slate-500 mt-1">${checks.sheetGauge?.note || 'Micrometer check'}</p>
                                </div>
                                <div class="flex gap-1 pt-1">
                                    <button onclick="toggleQc('${order.id}', 'sheetGauge', true)" class="flex-1 py-1 rounded text-[10px] font-bold ${checks.sheetGauge?.passed ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-700'}">
                                        Pass
                                    </button>
                                    <button onclick="toggleQc('${order.id}', 'sheetGauge', false)" class="flex-1 py-1 rounded text-[10px] font-bold ${!checks.sheetGauge?.passed ? 'bg-rose-600 text-white' : 'bg-slate-200 text-slate-700'}">
                                        Fail
                                    </button>
                                </div>
                            </div>

                            <!-- Test 3: Pressure / Leakage Test -->
                            <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 flex flex-col justify-between space-y-2">
                                <div>
                                    <div class="flex items-center justify-between">
                                        <span class="font-bold text-slate-700 text-[11px]">3. Leakage / Hydro Test</span>
                                        <span class="w-2 h-2 rounded-full ${checks.leakageSmoke?.passed ? 'bg-emerald-500' : 'bg-amber-400'}"></span>
                                    </div>
                                    <p class="text-[10px] text-slate-500 mt-1">${checks.leakageSmoke?.note || 'Pressure test'}</p>
                                </div>
                                <div class="flex gap-1 pt-1">
                                    <button onclick="toggleQc('${order.id}', 'leakageSmoke', true)" class="flex-1 py-1 rounded text-[10px] font-bold ${checks.leakageSmoke?.passed ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-700'}">
                                        Pass
                                    </button>
                                    <button onclick="toggleQc('${order.id}', 'leakageSmoke', false)" class="flex-1 py-1 rounded text-[10px] font-bold ${!checks.leakageSmoke?.passed ? 'bg-rose-600 text-white' : 'bg-slate-200 text-slate-700'}">
                                        Fail
                                    </button>
                                </div>
                            </div>

                            <!-- Test 4: Paint & Surface Finish -->
                            <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 flex flex-col justify-between space-y-2">
                                <div>
                                    <div class="flex items-center justify-between">
                                        <span class="font-bold text-slate-700 text-[11px]">4. Paint & Coating Finish</span>
                                        <span class="w-2 h-2 rounded-full ${checks.paintFinish?.passed ? 'bg-emerald-500' : 'bg-amber-400'}"></span>
                                    </div>
                                    <p class="text-[10px] text-slate-500 mt-1">${checks.paintFinish?.note || 'Coating check'}</p>
                                </div>
                                <div class="flex gap-1 pt-1">
                                    <button onclick="toggleQc('${order.id}', 'paintFinish', true)" class="flex-1 py-1 rounded text-[10px] font-bold ${checks.paintFinish?.passed ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-700'}">
                                        Pass
                                    </button>
                                    <button onclick="toggleQc('${order.id}', 'paintFinish', false)" class="flex-1 py-1 rounded text-[10px] font-bold ${!checks.paintFinish?.passed ? 'bg-rose-600 text-white' : 'bg-slate-200 text-slate-700'}">
                                        Fail
                                    </button>
                                </div>
                            </div>

                        </div>

                    </div>
                `;
            }).join('');
        }

        function toggleQc(orderId, key, passed) {
            const note = passed ? 'Verified compliant with engineering drawings.' : 'Failed inspection requirement.';
            CosmixEngineering.updateQcCheck(orderId, key, passed, note);
            renderQcCards();
        }
    </script>
</body>
</html>
