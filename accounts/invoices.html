            const listView = document.getElementById('invoices-list-view');
            const formView = document.getElementById('invoice-create-form-view');
            const voucher = document.getElementById('invoice-view-voucher-view');
            if (voucher) voucher.classList.add('hidden');
            if (listView && formView) {
                listView.classList.add('hidden');
                formView.classList.remove('hidden');

            if (formView) formView.classList.add('hidden');
            if (voucherView) voucherView.classList.add('hidden');

                listView.classList.remove('hidden');

        // =========================================================================
        // 65/30/5 CONTRACT & MILESTONE INTERACTIVITY
        // =========================================================================
        window.currentSelectedTier = 'm1';

        window.onContractProjectChanged = (prjKey) => {
            const contracts = CosmixFinance.getProjectContracts();
            const prj = contracts[prjKey];

            if (prj) {
                document.getElementById('full_contract_val').value = prj.contractValuePkr;
                document.getElementById('full_inv_client').value = prj.clientName;
                document.getElementById('full_inv_ntn').value = prj.ntn;
                document.getElementById('full_inv_strn').value = prj.strn;

                // Sync tax
                const taxSelect = document.getElementById('full_tax_rate');
                if (taxSelect) {
                    if (prj.province === 'Sindh') taxSelect.value = prj.taxJurisdiction.includes('FBR') ? '0.18' : '0.13';

                    else if (prj.province === 'KPK') taxSelect.value = '0.15';
                }

                const cv = prj.contractValuePkr;
                document.getElementById('m1-amount-display').innerText = 'PKR ' + Math.round(cv * 0.65).toLocaleString();
                document.getElementById('m2-amount-display').innerText = 'PKR ' + Math.round(cv * 0.30).toLocaleString();
                document.getElementById('m3-amount-display').innerText = 'PKR ' + Math.round(cv * 0.05).toLocaleString();

                selectMilestoneTier(window.currentSelectedTier || 'm1');

                // Custom project
                document.getElementById('m1-amount-display').innerText = 'PKR ' + Math.round((parseFloat(document.getElementById('full_contract_val').value) || 0) * 0.65).toLocaleString();

                document.getElementById('m3-amount-display').innerText = 'PKR ' + Math.round((parseFloat(document.getElementById('full_contract_val').value) || 0) * 0.05).toLocaleString();

        window.onContractValInputChanged = () => {
            const cv = parseFloat(document.getElementById('full_contract_val')?.value) || 0;
            document.getElementById('m1-amount-display').innerText = 'PKR ' + Math.round(cv * 0.65).toLocaleString();
            document.getElementById('m2-amount-display').innerText = 'PKR ' + Math.round(cv * 0.30).toLocaleString();
            document.getElementById('m3-amount-display').innerText = 'PKR ' + Math.round(cv * 0.05).toLocaleString();
            selectMilestoneTier(window.currentSelectedTier);
        };

        window.selectMilestoneTier = (tier) => {
            window.currentSelectedTier = tier;
            const cv = parseFloat(document.getElementById('full_contract_val')?.value) || 0;
            const pctInput = document.getElementById('full_milestone_pct');
            const tierSelect = document.getElementById('full_milestone_tier');
            const scopeInput = document.getElementById('full_inv_scope');
            const prjKey = document.getElementById('contract-project-select')?.value;
            const clientName = document.getElementById('full_inv_client')?.value || 'Client';

            // Reset button borders
            ['m1', 'm2', 'm3'].forEach(t => {
                const btn = document.getElementById(`btn-milestone-${t}`);
                if (btn) {
                    btn.classList.remove('border-2', 'border-amber-400', 'border-blue-400', 'border-emerald-400', 'bg-white/15');
                    btn.classList.add('border', 'border-white/20', 'bg-white/5');
                }
            });

            const activeBtn = document.getElementById(`btn-milestone-${tier}`);
            if (activeBtn) {
                activeBtn.classList.remove('border', 'border-white/20', 'bg-white/5');
                activeBtn.classList.add('border-2', tier === 'm1' ? 'border-amber-400' : (tier === 'm2' ? 'border-blue-400' : 'border-emerald-400'), 'bg-white/15');
            }

            if (tierSelect) tierSelect.value = tier;

            let gross = 0;
            if (tier === 'm1') {
                if (pctInput) pctInput.value = 65;
                gross = Math.round(cv * 0.65);
                if (scopeInput) scopeInput.value = `Milestone 1 (65%): Advance on Signing & Equipment Procurement for ${clientName}`;
                window.CURRENT_BOQ_ITEMS = window.MILESTONE_BOQ_TEMPLATES.m1(gross);
                document.getElementById('full_inv_no').value = `INV-2026-091`;
            } else if (tier === 'm2') {
                if (pctInput) pctInput.value = 30;
                gross = Math.round(cv * 0.30);
                if (scopeInput) scopeInput.value = `Milestone 2 (30%): Equipment Delivery at Factory Gate / Delivery Pass for ${clientName}`;
                window.CURRENT_BOQ_ITEMS = window.MILESTONE_BOQ_TEMPLATES.m2(gross);
                document.getElementById('full_inv_no').value = `INV-2026-092`;
            } else if (tier === 'm3') {
                if (pctInput) pctInput.value = 5;
                gross = Math.round(cv * 0.05);
                if (scopeInput) scopeInput.value = `Milestone 3 (5%): Site Testing, Commissioning & Handover signoff for ${clientName}`;
                window.CURRENT_BOQ_ITEMS = window.MILESTONE_BOQ_TEMPLATES.m3(gross);
                document.getElementById('full_inv_no').value = `INV-2026-093`;
            } else {
                if (pctInput) pctInput.value = 100;
                gross = cv;
                if (scopeInput) scopeInput.value = `Turnkey MEP Contracting Scope Deliverables for ${clientName}`;
                window.CURRENT_BOQ_ITEMS = [
                    { desc: 'Engineering Procurement & Installation Deliverable Item', qty: 1, unit: 'Job', rate: cv }
                ];
            }

            renderBOQRows();
            calculateFullInvoiceForm();
        };

        window.onMilestoneTierDropdownChanged = (val) => {
            selectMilestoneTier(val);
        };

        // =========================================================================
        // BOQ ITEM ROW MANAGEMENT
        // =========================================================================
        window.renderBOQRows = () => {
            const container = document.getElementById('boq-items-container');
            if (!container) return;

            container.innerHTML = window.CURRENT_BOQ_ITEMS.map((item, idx) => `
                <div class="p-2.5 rounded-lg border border-slate-200 bg-slate-50/80 hover:bg-slate-50 transition space-y-1.5">
                    <div class="flex items-center justify-between gap-2">
                        <span class="text-[9px] font-bold text-slate-500 uppercase tracking-wider">Deliverable #${idx + 1}</span>
                        ${window.CURRENT_BOQ_ITEMS.length > 1 ? `
                            <button type="button" onclick="removeBOQRow(${idx})" class="text-rose-500 hover:text-rose-700 text-[10px] font-semibold transition" title="Remove Item">
                                <i class="fas fa-trash-alt"></i> Delete

                        <div class="col-span-3">
                            <label class="block text-[8px] font-bold text-slate-400 uppercase">Qty</label>
                            <input type="number" value="${item.qty}" oninput="updateBOQField(${idx}, 'qty', parseFloat(this.value)||0)" class="w-full border border-slate-200 rounded p-1 text-center font-bold font-mono bg-white outline-none">

                        <div class="col-span-3">

                unit: 'Job',

                window.CURRENT_BOQ_ITEMS.splice(index, 1);
                renderBOQRows();
                calculateFullInvoiceForm();
            }
        };

        window.updateBOQField = (index, field, value) => {

                window.CURRENT_BOQ_ITEMS[index][field] = value;
                calculateFullInvoiceForm();
            }
        };

        // =========================================================================
        // CALCULATION ENGINE & GL DOUBLE-ENTRY PREVIEW
        // =========================================================================
        window.calculateFullInvoiceForm = () => {
            let gross = 0;
            window.CURRENT_BOQ_ITEMS.forEach(it => {
                gross += (it.qty || 0) * (it.rate || 0);
            });

            const taxRate = parseFloat(document.getElementById('full_tax_rate')?.value) || 0.18;
            const retRate = parseFloat(document.getElementById('full_retention_rate')?.value) || 0.05;
            const whtRate = parseFloat(document.getElementById('full_wht_rate')?.value) || 0.045;

            const salesTax = Math.round(gross * taxRate);
            const retention = Math.round(gross * retRate);
            const wht = Math.round(gross * whtRate);
            const totalDebitAR = gross + salesTax;
            const net = totalDebitAR - retention - wht;

            // Subtotal gross in Column 2
            const subGrossEl = document.getElementById('lbl-subtotal-gross');
            if (subGrossEl) subGrossEl.innerText = 'PKR ' + gross.toLocaleString();

            const cv = parseFloat(document.getElementById('full_contract_val')?.value) || 0;
            const pct = parseFloat(document.getElementById('full_milestone_pct')?.value) || 65;
            const targetVal = Math.round(cv * (pct / 100));
            const targetEl = document.getElementById('lbl-target-milestone-val');
            if (targetEl) {
                const diff = gross - targetVal;
                targetEl.innerText = `Target: PKR ${targetVal.toLocaleString()} (${diff === 0 ? 'Exact Match' : (diff > 0 ? '+PKR ' + diff.toLocaleString() : '-PKR ' + Math.abs(diff).toLocaleString())})`;
            }

            // Live Hero Summary Card in Column 3
            const heroGross = document.getElementById('hero-gross');
            if (heroGross) heroGross.innerText = 'PKR ' + gross.toLocaleString();

            const heroTax = document.getElementById('hero-tax');
            if (heroTax) heroTax.innerText = '+ PKR ' + salesTax.toLocaleString();

            const heroTaxLabel = document.getElementById('hero-tax-label');
            if (heroTaxLabel) {
                const taxName = taxRate === 0.13 ? '13% SRB' : (taxRate === 0.16 ? '16% PRA' : (taxRate === 0.15 ? '15% KPRA' : (taxRate === 0.18 ? '18% FBR' : '0% Exempt')));
                heroTaxLabel.innerText = `Sales Tax (+ ${taxName}):`;
            }

            const heroRet = document.getElementById('hero-retention');
            if (heroRet) heroRet.innerText = '- PKR ' + retention.toLocaleString();

            const heroWht = document.getElementById('hero-wht');
            if (heroWht) heroWht.innerText = '- PKR ' + wht.toLocaleString();

            const heroNet = document.getElementById('hero-net');
            if (heroNet) heroNet.innerText = 'PKR ' + net.toLocaleString();

            // GL Double Entry Preview
            const glDrAr = document.getElementById('gl-dr-ar');
            if (glDrAr) glDrAr.innerText = 'PKR ' + totalDebitAR.toLocaleString();

            const glCrRev = document.getElementById('gl-cr-rev');
            if (glCrRev) glCrRev.innerText = 'PKR ' + gross.toLocaleString();

            const glCrTax = document.getElementById('gl-cr-tax');
            if (glCrTax) glCrTax.innerText = 'PKR ' + salesTax.toLocaleString();
        };

        // =========================================================================
        // SUBMIT INVOICE & POST TO FINANCE GL
        // =========================================================================
        window.submitFullProjectInvoice = () => {
            const invNo = document.getElementById('full_inv_no').value || ('INV-2026-' + Date.now().toString().slice(-4));
            const client = document.getElementById('full_inv_client').value;
            const ntn = document.getElementById('full_inv_ntn').value || '2847192-3';
            const strn = document.getElementById('full_inv_strn').value || '17-00-2847-192-12';
            const site = document.getElementById('full_inv_site').value;
            const scope = document.getElementById('full_inv_scope').value || 'Milestone Scope Deliverable';
            const contractRef = document.getElementById('full_inv_contract_ref').value || 'PO-2026-GEN';
            const contractVal = parseFloat(document.getElementById('full_contract_val').value) || 0;
            const milestoneTier = window.currentSelectedTier || 'm1';
            const milestonePct = parseFloat(document.getElementById('full_milestone_pct').value) || 65;
            const prjKey = document.getElementById('contract-project-select').value;
            const date = document.getElementById('full_inv_date').value || '2026-09-28';

            let gross = 0;
            window.CURRENT_BOQ_ITEMS.forEach(it => {
                gross += (it.qty || 0) * (it.rate || 0);
            });

            const taxRate = parseFloat(document.getElementById('full_tax_rate').value) || 0.18;
            const retRate = parseFloat(document.getElementById('full_retention_rate').value) || 0.05;
            const whtRate = parseFloat(document.getElementById('full_wht_rate').value) || 0.045;

            const salesTax = Math.round(gross * taxRate);
            const retention = Math.round(gross * retRate);
            const wht = Math.round(gross * whtRate);
            const net = (gross + salesTax) - (retention + wht);

            const taxTypeStr = taxRate === 0.13 ? '13% SRB' : (taxRate === 0.16 ? '16% PRA' : (taxRate === 0.15 ? '15% KPRA' : (taxRate === 0.18 ? '18% FBR' : '0% Exempt')));

            const milestoneLabels = {
                m1: 'Milestone 1 (65%): Advance on Signing & Equipment Procurement',
                m2: 'Milestone 2 (30%): Equipment Delivery at Factory Gate / Delivery Pass',
                m3: 'Milestone 3 (5%): Site Testing, Commissioning & Handover signoff',
                custom: 'Commercial Tax Invoice Deliverable'
            };

            const newInv = {
                id: invNo,
                milestoneTier: milestoneTier,
                milestoneLabel: milestoneLabels[milestoneTier] || scope,
                date: date,
                client: client,
                ntn: ntn,
                strn: strn,
                site: site,
                city: site.includes('Lahore') ? 'Lahore' : (site.includes('Rawalpindi') ? 'Rawalpindi' : (site.includes('Pezu') ? 'Pezu' : (site.includes('Daharki') ? 'Daharki' : 'Karachi'))),
                scope: scope,
                projectRef: prjKey !== 'CUSTOM' ? prjKey : 'PRJ-2026-GEN',
                contractRef: contractRef,
                contractValue: contractVal,
                milestonePct: milestonePct,
                taxType: taxTypeStr,
                taxRate: taxRate,
                gross: gross,
                salesTax: salesTax,
                retentionRate: retRate,
                retention: retention,
                whtRate: whtRate,
                wht: wht,
                net: net,
                status: 'Submitted to Client',
                statusClass: 'bg-blue-100 text-blue-800',
                lines: JSON.parse(JSON.stringify(window.CURRENT_BOQ_ITEMS))
            };

            // Post to Finance GL & AR Aging
            const postResult = CosmixFinance.postSalesInvoiceJournal({
                id: invNo,
                client: client,
                projectRef: newInv.projectRef,
                contractRef: contractRef,
                milestoneLabel: newInv.milestoneLabel,
                date: date,
                gross: gross,
                salesTax: salesTax,
                taxType: taxTypeStr,
                net: net,
                projectKey: prjKey !== 'CUSTOM' ? prjKey : null,
                milestoneKey: milestoneTier
            });

            window.INVOICES_DATA.unshift(newInv);

            window.showInvoicesListView();
            
            showToast(`Invoice ${invNo} posted! GL Voucher: ${postResult.jv ? postResult.jv.voucherNo : 'JV-Posted'} (Dr 1200 AR PKR ${(gross + salesTax).toLocaleString()}). AR Aging updated!`, 'success');
        };

        // =========================================================================
        // TABLE RENDERING & FILTERING
        // =========================================================================
        window.currentTab = 'all';

        window.renderInvoicesTable = () => {
            const tbody = document.getElementById('invoices-table-body');
            if (!tbody) return;

            const searchVal = (document.getElementById('invoice-search')?.value || '').toLowerCase().trim();
            const clientVal = (document.getElementById('client-select-filter')?.value || '').trim();
            const statusVal = (document.getElementById('status-select-filter')?.value || '').trim();

            const filtered = window.INVOICES_DATA.filter(inv => {
                if (window.currentTab !== 'all') {
                    if (window.currentTab === 'commercial' && inv.milestoneTier !== 'commercial' && inv.milestoneTier !== 'custom') return false;
                    if (window.currentTab !== 'commercial' && inv.milestoneTier !== window.currentTab) return false;
                }
                if (clientVal && !inv.client.includes(clientVal)) return false;
                if (statusVal && inv.status !== statusVal) return false;
                if (searchVal) {
                    const match = inv.id.toLowerCase().includes(searchVal) ||
                                  inv.client.toLowerCase().includes(searchVal) ||
                                  inv.site.toLowerCase().includes(searchVal) ||
                                  inv.scope.toLowerCase().includes(searchVal);
                    if (!match) return false;
                }
                return true;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="12" class="text-center py-8 text-slate-400 font-medium">
                            No milestone invoices match your selected filters.
                        </td>
                    </tr>
                `;
                return;
            }

                    badgeClass = 'bg-blue-50 text-blue-700 border-blue-200';
                    tierTag = '30% Delivery (M2)';

                    badgeClass = 'bg-emerald-50 text-emerald-700 border-emerald-200';
                    tierTag = '5% Handover (M3)';
                } else if (inv.milestoneTier === 'commercial') {
                    badgeClass = 'bg-purple-50 text-purple-700 border-purple-200';

                }

                return `
                    <tr class="hover:bg-slate-50 transition group cursor-pointer" onclick="showViewInvoicePage('${inv.id}')">

                            <div class="flex items-center gap-1.5">
                                <i class="fas fa-file-invoice text-indigo-600 text-xs"></i>
                                <span>${inv.id}</span>
                            </div>
                        </td>
                        <td class="whitespace-nowrap text-slate-600 font-medium font-mono text-[11px]">${inv.date}</td>

                                <i class="fas fa-circle text-[6px]"></i> ${tierTag}

                        </td>
                        <td>

                        <td>

                            <p class="text-[9px] text-slate-400 font-mono mt-0.5">${inv.contractRef || inv.projectRef}</p>
                        </td>
                        <td>
                            <span class="bg-slate-100 text-slate-700 border border-slate-200 px-1.5 py-0.5 rounded text-[9.5px] font-bold font-mono">
                                ${inv.taxType}
                            </span>
                        </td>
                        <td class="text-right font-mono font-semibold text-slate-900 whitespace-nowrap">
                            PKR ${inv.gross.toLocaleString()}

                        <td class="text-right font-mono text-emerald-700 whitespace-nowrap">
                            +PKR ${inv.salesTax.toLocaleString()}
                        </td>
                        <td class="text-right font-mono text-purple-700 whitespace-nowrap">
                            ${inv.retention > 0 ? '-PKR ' + inv.retention.toLocaleString() : '<span class="text-slate-300">-</span>'}
                        </td>
                        <td class="text-right font-mono font-bold text-[#1e2552] whitespace-nowrap">

                            </span>

                                        <i class="fas fa-check-circle text-[11px]"></i>
                                    </button>
                                ` : `
                                    <span class="w-7 h-7 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center text-[10px]" title="Settled">
                                        <i class="fas fa-check-double"></i>
                                    </span>
                                `}
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

        window.filterInvoiceTab = (tab, btn) => {
            window.currentTab = tab;
            document.querySelectorAll('.invoice-tab-btn').forEach(b => {
                b.classList.remove('bg-[#1e2552]', 'text-white', 'shadow-xs', 'font-bold');
                b.classList.add('text-slate-600', 'font-semibold');

            btn.classList.add('bg-[#1e2552]', 'text-white', 'shadow-xs', 'font-bold');
            btn.classList.remove('text-slate-600', 'font-semibold');

        };

        window.updateKPIStats = () => {
            let totalBilled = 0;
            let cleared = 0;
            let receivables = 0;
            let retention = 0;
