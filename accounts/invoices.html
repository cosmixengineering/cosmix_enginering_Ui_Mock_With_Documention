<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmix ERP - Invoices & Project Billing Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html { font-size: 13px !important; } 
        body { font-family: 'Inter', sans-serif; } 
        table th { padding: 0.45rem 0.75rem !important; font-size: 0.72rem !important; } 
        table td { padding: 0.45rem 0.75rem !important; font-size: 0.78rem !important; }
        .stamp-official {
            border: 2px solid #15803d;
            color: #15803d;
            transform: rotate(2deg);
            padding: 4px 8px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            border-radius: 4px;
        }
    </style>
</head>
<body class="text-gray-800 bg-[#f8fafc]">
    <div id="app-layout" class="flex min-h-screen"></div>

    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/shared.js"></script>
    <script>
        renderLayout('invoices');
        setPageContent('Client Invoices & Project Billing Engine', `
            <div class="space-y-4">
                
                <!-- ========================================================================= -->
                <!-- VIEW 1: Master Invoices & IPCs Directory Table View                       -->
                <!-- ========================================================================= -->
                <div id="invoices-list-view" class="space-y-4">
                    
                    <!-- Header: Invoicing Operations & Quick Actions -->
                    <div class="flex flex-wrap items-center justify-between gap-3 bg-white p-3.5 rounded-xl shadow-xs border border-gray-100">
                        <div>
                            <div class="flex items-center gap-2">
                                <h2 class="text-sm font-bold text-gray-800">Project Billing & Milestone IPCs (Interim Payment Certificates)</h2>
                                <span class="bg-purple-50 text-purple-700 text-[9px] font-bold px-2 py-0.5 rounded-full border border-purple-200">
                                    SRB / PRA / KPRA / FBR Tax Engine
                                </span>
                            </div>
                            <p class="text-[10.5px] text-gray-400 mt-0.5">Generate client tax invoices, site milestone payment certificates, retention tracking, and sales tax registers.</p>
                        </div>

                        <div class="flex flex-wrap items-center gap-2">
                            <div class="flex items-center bg-gray-100 p-0.5 rounded-lg text-xs font-bold">
                                <span class="px-2.5 py-1 rounded-md bg-white text-[#242b5f] shadow-2xs flex items-center gap-1.5">
                                    <i class="fas fa-file-invoice text-purple-600"></i> Client Billing (IPCs)
                                </span>
                                <a href="purchases.html" class="px-2.5 py-1 rounded-md text-gray-600 hover:text-gray-900 transition flex items-center gap-1.5">
                                    <i class="fas fa-truck-loading text-amber-600"></i> Supply & Expenses (Payables)
                                </a>
                            </div>

                            <!-- Big Form Trigger: Opens Full-Page View (Just like Add Employee) -->
                            <button onclick="showCreateInvoiceForm()" class="bg-[#242b5f] hover:bg-opacity-90 text-white px-3.5 py-1.5 rounded-lg text-xs font-bold shadow-sm transition flex items-center gap-1.5">
                                <i class="fas fa-plus-circle text-amber-300"></i> + Create New Invoice / IPC
                            </button>
                            <button onclick="exportToExcel('Cosmix_Full_Invoice_Register')" class="bg-white border border-gray-200 hover:border-green-600 text-gray-700 hover:text-green-700 px-2.5 py-1.5 rounded-lg text-xs font-semibold shadow-2xs transition flex items-center gap-1.5">
                                <i class="fas fa-file-excel text-green-600"></i> Export Tax Register

                    </div>

                    <!-- 4 Financial Summary Stat Cards -->

                            <h4 id="stat-total-billed" class="text-lg font-extrabold text-gray-900 mt-0.5">Rs. 48,650,000</h4>
                            <p class="text-[9px] text-emerald-600 font-semibold mt-1"><i class="fas fa-check-circle mr-0.5"></i> <span id="stat-ipc-count">24</span> Project Milestone IPCs</p>
                        </div>
                        <div class="bg-white p-3 rounded-xl border border-gray-100 shadow-xs">
                            <p class="text-[9px] text-gray-400 font-bold uppercase tracking-wider">Realized / Cleared</p>
                            <h4 class="text-lg font-extrabold text-emerald-700 mt-0.5">Rs. 34,370,000</h4>
                            <p class="text-[9px] text-gray-400 mt-1">Deposited into Meezan & HBL</p>
                        </div>
                        <div class="bg-white p-3 rounded-xl border border-amber-100 shadow-xs">
                            <p class="text-[9px] text-amber-700 font-bold uppercase tracking-wider">Outstanding Receivables</p>
                            <h4 id="stat-receivables" class="text-lg font-extrabold text-amber-600 mt-0.5">Rs. 14,280,000</h4>
                            <p class="text-[9px] text-amber-700 font-semibold mt-1"><i class="fas fa-clock mr-0.5"></i> 8 IPCs under consultant audit</p>
                        </div>
                        <div class="bg-white p-3 rounded-xl border border-purple-100 shadow-xs">
                            <p class="text-[9px] text-purple-700 font-bold uppercase tracking-wider">Client Retention Money (5%)</p>
                            <h4 class="text-lg font-extrabold text-purple-700 mt-0.5">Rs. 2,432,500</h4>
                            <p class="text-[9px] text-gray-400 mt-1">Releasable on Defect Liability</p>
                        </div>
                    </div>

                    <!-- Filters & Category Navigation Bar -->
                    <div class="bg-white p-3 rounded-xl shadow-xs border border-gray-100 flex flex-wrap items-center justify-between gap-3">
                        <!-- Tab Buttons -->
                        <div class="flex items-center gap-1.5 overflow-x-auto pb-1 sm:pb-0">
                            <button onclick="filterInvoiceTab('all', this)" class="invoice-tab-btn px-3 py-1 text-xs font-bold rounded-lg bg-[#242b5f] text-white shadow-2xs transition">All Invoices (24)</button>
                            <button onclick="filterInvoiceTab('ipc', this)" class="invoice-tab-btn px-3 py-1 text-xs font-semibold rounded-lg text-gray-600 hover:bg-gray-100 transition">Site IPCs (14)</button>
                            <button onclick="filterInvoiceTab('commercial', this)" class="invoice-tab-btn px-3 py-1 text-xs font-semibold rounded-lg text-gray-600 hover:bg-gray-100 transition">Tax Invoices (6)</button>
                            <button onclick="filterInvoiceTab('advance', this)" class="invoice-tab-btn px-3 py-1 text-xs font-semibold rounded-lg text-gray-600 hover:bg-gray-100 transition">Mobilization Advance (4)</button>
                        </div>

                        <!-- Search and Client Filter -->
                        <div class="flex items-center gap-2">
                            <div class="relative">
                                <i class="fas fa-search absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400 text-[10px]"></i>
                                <input id="invoice-search" type="text" oninput="filterInvoicesTable()" placeholder="Search invoice #, client, site..." class="bg-gray-50 border border-gray-200 text-xs rounded-md pl-7 pr-3 py-1 focus:bg-white focus:outline-none focus:ring-1 focus:ring-[#242b5f] w-52">
                            </div>
                            <select id="client-select-filter" onchange="filterInvoicesTable()" class="bg-gray-50 border border-gray-200 text-xs rounded-md px-2 py-1 focus:outline-none focus:ring-1 focus:ring-[#242b5f]">
                                <option value="">All Clients</option>
                                <option value="Lucky Landmark">Lucky Landmark (Pvt) Ltd</option>
                                <option value="Packages Real Estate">Packages Real Estate Ltd</option>
                                <option value="Engro Fertilizers">Engro Fertilizers Complex</option>
                                <option value="Lucky Cement">Lucky Cement Industrial Plant</option>
                                <option value="DHA City">DHA City Sector 3</option>
                                <option value="Bahria Town">Bahria Town Civic Center</option>
                            </select>
                        </div>
                    </div>

                    <!-- Master Invoices & IPCs Data Table -->
                    <div class="bg-white rounded-xl shadow-xs border border-gray-100 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse" id="invoices-main-table">
                                <thead>
                                    <tr class="bg-gray-50/80 border-b border-gray-100 text-gray-500 font-bold">
                                        <th>Invoice / IPC #</th>
                                        <th>Date</th>
                                        <th>Client / Company</th>
                                        <th>Project Site</th>
                                        <th>Billing Scope</th>
                                        <th>Sales Tax</th>
                                        <th class="text-right">Gross (PKR)</th>
                                        <th class="text-right">Retention (5%)</th>
                                        <th class="text-right">Net Payable</th>
                                        <th class="text-center">Status</th>
                                        <th class="text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100 text-xs" id="invoices-table-body">
                                    <!-- Populated dynamically by JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>
                <!-- End #invoices-list-view -->


                <!-- ========================================================================= -->
                <!-- VIEW 2: DEDICATED FULL-PAGE INVOICE CREATION FORM (LIKE ADD EMPLOYEE)     -->
                <!-- ========================================================================= -->
                <div id="invoice-create-form-view" class="space-y-4 hidden">
                    
                    <!-- Top Action & Navigation Bar -->
                    <div class="bg-white p-4 rounded-xl shadow-xs border border-slate-200/80 flex flex-wrap items-center justify-between gap-3">
                        <div class="flex items-center gap-3">
                            <button type="button" onclick="showInvoicesListView()" class="w-9 h-9 rounded-xl border border-slate-200 hover:border-[#242b5f] text-slate-600 hover:text-[#242b5f] bg-white flex items-center justify-center transition shadow-2xs group" title="Back to All Invoices">
                                <i class="fas fa-arrow-left text-xs transition-transform group-hover:-translate-x-0.5"></i>
                            </button>
                            <div>
                                <div class="flex items-center gap-2">
                                    <h2 class="text-base font-bold text-slate-900 tracking-tight">Generate New Project Billing Invoice / Milestone IPC</h2>
                                    <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[9.5px] font-bold bg-purple-50 text-purple-700 border border-purple-200">
                                        <i class="fas fa-calculator text-[8.5px]"></i> Automatic Tax & Retention Calculation
                                    </span>
                                </div>
                                <p class="text-xs text-slate-500 mt-0.5">Enter client contracting details, BOQ line item quantities, provincial sales tax, and payment advice</p>
                            </div>
                        </div>

                        <div class="flex items-center gap-2">
                            <button type="button" onclick="showInvoicesListView()" class="px-3.5 py-2 text-xs font-semibold text-slate-600 hover:text-slate-800 hover:bg-slate-100 rounded-lg transition flex items-center gap-1">
                                <i class="fas fa-times text-[10px]"></i> Cancel
                            </button>
                            <button type="button" onclick="submitFullProjectInvoice()" class="bg-[#242b5f] hover:bg-[#1b214a] text-white px-5 py-2 rounded-lg text-xs font-bold shadow-md shadow-indigo-950/20 hover:shadow-lg transition-all flex items-center gap-1.5 active:scale-95">
                                <i class="fas fa-check-circle text-amber-300"></i> Save & Generate Tax Invoice
                            </button>
                        </div>
                    </div>

                    <!-- 3-Column Wide Horizontal Layout Across Full Screen -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 sm:gap-5">
                        
                        <!-- ================= COLUMN 1: Client & Project Site Details ================= -->
                        <div class="space-y-4 flex flex-col">
                            
                            <!-- 1. Agreement & Billing Type -->
                            <div class="bg-white p-4 rounded-xl border border-slate-200/80 space-y-3.5 shadow-2xs">
                                <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                                    <h4 class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                                        <span class="w-4 h-4 rounded-full bg-[#242b5f] text-white flex items-center justify-center text-[9px] font-bold">1</span>
                                        Billing Type & Invoice Identification
                                    </h4>
                                    <span class="text-[9px] text-red-500 font-bold">* Required</span>
                                </div>

                                <div class="space-y-2.5">
                                    <div>
                                        <label class="block text-[10.5px] font-bold text-slate-700 mb-1">Billing Certificate Type <span class="text-red-500">*</span></label>
                                        <select id="full_inv_type" onchange="calculateFullInvoiceForm()" class="w-full border border-slate-200 rounded-lg px-2.5 py-2 text-xs bg-white text-slate-800 focus:outline-none focus:border-[#242b5f] font-semibold shadow-2xs">
                                            <option value="ipc">📑 Interim Payment Certificate (IPC Milestone Work)</option>
                                            <option value="commercial">📄 Sales Tax Commercial Invoice</option>
                                            <option value="advance">💰 Mobilization Advance Request (10% Initial)</option>
                                        </select>
                                    </div>

                                    <div class="grid grid-cols-2 gap-2">
                                        <div>
                                            <label class="block text-[10px] font-bold text-slate-700 mb-1">Invoice / IPC # <span class="text-red-500">*</span></label>
                                            <input id="full_inv_no" type="text" value="INV-2026-090" class="w-full border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs bg-slate-100 font-mono font-bold text-[#242b5f] outline-none" readonly>
                                        </div>
                                        <div>
                                            <label class="block text-[10px] font-bold text-slate-700 mb-1">Invoice Date <span class="text-red-500">*</span></label>
                                            <input id="full_inv_date" type="date" value="2026-09-28" class="w-full border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs bg-white text-slate-800 font-medium focus:border-[#242b5f] outline-none">
                                        </div>
                                    </div>

                                    <div class="grid grid-cols-2 gap-2">
                                        <div>
                                            <label class="block text-[10px] font-bold text-slate-700 mb-1">Payment Due Terms</label>
                                            <select id="full_inv_terms" class="w-full border border-slate-200 rounded-lg px-2 py-1.5 text-xs bg-white text-slate-800 focus:outline-none">
                                                <option value="Net 30 Days">Net 30 Days (Standard)</option>
                                                <option value="Net 15 Days">Net 15 Days (Urgent)</option>
                                                <option value="Net 45 Days">Net 45 Days</option>
                                                <option value="Immediate on Consultant Sign-off">Immediate on Sign-off</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label class="block text-[10px] font-bold text-slate-700 mb-1">Client PO / Contract Ref</label>
                                            <input id="full_inv_contract_ref" type="text" value="PO-LND-2026-9812" class="w-full border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs bg-white text-slate-800 font-mono outline-none focus:border-[#242b5f]">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- 2. Client & Project Site Location -->
                            <div class="bg-white p-4 rounded-xl border border-slate-200/80 space-y-3 shadow-2xs flex-1">
                                <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                                    <h4 class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                                        <span class="w-4 h-4 rounded-full bg-[#242b5f] text-white flex items-center justify-center text-[9px] font-bold">2</span>
                                        Client Enterprise & Project Site
                                    </h4>
                                    <span class="text-[9px] text-purple-700 font-bold bg-purple-50 px-2 py-0.5 rounded">Corporate Client</span>
                                </div>

                                <div class="space-y-2.5">
                                    <div>
                                        <label class="block text-[10.5px] font-bold text-slate-700 mb-1">Client / Enterprise Name <span class="text-red-500">*</span></label>
                                        <select id="full_inv_client" onchange="syncClientData(this.value)" class="w-full border border-slate-200 rounded-lg px-2.5 py-2 text-xs bg-white text-slate-800 focus:outline-none focus:border-[#242b5f] font-semibold shadow-2xs">
                                            <option value="Lucky Landmark (Pvt) Ltd">Lucky Landmark (Pvt) Ltd (NTN: 0819234-2)</option>
                                            <option value="Packages Real Estate Ltd">Packages Real Estate Ltd (NTN: 1249871-5)</option>
                                            <option value="Engro Fertilizers Complex">Engro Fertilizers Complex (NTN: 0711928-8)</option>
                                            <option value="Lucky Cement Industrial Plant">Lucky Cement Industrial Plant (NTN: 0981245-1)</option>
                                            <option value="DHA City Sector 3 Commercial">DHA City Sector 3 Commercial (NTN: 3318291-0)</option>
                                            <option value="Bahria Town Civic Center">Bahria Town Civic Center (NTN: 2281903-4)</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label class="block text-[10.5px] font-bold text-slate-700 mb-1">Project Site Location & Region <span class="text-red-500">*</span></label>
                                        <select id="full_inv_site" onchange="syncTaxWithSite(this.value)" class="w-full border border-slate-200 rounded-lg px-2.5 py-2 text-xs bg-white text-slate-800 focus:outline-none focus:border-[#242b5f] font-semibold shadow-2xs">
                                            <option value="Lucky One Mall, Karachi">Lucky One Mall, Karachi (Sindh)</option>
                                            <option value="Packages Mall, Lahore">Packages Mall, Lahore (Punjab)</option>
                                            <option value="Engro Complex, Daharki">Engro Complex, Daharki (Sindh)</option>
                                            <option value="Lucky Cement Plant, Pezu KPK">Lucky Cement Plant, Pezu KPK (Khyber Pakhtunkhwa)</option>
                                            <option value="DHA City Sector 3 Commercial, Karachi">DHA City Sector 3 Commercial, Karachi (Sindh)</option>
                                            <option value="Bahria Town Civic Center, Rawalpindi">Bahria Town Civic Center, Rawalpindi (Punjab)</option>
                                            <option value="Head Office PECHS, Karachi">Head Office PECHS, Karachi (Sindh)</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label class="block text-[10.5px] font-bold text-slate-700 mb-1">Engineering Milestone / Scope Header <span class="text-red-500">*</span></label>
                                        <input id="full_inv_scope" type="text" value="Chilled Water Pipe Insulation & Valve Automation - 3rd Floor" class="w-full border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs text-slate-800 outline-none focus:border-[#242b5f] font-medium" placeholder="e.g. Chiller Commissioning, Fire Hydrant Installation">
                                    </div>
                                </div>
                            </div>

                        </div>

                        <!-- ================= COLUMN 2: Line Items & Measurement Breakdown (BOQ) ================= -->
                        <div class="space-y-4 flex flex-col">
                            <div class="bg-white p-4 rounded-xl border border-slate-200/80 space-y-3 flex-1 shadow-2xs">
                                <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                                    <div class="flex items-center gap-1.5">
                                        <span class="w-4 h-4 rounded-full bg-[#242b5f] text-white flex items-center justify-center text-[9px] font-bold">3</span>
                                        <h4 class="text-xs font-bold text-slate-800">Bill of Quantities (BOQ) & Measurement Items</h4>
                                    </div>
                                    <button type="button" onclick="addBOQRow()" class="bg-indigo-50 hover:bg-indigo-100 text-[#242b5f] font-bold text-[10.5px] px-2.5 py-1 rounded-lg border border-indigo-200 transition flex items-center gap-1">
                                        <i class="fas fa-plus text-[9px]"></i> Add Item
                                    </button>
                                </div>

                                <p class="text-[10px] text-gray-500">
                                    Measurement quantities and rates as verified by site resident engineer and consulting inspectors.
                                </p>

                                <!-- Line Items Container -->
                                <div class="space-y-2 max-h-[380px] overflow-y-auto pr-1" id="boq-items-container">
                                    <!-- Populated dynamically by JS -->
                                </div>

                                <!-- Subtotal (Gross Sum) -->
                                <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-1.5 mt-2">
                                    <div class="flex justify-between items-center text-xs">
                                        <span class="font-bold text-slate-700 uppercase tracking-wider">Subtotal Gross Base Amount:</span>
                                        <span id="lbl-subtotal-gross" class="font-mono font-extrabold text-[#242b5f] text-sm">Rs. 5,000,000</span>
                                    </div>
                                    <p class="text-[9px] text-slate-400">Sum of all BOQ items before provincial sales tax and contract deductions.</p>
                                </div>

                                <!-- Client Verification Remarks -->
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-700 mb-1">Consultant Verification & Measurement Notes</label>
                                    <textarea id="full_inv_remarks" rows="2" class="w-full border border-slate-200 rounded-lg p-2 text-xs text-slate-700 outline-none focus:border-[#242b5f] resize-none" placeholder="All physical measurements cross-checked against DPR and consultant measurement sheets."></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- ================= COLUMN 3: Provincial Taxes & Live Financial Summary ================= -->
                        <div class="space-y-4 flex flex-col">
                            
                            <!-- Tax Deductions Setup -->
                            <div class="bg-white p-4 rounded-xl border border-slate-200/80 space-y-3 shadow-2xs">
                                <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                                    <h4 class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                                        <span class="w-4 h-4 rounded-full bg-[#242b5f] text-white flex items-center justify-center text-[9px] font-bold">4</span>
                                        Provincial Tax Engine & Deductions
                                    </h4>
                                    <span class="text-[9px] text-emerald-700 font-bold bg-emerald-50 px-2 py-0.5 rounded">FBR / SRB / PRA</span>
                                </div>

                                <div class="space-y-2.5">
                                    <div>
                                        <label class="block text-[10px] font-bold text-slate-700 mb-1">Provincial Sales Tax Authority <span class="text-red-500">*</span></label>
                                        <select id="full_tax_rate" onchange="calculateFullInvoiceForm()" class="w-full border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs bg-white text-slate-800 font-semibold focus:outline-none focus:border-[#242b5f]">
                                            <option value="0.13">13% SRB (Sindh Revenue Board Services)</option>
                                            <option value="0.16">16% PRA (Punjab Revenue Authority Services)</option>
                                            <option value="0.15">15% KPRA (Khyber Pakhtunkhwa Revenue Authority)</option>
                                            <option value="0.18">18% FBR (Federal GST on Goods / Supplies)</option>
                                            <option value="0.0">0% (Tax Exempt Project)</option>
                                        </select>
                                    </div>

                                    <div class="grid grid-cols-2 gap-2">
                                        <div>
                                            <label class="block text-[10px] font-bold text-slate-700 mb-1">Retention Money (Defect Liab.)</label>
                                            <select id="full_retention_rate" onchange="calculateFullInvoiceForm()" class="w-full border border-slate-200 rounded-lg px-2 py-1.5 text-xs bg-white text-slate-800 focus:outline-none">
                                                <option value="0.05">5% Standard Retention</option>
                                                <option value="0.10">10% Retention</option>
                                                <option value="0.0">0% None</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label class="block text-[10px] font-bold text-slate-700 mb-1">Income Tax WHT (Sec 153)</label>
                                            <select id="full_wht_rate" onchange="calculateFullInvoiceForm()" class="w-full border border-slate-200 rounded-lg px-2 py-1.5 text-xs bg-white text-slate-800 focus:outline-none">
                                                <option value="0.045">4.5% Active Filer Taxpayer</option>
                                                <option value="0.075">7.5% Standard Tax Rate</option>
                                                <option value="0.0">0% Exemption Certificate</option>
                                            </select>
                                        </div>
