        // ===== 1. RENDER EMPLOYEE ATTENDANCE ROSTER MATRIX (1-30 GRID) =====
        function renderRosterMatrix() {
            const tbody = document.getElementById('roster-matrix-body');
            if (!tbody) return;

            const statusMap = {
                'P': { label: 'P',  cls: 'bg-green-100 text-green-700 font-bold', title: 'Present' },
                'L': { label: 'L',  cls: 'bg-orange-100 text-orange-700 font-bold', title: 'Late Arrival' },
                'A': { label: 'A',  cls: 'bg-red-100 text-red-700 font-bold', title: 'Absent' },
                'LV':{ label: 'LV', cls: 'bg-purple-100 text-purple-700 font-bold', title: 'On Leave' },
                'H': { label: 'H',  cls: 'bg-blue-100 text-blue-700 font-bold', title: 'Holiday' },
                '-': { label: '-',  cls: 'bg-gray-50 text-gray-300', title: 'Weekly Off' },
            };

            let html = '';
            EMPLOYEES_LIST.forEach((emp, idx) => {
                const days = [];
                let pCount = 0, lCount = 0, aCount = 0, lvCount = 0;
                for (let d = 1; d <= 30; d++) {
                    let st;
                    if (offDays.has(d)) {
                        st = '-';
                    } else if (emp.pattern && emp.pattern[d]) {
                        st = emp.pattern[d];
                    } else if (d > 7) {
                        st = ''; // future days blank
                    } else {
                        const seed = (idx * 31 + d * 7) % 100;
                        if (seed < (emp.pattern?.lateChance || 0.05) * 100) st = 'L';
                        else st = 'P';
                    }
                    days.push(st);
                    if (st === 'P') pCount++;
                    else if (st === 'L') lCount++;
                    else if (st === 'A') aCount++;
                    else if (st === 'LV') lvCount++;
                }

                let cellsHTML = '';
                days.forEach((st, i) => {
                    const d = i + 1;
                    const isToday = d === 7;
                    const isOff = offDays.has(d);
                    const isFuture = d > 7 && st === '';
                    const todayBorder = isToday ? 'border-l-2 border-r-2 border-[#242b5f]' : '';
                    const offBg = isOff ? 'bg-gray-50' : '';

                    if (isFuture) {
                        cellsHTML += `<td class="px-0.5 py-1.5 text-center border-r border-gray-50 ${offBg}"><span class="text-[8px] text-gray-200">—</span></td>`;
                    } else {
                        const s = statusMap[st] || statusMap['P'];
                        cellsHTML += `<td class="px-0.5 py-1.5 text-center border-r border-gray-50 ${todayBorder} ${offBg}" title="${d} Sep: ${s.title}"><span class="inline-block w-5 h-4 leading-4 rounded text-[7.5px] ${s.cls}">${s.label}</span></td>`;
                    }
                });

                const summaryHTML = `
                    <td class="px-1 py-1.5 text-center border-r border-gray-100 bg-green-50/30 font-bold text-[9px] text-green-700">${pCount}</td>
                    <td class="px-1 py-1.5 text-center border-r border-gray-100 bg-orange-50/30 font-bold text-[9px] text-orange-700">${lCount}</td>
                    <td class="px-1 py-1.5 text-center border-r border-gray-100 bg-red-50/30 font-bold text-[9px] text-red-700">${aCount}</td>
                    <td class="px-1 py-1.5 text-center border-r border-gray-100 bg-purple-50/30 font-bold text-[9px] text-purple-700">${lvCount}</td>
                `;

                const actionHTML = `
                    <td class="px-1 py-1.5 text-center">
                        <a href="employee-profile.html?id=${emp.empId}" class="inline-flex items-center justify-center w-6 h-5 rounded bg-gray-100 hover:bg-[#242b5f] hover:text-white text-gray-600 text-[10px] transition" title="View Full Worker Profile">
                            <i class="fas fa-id-badge"></i>
                        </a>
                    </td>
                `;

                html += `
                    <tr class="hover:bg-blue-50/20 transition group roster-row" data-name="${emp.name.toLowerCase()}" data-dept="${emp.category}">
                        <td class="px-2.5 py-1.5 sticky left-0 bg-white group-hover:bg-blue-50/20 z-10 border-r border-gray-200">
                            <div class="flex items-center gap-2">
                                <div class="w-6 h-6 rounded-full ${emp.color} flex items-center justify-center font-bold text-[8px] flex-shrink-0">${emp.initials}</div>
                                <div class="min-w-0">
                                    <a href="employee-profile.html?id=${emp.empId}" class="font-bold text-[10px] text-[#242b5f] hover:underline block leading-tight truncate">${emp.name}</a>
                                    <p class="text-[8px] text-gray-400 truncate">${emp.empId} • ${emp.site}</p>
                                </div>
                            </div>
                        </td>
                        ${cellsHTML}
                        ${summaryHTML}
                        ${actionHTML}
                    </tr>
                `;
            });

            // Footer summary row
            html += `
                <tr class="bg-gray-50 border-t-2 border-gray-200 font-bold">
                    <td class="px-2.5 py-2 sticky left-0 bg-gray-50 z-10 border-r border-gray-200">
                        <span class="text-[9px] font-extrabold text-[#242b5f] uppercase tracking-wider">Total / Org Turnout</span>
                    </td>
                    ${Array.from({length:30}, (_,i) => {
                        const d = i+1;
                        if (offDays.has(d)) return '<td class="px-0.5 py-2 text-center border-r border-gray-100 bg-gray-100"><span class="text-[7.5px] text-gray-400 font-bold">OFF</span></td>';
                        if (d > 7) return '<td class="px-0.5 py-2 text-center border-r border-gray-100"><span class="text-[7.5px] text-gray-300">—</span></td>';
                        const counts = [142,143,141,142,144,0,142];
                        const c = counts[d-1] || 142;
                        return `<td class="px-0.5 py-2 text-center border-r border-gray-100"><span class="text-[7.5px] text-green-700 font-extrabold">${c}</span></td>`;
                    }).join('')}
                    <td class="px-1 py-2 text-center border-r border-gray-100 bg-green-50/30"><span class="text-[9px] text-green-800 font-extrabold">94.6%</span></td>
                    <td class="px-1 py-2 text-center border-r border-gray-100 bg-orange-50/30"><span class="text-[9px] text-orange-800 font-extrabold">3.2%</span></td>
                    <td class="px-1 py-2 text-center border-r border-gray-100 bg-red-50/30"><span class="text-[9px] text-red-800 font-extrabold">1.4%</span></td>
                    <td class="px-1 py-2 text-center border-r border-gray-100 bg-purple-50/30"><span class="text-[9px] text-purple-800 font-extrabold">0.8%</span></td>
                    <td class="px-1 py-2 text-center"></td>
                </tr>
            `;

            tbody.innerHTML = html;
        }

        // ===== 2. RENDER DAILY ATTENDANCE & BIOMETRIC LOG TABLE =====
        function renderDailyLogTable() {
            const tbody = document.getElementById('attendance-table-body');
            if (!tbody) return;

            tbody.innerHTML = EMPLOYEES_LIST.map((emp, idx) => `
                <tr class="hover:bg-blue-50/20 transition group">
                    <td class="px-3 py-2.5">
                        <span class="text-[9.5px] font-mono font-bold text-gray-700 bg-gray-100 px-1.5 py-0.5 rounded">${emp.empId}</span>
                    </td>
                    <td class="px-3 py-2.5">
                        <div class="flex items-center gap-2">
                            <div class="w-6 h-6 rounded-full ${emp.color} flex items-center justify-center font-bold text-[9px]">${emp.initials}</div>
                            <a href="employee-profile.html?id=${emp.empId}" class="font-bold text-[#242b5f] hover:underline leading-tight" title="Click to view Worker Profile">${emp.name}</a>
                        </div>
                    </td>
                    <td class="px-3 py-2.5 text-gray-600 font-medium">${emp.role}</td>
                    <td class="px-3 py-2.5">
                        <span class="text-gray-800 font-medium truncate max-w-[130px] block" title="${emp.site}">${emp.site}</span>
                        <span class="text-[8.5px] ${emp.category === 'mep' ? 'text-orange-600' : 'text-blue-600'} font-bold uppercase">${emp.category === 'mep' ? 'Site Technical' : 'Head Office'}</span>
                    </td>
                    <td class="px-3 py-2.5 text-gray-600 font-mono text-[11px]">${emp.shift}</td>
                    <td class="px-3 py-2.5">
                        <span class="font-bold ${emp.inTime.includes('10:') || emp.inTime.includes('09:30') ? 'text-red-600' : 'text-gray-800'}">${emp.inTime}</span>
                        <span class="text-[8px] text-gray-400 block"><i class="fas fa-fingerprint text-blue-500 mr-0.5"></i> Biometric Machine</span>
                    </td>
                    <td class="px-3 py-2.5">
                        ${emp.outTime === 'Missing Punch' ? '<span class="text-red-600 font-bold"><i class="fas fa-times-circle mr-0.5"></i> Missing Punch</span>' : (emp.outTime === 'In-Progress' ? '<span class="text-gray-400 italic">In-Progress</span>' : '<span class="font-semibold text-gray-700">' + emp.outTime + '</span>')}
                    </td>
                    <td class="px-3 py-2.5 font-semibold text-gray-700">${emp.hours}</td>
                    <td class="px-3 py-2.5 font-bold ${emp.otHours > 0 ? 'text-purple-700' : 'text-gray-400'}">
                        ${emp.otHours > 0 ? emp.otHours + ' hrs' : '-'}
                    </td>
                    <td class="px-3 py-2.5 font-bold ${emp.otPayout > 0 ? 'text-green-700' : 'text-gray-400'}">
                        ${emp.otPayout > 0 ? '+Rs. ' + emp.otPayout.toLocaleString() : '-'}
                    </td>
                    <td class="px-3 py-2.5">
                        <span class="text-green-600 font-bold text-[9px]"><i class="fas fa-check-circle mr-0.5"></i> ${emp.geofence}</span>
                    </td>
                    <td class="px-3 py-2.5">
                        <span class="px-1.5 py-0.5 rounded text-[9px] font-semibold border ${emp.exception === 'Normal Punch' ? 'bg-green-50 text-green-700 border-green-200' : (emp.exception.includes('Late') ? 'bg-orange-50 text-orange-700 border-orange-200' : 'bg-purple-50 text-purple-700 border-purple-200')}">
                            ${emp.exception}
                        </span>
                    </td>
                    <td class="px-3 py-2.5 text-center" id="audit-status-${idx}">
                        <span class="${emp.auditClass} px-2 py-0.5 rounded text-[8.5px] font-bold uppercase tracking-wider inline-block">
                            ${emp.auditStatus}
                        </span>
                    </td>
                    <td class="px-3 py-2.5 text-right relative dropdown">
                        <button class="dropdown-toggle text-gray-400 hover:text-[#242b5f] p-1.5 rounded-lg hover:bg-gray-100 transition focus:outline-none" onclick="toggleDropdown(this, event)">
                            <i class="fas fa-ellipsis-v text-xs"></i>
                        </button>
                        <div class="dropdown-menu absolute right-3 top-8 w-56 bg-white rounded-xl shadow-xl border border-gray-100 py-1.5 z-50 text-left">
                            <div class="px-3 py-1 border-b border-gray-50 mb-1">
                                <p class="text-[8.5px] font-bold text-gray-400 uppercase tracking-wider">${emp.name} — Accounts Actions</p>
                            </div>
                            <a href="employee-profile.html?id=${emp.empId}" class="block px-3 py-1.5 text-xs text-[#242b5f] hover:bg-blue-50 font-bold flex items-center gap-2">
                                <i class="fas fa-id-badge w-4 text-[#242b5f]"></i> View Worker Profile
                            </a>
                            <button onclick="openMonthHistoryModal('${emp.name}', '${emp.role}', '${emp.empId}')" class="w-full text-left px-3 py-1.5 text-xs text-purple-700 hover:bg-purple-50 flex items-center gap-2 font-semibold">
                                <i class="fas fa-history w-4 text-purple-600"></i> View 30-Day Timecard
                            </button>
                            <button onclick="openPayslipModal({ name: '${emp.name}', role: '${emp.role}', empId: '${emp.empId}', site: '${emp.site}', base: 85000, allowance: 5000, ot: ${emp.otPayout || 8000}, advanceEmi: 5000, tax: 2500, bank: 'Meezan Bank Ltd', iban: 'PK36MEZN0001098234' })" class="w-full text-left px-3 py-1.5 text-xs text-emerald-700 hover:bg-emerald-50 flex items-center gap-2 font-semibold">
                                <i class="fas fa-file-invoice-dollar w-4 text-emerald-600"></i> Salary Payslip Preview
                            </button>
                            <div class="h-px bg-gray-100 my-1"></div>
                            <button onclick="signOffSingleWorker(${idx}, '${emp.name}')" class="w-full text-left px-3 py-1.5 text-xs text-green-700 hover:bg-green-50 flex items-center gap-2 font-semibold">
                                <i class="fas fa-check-circle w-4 text-green-600"></i> Sign-Off for Payroll
                            </button>
                            <button onclick="deductWorkerPenalty(${idx}, '${emp.name}')" class="w-full text-left px-3 py-1.5 text-xs text-red-600 hover:bg-red-50 flex items-center gap-2 font-medium">
                                <i class="fas fa-minus-circle w-4 text-red-500"></i> Apply Late Penalty (-Rs. 800)
                            </button>
                            <button onclick="waiveWorkerLate(${idx}, '${emp.name}')" class="w-full text-left px-3 py-1.5 text-xs text-blue-700 hover:bg-blue-50 flex items-center gap-2 font-medium">
                                <i class="fas fa-hand-holding-heart w-4 text-blue-600"></i> Waive Late Penalty
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // Action methods
        window.signOffSingleWorker = (idx, name) => {
            const el = document.getElementById(`audit-status-${idx}`);
            if (el) el.innerHTML = '<span class="bg-green-100 text-green-800 px-2 py-0.5 rounded text-[8.5px] font-bold uppercase tracking-wider">Audited & Cleared</span>';
            showToast(`Attendance verified & cleared for ${name}`, 'success');
        };

        window.deductWorkerPenalty = (idx, name) => {
            const el = document.getElementById(`audit-status-${idx}`);
            if (el) el.innerHTML = '<span class="bg-red-100 text-red-700 px-2 py-0.5 rounded text-[8.5px] font-bold uppercase tracking-wider">Penalty Deducted</span>';
            showToast(`Late penalty (-Rs. 800) applied for ${name} in payroll`, 'info');
        };

        window.waiveWorkerLate = (idx, name) => {
            const el = document.getElementById(`audit-status-${idx}`);
            if (el) el.innerHTML = '<span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded text-[8.5px] font-bold uppercase tracking-wider">Waived (Grace)</span>';
            showToast(`Late arrival penalty waived for ${name}`, 'success');
        };

        window.approveAllAuditRecords = () => {
            EMPLOYEES_LIST.forEach((_, idx) => {
                const el = document.getElementById(`audit-status-${idx}`);
                if (el) el.innerHTML = '<span class="bg-green-100 text-green-800 px-2 py-0.5 rounded text-[8.5px] font-bold uppercase tracking-wider">Audited & Cleared</span>';
            });
            showToast('All 150 employees attendance and overtime verified by Accounts Auditor!', 'success');
        };

        // Switch Views between Combined, Roster Matrix only, or Daily Log table only
        window.switchView = (view) => {
            const tableDiv = document.getElementById('view-table');
            const rosterDiv = document.getElementById('view-roster');
            const btnBoth = document.getElementById('tab-btn-both');
            const btnRoster = document.getElementById('tab-btn-roster');
            const btnTable = document.getElementById('tab-btn-table');

            btnBoth.className = 'px-3 py-1.5 rounded text-xs font-bold transition text-gray-600 hover:text-gray-900 flex items-center gap-1.5';
            btnRoster.className = 'px-3 py-1.5 rounded text-xs font-bold transition text-gray-600 hover:text-gray-900 flex items-center gap-1.5';
            btnTable.className = 'px-3 py-1.5 rounded text-xs font-bold transition text-gray-600 hover:text-gray-900 flex items-center gap-1.5';

            if (view === 'table') {
                rosterDiv.classList.add('hidden');
                tableDiv.classList.remove('hidden');
                btnTable.className = 'px-3 py-1.5 rounded text-xs font-bold transition shadow-sm bg-white text-[#242b5f] flex items-center gap-1.5';
            } else if (view === 'roster') {
                rosterDiv.classList.remove('hidden');
                tableDiv.classList.add('hidden');
                btnRoster.className = 'px-3 py-1.5 rounded text-xs font-bold transition shadow-sm bg-white text-[#242b5f] flex items-center gap-1.5';
            } else {
                rosterDiv.classList.remove('hidden');
                tableDiv.classList.remove('hidden');
                btnBoth.className = 'px-3 py-1.5 rounded text-xs font-bold transition shadow-sm bg-white text-[#242b5f] flex items-center gap-1.5';
            }
        };

        window.filterRosterRows = (input) => {
            const q = (input.value || '').toLowerCase();
            document.querySelectorAll('.roster-row').forEach(row => {
                const name = row.getAttribute('data-name') || '';
                row.style.display = name.includes(q) ? '' : 'none';
            });
        };

        window.filterRosterDept = (dept) => {
            document.querySelectorAll('.roster-row').forEach(row => {
                const d = row.getAttribute('data-dept') || '';
                row.style.display = (!dept || d === dept) ? '' : 'none';
            });
        };

        window.filterTableRows = (input, tbodyId) => {
            const q = (input.value || '').toLowerCase();
            const tbody = document.getElementById(tbodyId);
            if (!tbody) return;
            Array.from(tbody.querySelectorAll('tr')).forEach(tr => {
                tr.style.display = tr.innerText.toLowerCase().includes(q) ? '' : 'none';
            });
        };

        // Open Month History Modal (30 Days Timecard)
        window.openMonthHistoryModal = (name, role, empId) => {
            openTimecardModal(name, empId, role);
        };

        // Initialize both sections immediately
        renderRosterMatrix();
        renderDailyLogTable();
    </script>
</body>
