                                    <td class="px-3 py-1.5 text-right font-mono font-bold">15,000</td>
                                </tr>
                                <tr>
                                    <td class="px-3 py-1.5">Mobilization Relocation Cash Advance</td>
                                    <td class="px-3 py-1.5 text-center">Advance</td>
                                    <td class="px-3 py-1.5 text-right font-mono font-bold">10,000</td>
                                </tr>
                                <tr>
                                    <td class="px-3 py-1.5">Chiller Special Tools Transport & Rigging Allowance</td>
                                    <td class="px-3 py-1.5 text-center">1 Job</td>
                                    <td class="px-3 py-1.5 text-right font-mono font-bold">5,000</td>
                                </tr>
                            </tbody>
                            <tfoot class="bg-gray-50 font-bold border-t border-gray-200">
                                <tr>
                                    <td colspan="2" class="px-3 py-2 text-right">Grand Total Disbursed:</td>
                                    <td class="px-3 py-2 text-right font-mono text-sm text-[#242b5f]">${worker.outstationPkg}</td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>

                    <div class="grid grid-cols-3 gap-2 text-[9px] text-gray-500 pt-3 border-t border-gray-200 text-center">
                        <div class="border-t border-gray-300 pt-1">
                            <p class="font-bold text-gray-700">Engr. Faisal Tariq</p>
                            <p>Head of MEP / Project Manager</p>
                        </div>
                        <div class="border-t border-gray-300 pt-1">
                            <p class="font-bold text-gray-700">Muhammad Usman</p>
                            <p>Head of Accounts & Finance</p>
                        </div>
                        <div class="border-t border-gray-300 pt-1">
                            <p class="font-bold text-gray-700">${worker.name}</p>
                            <p>Deputed Employee Sign</p>
                        </div>
                    </div>
                    
                    <div class="flex justify-end gap-2 pt-2">
                        <button onclick="window.print()" class="bg-[#242b5f] text-white px-3 py-1.5 rounded text-xs font-bold hover:bg-[#1a2046] flex items-center gap-1.5">
                            <i class="fas fa-print"></i> Print Official Voucher
                        </button>
                    </div>
                </div>
            `;
            openModal('Outstation Deployment Voucher #OST-2026-089', voucherHTML, null);
        };

        window.openOutstationExpenseClaimModal = () => {
            const claimHTML = `
                <div class="space-y-3 text-xs">
                    <div class="p-2.5 bg-blue-50/70 border border-blue-200 rounded-lg">
                        <p class="font-bold text-[#242b5f] flex items-center gap-1.5">
                            <i class="fas fa-receipt"></i> Outstation Incident Claim: Order #OST-2026-089
                        </p>
                        <p class="text-[10px] text-gray-600 mt-0.5">${worker.name} • ${worker.outstationSite}</p>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-600 mb-1">Expense Category <span class="text-red-500">*</span></label>
                        <select id="claim-category" class="w-full border border-gray-300 rounded p-1.5 text-xs bg-white focus:outline-none">
                            <option value="Local Transit">Local Site Transit (Taxi / Careem / Auto)</option>
                            <option value="Emergency Meals">Overtime Site Meals</option>
                            <option value="Site Consumables">Emergency Site Hardware / Copper Pipes</option>
                            <option value="Medical / First Aid">Site First Aid / Medical</option>
                            <option value="Hotel Extension">Emergency Night Stay Extension</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-600 mb-1">Expense Title / Description <span class="text-red-500">*</span></label>
                        <input id="claim-title" type="text" placeholder="e.g. Careem ride from Railway Station to Gulberg Site" class="w-full border border-gray-300 rounded p-1.5 text-xs outline-none focus:ring-1 focus:ring-[#242b5f]">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] font-bold text-gray-600 mb-1">Receipt / Invoice #</label>
                            <input id="claim-inv" type="text" placeholder="e.g. CRM-98234" class="w-full border border-gray-300 rounded p-1.5 text-xs outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-600 mb-1">Claim Amount (PKR) <span class="text-red-500">*</span></label>
                            <input id="claim-amount" type="number" placeholder="e.g. 1850" class="w-full border border-gray-300 rounded p-1.5 text-xs font-mono font-bold outline-none focus:ring-1 focus:ring-[#242b5f]">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-600 mb-1">Attach Bill / Receipt Photo</label>
                        <div class="border-2 border-dashed border-gray-300 rounded p-2.5 text-center cursor-pointer hover:border-[#242b5f] bg-gray-50/50" onclick="document.getElementById('claim-file').click()">
                            <i class="fas fa-camera text-gray-400 text-base mb-1"></i>
                            <p class="text-[10.5px] font-semibold text-gray-700">Click to upload bill image or photo</p>
                            <input type="file" id="claim-file" class="hidden" onchange="document.getElementById('file-chosen-msg').innerText = this.files[0] ? this.files[0].name : ''">
                            <p id="file-chosen-msg" class="text-[10px] text-emerald-600 font-bold mt-1"></p>
                        </div>
                    </div>
                </div>
            `;
            openModal(
                'Submit Outstation Incident Expense Claim',
                claimHTML,
                () => {
                    const title = (document.getElementById('claim-title').value || '').trim() || 'Incidental Travel Expense';
                    const cat = document.getElementById('claim-category').value;
                    const amount = parseInt(document.getElementById('claim-amount').value) || 0;
                    if (amount <= 0) {
                        showToast('Please enter a valid expense amount in PKR', 'error');
                        return;
                    }

                    const tbody = document.getElementById('outstation-items-body');
                    if (tbody) {
                        const tr = document.createElement('tr');
                        tr.className = 'hover:bg-amber-50/40 bg-amber-50/20 transition';
                        tr.innerHTML = `
                            <td class="px-3 py-2">
                                <div class="font-bold text-gray-800">${title}</div>
                                <div class="text-[9px] text-amber-700"><i class="fas fa-receipt mr-1"></i> Submitted Claim (Today)</div>
                            </td>
                            <td class="px-3 py-2"><span class="bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded text-[9.5px] font-medium border border-amber-200">${cat}</span></td>
                            <td class="px-3 py-2 text-center text-gray-600">Employee Incident Claim</td>
                            <td class="px-3 py-2 text-right font-mono font-bold text-gray-800">Rs. ${amount.toLocaleString()}</td>
                            <td class="px-3 py-2 text-center"><span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded text-[9px] font-bold border border-amber-200 uppercase">Pending Audit</span></td>
                        `;
                        tbody.appendChild(tr);

                        const grandTotalEl = document.getElementById('outstation-grand-total');
                        if (grandTotalEl) {
                            grandTotalEl.innerText = 'Rs. ' + (81500 + amount).toLocaleString();
                        }
                    }

                    showToast(`Claim of Rs. ${amount.toLocaleString()} submitted to Accounts & Project Manager for reimbursement!`, 'success');
                }
            );
        };

        // Initialize map after layout rendering
        setTimeout(initEmployeeMap, 200);
    </script>
</body>
</html>
