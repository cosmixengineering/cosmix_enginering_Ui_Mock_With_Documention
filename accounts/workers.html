        window.currentStatusFilter = 'all';

        window.renderWorkersTable = (statusTab = 'all', query = '', site = '', dept = '') => {
            const tbody = document.getElementById('workers-table-body');
            if (!tbody) return;

            const filtered = window.WORKERS_REGISTRY.filter(w => {
                const matchesStatus = statusTab === 'all' ? true : w.status === statusTab;
                const matchesSite = !site || w.site.toLowerCase().includes(site.toLowerCase());
                const matchesDept = !dept || w.dept.toLowerCase().includes(dept.toLowerCase());
                
                const q = query.toLowerCase();
                const matchesQuery = !query || 
                    w.name.toLowerCase().includes(q) || 
                    w.empId.toLowerCase().includes(q) || 
                    w.role.toLowerCase().includes(q) || 
                    w.site.toLowerCase().includes(q) || 
                    w.city.toLowerCase().includes(q);

                return matchesStatus && matchesSite && matchesDept && matchesQuery;
            });

                        <td colspan="8" class="text-center py-8 text-gray-400">

                                    ${w.statusLabel}
                                </span>

                                    </span>
                                `}

                    </td>

                        <div class="font-mono text-[9.5px] text-gray-400">${w.iban.substring(0, 11)}...${w.iban.slice(-4)}</div>
                    </td>

                    <!-- Action: Open Detail Page -->
                    <td class="text-right" onclick="event.stopPropagation()">

                            <i class="fas fa-arrow-right text-[10px]"></i>
                        </a>
                    </td>
                </tr>
            `).join('');

        window.filterWorkersStatus = (status, btn) => {
            window.currentStatusFilter = status;
            document.querySelectorAll('.worker-tab-btn').forEach(b => {
                b.className = 'worker-tab-btn px-3 py-1 text-xs font-semibold rounded-lg text-gray-600 hover:bg-gray-100 transition';
            });
            btn.className = 'worker-tab-btn px-3 py-1 text-xs font-bold rounded-lg bg-[#242b5f] text-white shadow-2xs transition';
            window.filterWorkersTable();
        };

        window.filterWorkersTable = () => {
            const q = document.getElementById('worker-search')?.value || '';
            const site = document.getElementById('site-filter')?.value || '';
            const dept = document.getElementById('dept-filter')?.value || '';
            window.renderWorkersTable(window.currentStatusFilter, q, site, dept);
        };

        // Initial render
        window.renderWorkersTable();
    </script>
