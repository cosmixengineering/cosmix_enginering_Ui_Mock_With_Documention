            font-weight: 900;

            100% { background-color: transparent; transform: scale(1); }

            item.status = 'paid';
            item.statusLabel = 'Paid via Meezan Bank';
            item.statusClass = 'bg-blue-100 text-blue-800 border-blue-200';
            closeModal();
            showToast(`Payment Voucher settled! Rs. ${item.netAmount.toLocaleString()} disbursed to ${item.vendor}.`, 'success');
            window.filterPurchasesTable();
        };

        // Initialize on Load
        window.updateFinancialKPIs();
        window.renderSiteExpenseLedger();
        window.renderPurchasesTable();
    </script>
</body>
</html>
