<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmix ERP - PDF Merge Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/sales.css">
    <style>
        .drag-active {
            border-color: #242b5f !important;
            background-color: #f3f5fb !important;
        }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-800">
    <div id="app-layout" class="flex min-h-screen"></div>
    <script src="../assets/vendor/pdf-tools/pdf-lib.min.js"></script>
    <script src="../assets/js/shared.js"></script>
    <script>
        renderLayout('pdf-merge');

        let mergeFiles = [];

        function renderMergeApp() {
            const listHtml = mergeFiles.length === 0 
                ? '<div class="py-10 text-center text-slate-400 text-xs"><i class="fas fa-file-pdf text-3xl mb-2 opacity-50"></i><p>No PDFs added yet.</p></div>'
                : mergeFiles.map((file, i) => `
                    <div draggable="true" ondragstart="dragStart(event, ${i}); this.classList.add('opacity-50')" ondragend="this.classList.remove('opacity-50')" ondragover="event.preventDefault(); this.classList.add('border-t-2', 'border-[#242b5f]')" ondragleave="this.classList.remove('border-t-2', 'border-[#242b5f]')" ondrop="event.preventDefault(); this.classList.remove('border-t-2', 'border-[#242b5f]'); dropFile(event, ${i});" class="flex items-center justify-between p-3 bg-white border border-slate-200 rounded-lg mb-2 shadow-sm cursor-move hover:border-[#242b5f] transition-all">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <span class="font-mono font-bold text-[#242b5f] w-5">${i + 1}</span>
                            <i class="fas fa-file-pdf text-red-500 text-lg"></i>
                            <div class="min-w-0">
                                <p class="font-bold text-sm text-slate-700 truncate">${file.name}</p>
                                <p class="text-[10px] text-slate-500">${(file.size / 1024 / 1024).toFixed(2)} MB</p>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="moveFile(${i}, -1)" class="p-2 text-slate-400 hover:text-[#242b5f]" ${i === 0 ? 'disabled class="opacity-30"' : ''}><i class="fas fa-arrow-up"></i></button>
                            <button onclick="moveFile(${i}, 1)" class="p-2 text-slate-400 hover:text-[#242b5f]" ${i === mergeFiles.length - 1 ? 'disabled class="opacity-30"' : ''}><i class="fas fa-arrow-down"></i></button>
                            <button onclick="removeFile(${i})" class="p-2 text-red-400 hover:text-red-600"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `).join('');

            const pageHTML = `
                <div class="space-y-4 max-w-4xl mx-auto">
                    <div class="bg-gradient-to-r from-[#242b5f] to-[#3a4484] p-5 rounded-xl text-white shadow-md flex justify-between items-center">
                        <div>
                            <h2 class="text-lg font-bold flex items-center gap-2"><i class="fas fa-layer-group text-amber-400"></i> PDF Merge App</h2>
                            <p class="text-xs text-indigo-200 mt-1">Drag and drop PDFs to combine them into a single file.</p>
                        </div>
                        ${mergeFiles.length > 0 ? `<button onclick="mergePDFs()" id="merge-btn" class="bg-amber-400 hover:bg-amber-500 text-[#242b5f] px-5 py-2.5 rounded-lg font-bold shadow-lg transition flex items-center gap-2"><i class="fas fa-object-group"></i> Merge ${mergeFiles.length} PDFs</button>` : ''}
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="md:col-span-2">
                            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                <div class="px-4 py-3 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                    <h3 class="font-bold text-slate-700 text-sm">Merge Order</h3>
                                    <span class="text-[10px] bg-white border border-slate-200 px-2 py-0.5 rounded text-slate-500 font-bold">${mergeFiles.length} Files</span>
                                </div>
                                <div class="p-4 bg-slate-50 min-h-[300px]">
                                    ${listHtml}
                                </div>
                            </div>
                        </div>

                        <div>
                            <label class="block border-2 border-dashed border-slate-300 rounded-xl bg-white p-8 text-center cursor-pointer transition-colors hover:border-[#242b5f] hover:bg-indigo-50"
                                ondragover="event.preventDefault(); this.classList.add('drag-active')"
                                ondragleave="this.classList.remove('drag-active')"
                                ondrop="event.preventDefault(); this.classList.remove('drag-active'); addFiles(event.dataTransfer.files)">
                                <i class="fas fa-file-circle-plus text-4xl text-indigo-300 mb-3"></i>
                                <p class="font-bold text-slate-700">Drag & Drop PDFs</p>
                                <p class="text-[10px] text-slate-500 mt-1 mb-4">or click to browse files</p>
                                <span class="bg-[#242b5f] text-white px-4 py-1.5 rounded-md text-xs font-bold">Select Files</span>
                                <input type="file" accept="application/pdf" multiple class="hidden" onchange="addFiles(this.files)">
                            </label>
                            
                            <div class="mt-4 bg-blue-50 border border-blue-100 rounded-xl p-4">
                                <h4 class="font-bold text-blue-900 text-[11px] mb-2"><i class="fas fa-info-circle"></i> Instructions</h4>
                                <ul class="text-[10px] text-blue-700 space-y-1.5 list-disc pl-4">
                                    <li>Drop PDF files in the box above.</li>
                                    <li>Drag rows to adjust their sequence.</li>
                                    <li>Click Merge when you're ready.</li>
                                    <li>All processing is done locally and securely.</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            setPageContent('PDF Merge Tool', pageHTML);
        }

        function addFiles(fileList) {
            const files = Array.from(fileList).filter(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));
            if (files.length === 0) {
                showToast('Only PDF files are supported.', 'warning');
                return;
            }
            mergeFiles = [...mergeFiles, ...files];
            renderMergeApp();
        }

        function removeFile(index) {
            mergeFiles.splice(index, 1);
            renderMergeApp();
        }

        function moveFile(index, dir) {
            if (index + dir < 0 || index + dir >= mergeFiles.length) return;
            const temp = mergeFiles[index];
            mergeFiles[index] = mergeFiles[index + dir];
            mergeFiles[index + dir] = temp;
            renderMergeApp();
        }

        function dragStart(e, index) {
            e.dataTransfer.setData('text/plain', index);
        }

        function dropFile(e, dropIndex) {
            const dragIndex = parseInt(e.dataTransfer.getData('text/plain'));
            if (isNaN(dragIndex) || dragIndex === dropIndex) return;
            const item = mergeFiles.splice(dragIndex, 1)[0];
            mergeFiles.splice(dropIndex, 0, item);
            renderMergeApp();
        }

        async function mergePDFs() {
            if (!window.PDFLib) {
                showToast('PDF Library not loaded. Please wait or refresh.', 'error');
                return;
            }
            if (mergeFiles.length < 2) {
                showToast('Add at least 2 PDFs to merge.', 'warning');
                return;
            }
            
            const btn = document.getElementById('merge-btn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Merging...';
            btn.disabled = true;

            try {
                const { PDFDocument } = window.PDFLib;
                const mergedPdf = await PDFDocument.create();
                
                for (let file of mergeFiles) {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await PDFDocument.load(arrayBuffer);
                    const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                    copiedPages.forEach((page) => mergedPdf.addPage(page));
                }

                const mergedPdfFile = await mergedPdf.save();
                const blob = new Blob([mergedPdfFile], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = 'Merged_Document.pdf';
                document.body.appendChild(a);
                a.click();
                a.remove();
                
                showToast('PDFs merged successfully!', 'success');
            } catch (err) {
                console.error(err);
                showToast('Error merging PDFs: ' + err.message, 'error');
            } finally {
                btn.innerHTML = '<i class="fas fa-object-group"></i> Merge ' + mergeFiles.length + ' PDFs';
                btn.disabled = false;
            }
        }

        // Initial render
        renderMergeApp();
    </script>
</body>
</html>
