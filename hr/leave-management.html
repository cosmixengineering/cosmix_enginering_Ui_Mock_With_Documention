            const fromVal = document.getElementById('leave_from_date').value;

            const fraction = parseFloat(document.getElementById('leave_fraction_select').value) || 1;

            if (!fromVal || !toVal) return;

            const from = new Date(fromVal);
            const to = new Date(toVal);
            const diffTime = Math.max(0, to - from);
            const rawDays = Math.round(diffTime / (1000 * 60 * 60 * 24)) + 1;
            const finalDays = (rawDays * fraction).toFixed(fraction === 1 ? 0 : 1);

            const display = document.getElementById('leave_duration_display');
            const ceoHint = document.getElementById('ceo-approval-hint');

            display.innerText = `${finalDays} Working Day${finalDays > 1 ? 's' : ''}`;

                <td class="px-3.5 py-2.5 text-center" id="${statusId}">
                    <span class="bg-amber-50 text-amber-700 px-2.5 py-0.5 rounded text-[9.5px] font-bold uppercase border border-amber-200 shadow-2xs flex items-center justify-center gap-1 mx-auto w-max">
                        <i class="fas fa-clock"></i> ${isLong ? 'Pending CEO' : 'Pending PM'}
                    </span>
                </td>
                <td class="px-3.5 py-2.5 text-right relative dropdown">
                    <button class="dropdown-toggle text-gray-400 hover:text-[#242b5f] p-1 rounded hover:bg-gray-100 transition focus:outline-none" onclick="toggleDropdown(this, event)">
                        <i class="fas fa-ellipsis-v text-xs"></i>
                    </button>
                    <div class="dropdown-menu absolute right-4 top-8 w-48 bg-white rounded-lg shadow-lg border border-gray-100 py-1 z-50 text-left">
                        <button onclick="approveLeaveDirectly('${appId}', '${empName}', '${statusId}')" class="w-full text-left px-3 py-1.5 text-xs text-green-700 hover:bg-green-50 font-medium flex items-center gap-2">
                            <i class="fas fa-check w-4 text-green-600"></i> Approve Leave
                        </button>
                        <button onclick="rejectLeaveDirectly('${appId}', '${empName}', '${statusId}')" class="w-full text-left px-3 py-1.5 text-xs text-red-600 hover:bg-red-50 font-medium flex items-center gap-2">
                            <i class="fas fa-times w-4 text-red-500"></i> Reject Leave
                        </button>
                        <button onclick="viewLeaveDetailsModal('${empName}', '${appId}', '${leaveType}', '${durationText}', '${reliever}', '${reason}', 'Pending Approval')" class="w-full text-left px-3 py-1.5 text-xs text-blue-700 hover:bg-blue-50 flex items-center gap-2">
                            <i class="fas fa-eye w-4 text-blue-600"></i> View Details
                        </button>
                    </div>
                </td>
            `;

            const tbody = document.getElementById('leave-table-body');
            tbody.insertBefore(newRow, tbody.firstChild);

            closeApplyLeaveModal();
            showToast(`Leave application ${appId} for ${empName} submitted successfully!`, 'success');
        };
    </script>
</body>
</html>
