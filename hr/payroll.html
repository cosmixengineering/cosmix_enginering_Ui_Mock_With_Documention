        window.togglePayrollGuide = function() {
            const steps = document.getElementById('payroll-flow-steps');
            const txt = document.getElementById('guide-toggle-text');
            if (steps.classList.contains('hidden')) {
                steps.classList.remove('hidden');
                txt.innerText = 'Hide Formula Guide';
            } else {
                steps.classList.add('hidden');
                txt.innerText = 'Show Formula Guide';
            }
        };

        window.filterPayrollWorkplace = function(type) {
            const rows = document.querySelectorAll('.payroll-row');
            const label = document.getElementById('active-workplace-label');
            
            // Toggle active classes on tabs
            ['all', 'office', 'site'].forEach(t => {
                const btn = document.getElementById('pfilter-' + t);
                if (btn) {
                    if (t === type) {
                        btn.className = 'px-3 py-1.5 rounded-md text-xs font-bold transition shadow-xs bg-white text-[#242b5f] flex items-center gap-1.5';
                    } else {
                        btn.className = 'px-3 py-1.5 rounded-md text-xs font-bold transition text-gray-600 hover:text-gray-900 flex items-center gap-1.5';
                    }
                }
            });

            let visibleCount = 0;
            rows.forEach(r => {
                if (type === 'all' || r.getAttribute('data-workplace') === type) {
                    r.style.display = '';
                    visibleCount++;
                } else {
                    r.style.display = 'none';
                }
            });

            if (type === 'all') {
                label.innerText = 'Showing All 150 Personnel (Office + Site)';
            } else if (type === 'office') {
                label.innerText = 'Showing Corporate & Regional Office Personnel (45 Staff)';
            } else if (type === 'site') {
                label.innerText = 'Showing Project Site & Technical Trades (105 Staff)';
            }
        };
