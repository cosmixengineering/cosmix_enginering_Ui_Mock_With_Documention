        };

        const redPinIcon = typeof L !== 'undefined' ? L.divIcon({
            className: 'custom-site-pin',
            html: `
                <div style="position:relative; width:34px; height:42px; display:flex; flex-direction:column; align-items:center; cursor:grab;">
                    <div style="width:30px; height:30px; border-radius:50% 50% 50% 0; background:linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); transform:rotate(-45deg); border:2px solid #ffffff; box-shadow:0 3px 8px rgba(0,0,0,0.35); display:flex; align-items:center; justify-content:center;">
                        <i class="fas fa-building text-white text-[11px]" style="transform:rotate(45deg);"></i>
                    </div>
                    <div style="width:8px; height:4px; background:rgba(0,0,0,0.3); border-radius:50%; margin-top:2px;"></div>
                </div>
            `,
            iconSize: [34, 42],
            iconAnchor: [17, 40],
            popupAnchor: [0, -38]
        }) : null;

        window.openAddSiteModal = function() {
            const modal = document.getElementById('site-modal');
            if (!modal) return;
            modal.classList.remove('hidden');

            setTimeout(() => {
                initSitePickerMap();
            }, 180);
        };

        window.initSitePickerMap = function() {
            const mapContainer = document.getElementById('site-geofence-picker-map');
            if (!mapContainer || typeof L === 'undefined') return;

            const latInput = document.getElementById('site_lat');
            const lngInput = document.getElementById('site_lng');
            const radiusInput = document.getElementById('site_radius');

            const lat = parseFloat(latInput ? latInput.value : 31.4504) || 31.4504;
            const lng = parseFloat(lngInput ? lngInput.value : 73.1350) || 73.1350;
            const radius = parseInt(radiusInput ? radiusInput.value : 80) || 80;

            if (!sitePickerMap) {
                // Google Road Map
                mapTileLayers.streets = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
                    maxZoom: 20,
                    subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
                    attribution: '&copy; Google Maps'
                });

                // Google Satellite / Hybrid
                mapTileLayers.satellite = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
                    maxZoom: 20,
                    subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
                    attribution: '&copy; Google Maps Satellite'
                });

                sitePickerMap = L.map('site-geofence-picker-map', {
                    center: [lat, lng],
                    zoom: 15,
                    layers: [mapTileLayers.streets],
                    zoomControl: true
                });

                // Blue Geofence Boundary Circle
                siteGeofenceCircle = L.circle([lat, lng], {
                    color: '#2563eb',
                    weight: 2,
                    fillColor: '#3b82f6',
                    fillOpacity: 0.22,
                    dashArray: '5, 5',
                    radius: radius
                }).addTo(sitePickerMap);

                // Draggable Marker Pin
                siteMarker = L.marker([lat, lng], {
                    draggable: true,
                    icon: redPinIcon
                }).addTo(sitePickerMap);

                siteMarker.bindPopup(`
                    <div style="font-family:'Inter',sans-serif; font-size:11px;" class="p-1">
                        <b style="color:#242b5f;">Project Site Center</b>
                        <p style="color:#64748b; margin:2px 0 0 0;">Drag pin to fine-tune location</p>
                    </div>
                `);

                // Map Click Listener
                sitePickerMap.on('click', function(e) {
                    updateSiteLocation(e.latlng.lat, e.latlng.lng);
                });

                // Marker Drag Listener
                siteMarker.on('drag', function(e) {
                    const pos = e.target.getLatLng();
                    if (siteGeofenceCircle) siteGeofenceCircle.setLatLng(pos);
                    updateCoordinateDisplays(pos.lat, pos.lng);
                });

                siteMarker.on('dragend', function(e) {
                    const pos = e.target.getLatLng();
                    updateSiteLocation(pos.lat, pos.lng);
                });

            } else {
                sitePickerMap.invalidateSize();
                sitePickerMap.setView([lat, lng], sitePickerMap.getZoom() || 15);
                if (siteMarker) siteMarker.setLatLng([lat, lng]);
                if (siteGeofenceCircle) {
                    siteGeofenceCircle.setLatLng([lat, lng]);
                    siteGeofenceCircle.setRadius(radius);
                }
            }

            updateCoordinateDisplays(lat, lng);
            handleRadiusInputChange(radius);
        };

        window.updateSiteLocation = function(lat, lng) {
            const fixedLat = parseFloat(lat).toFixed(5);
            const fixedLng = parseFloat(lng).toFixed(5);

            if (siteMarker) siteMarker.setLatLng([fixedLat, fixedLng]);
            if (siteGeofenceCircle) siteGeofenceCircle.setLatLng([fixedLat, fixedLng]);

            updateCoordinateDisplays(fixedLat, fixedLng);
        };

        window.updateCoordinateDisplays = function(lat, lng) {
            const fixedLat = parseFloat(lat).toFixed(5);
            const fixedLng = parseFloat(lng).toFixed(5);

            const latInput = document.getElementById('site_lat');
            const lngInput = document.getElementById('site_lng');
            const coordsDisplay = document.getElementById('map-coords-display');

            if (latInput) latInput.value = fixedLat;
            if (lngInput) lngInput.value = fixedLng;
            if (coordsDisplay) coordsDisplay.innerText = `${fixedLat}° N, ${fixedLng}° E`;
        };

        window.handleManualCoordInput = function() {
            const lat = parseFloat(document.getElementById('site_lat').value);
            const lng = parseFloat(document.getElementById('site_lng').value);

            if (!isNaN(lat) && !isNaN(lng)) {
                if (siteMarker) siteMarker.setLatLng([lat, lng]);
                if (siteGeofenceCircle) siteGeofenceCircle.setLatLng([lat, lng]);
                if (sitePickerMap) sitePickerMap.panTo([lat, lng]);
                const coordsDisplay = document.getElementById('map-coords-display');
                if (coordsDisplay) coordsDisplay.innerText = `${lat.toFixed(5)}° N, ${lng.toFixed(5)}° E`;
            }
        };

        window.handleRadiusInputChange = function(val) {
            const radius = parseInt(val) || 80;
            if (siteGeofenceCircle) {
                siteGeofenceCircle.setRadius(radius);
            }
            const radiusDisplay = document.getElementById('map-radius-display');
            if (radiusDisplay) {
                radiusDisplay.innerText = `${radius}m Active Geofence Circle`;
            }
        };

        window.setPresetRadius = function(radius) {
            const radiusInput = document.getElementById('site_radius');
            if (radiusInput) radiusInput.value = radius;
            handleRadiusInputChange(radius);
        };

        window.handleSiteCityChange = function(cityName) {
            const target = PAKISTAN_CITY_COORDS[cityName];
            if (target && sitePickerMap) {
                sitePickerMap.flyTo([target.lat, target.lng], target.zoom);
                updateSiteLocation(target.lat, target.lng);
                showToast(`Map relocated to ${cityName}`, 'info');
            }
        };

        window.switchMapLayer = function(layerType) {
            if (!sitePickerMap || layerType === currentMapLayer) return;

            if (mapTileLayers[currentMapLayer]) {
                sitePickerMap.removeLayer(mapTileLayers[currentMapLayer]);
            }

            if (mapTileLayers[layerType]) {
                sitePickerMap.addLayer(mapTileLayers[layerType]);
                currentMapLayer = layerType;
            }

            const btnStreets = document.getElementById('btn-layer-streets');
            const btnSatellite = document.getElementById('btn-layer-satellite');

            if (layerType === 'streets') {
                if (btnStreets) btnStreets.className = 'px-2 py-0.5 text-[9.5px] font-bold rounded bg-[#242b5f] text-white';
                if (btnSatellite) btnSatellite.className = 'px-2 py-0.5 text-[9.5px] font-bold rounded text-gray-600 hover:text-gray-900';
            } else {
                if (btnStreets) btnStreets.className = 'px-2 py-0.5 text-[9.5px] font-bold rounded text-gray-600 hover:text-gray-900';
                if (btnSatellite) btnSatellite.className = 'px-2 py-0.5 text-[9.5px] font-bold rounded bg-[#242b5f] text-white';
            }
        };

        window.locateDeviceCurrentGPS = function() {
            if (!navigator.geolocation) {
                showToast('Geolocation is not supported by your browser', 'error');
                return;
            }
            showToast('Locating your GPS coordinates...', 'info');
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    if (sitePickerMap) {
                        sitePickerMap.flyTo([lat, lng], 16);
                        updateSiteLocation(lat, lng);
                        showToast(`GPS located: ${lat.toFixed(4)}, ${lng.toFixed(4)}`, 'success');
                    }
                },
                (err) => {
                    showToast('Could not access GPS device. Please check permissions.', 'error');
                },
                { timeout: 7000, enableHighAccuracy: true }
            );
        };
    </script>
</body>
</html>
