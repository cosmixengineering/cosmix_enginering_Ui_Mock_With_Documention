        // Switch between Corporate Office and Site Workplace
        // Filter role dropdown options based on Workplace Category (Office vs Site)
        function filterRolesByWorkplace(isOffice) {
            const roleSelect = document.getElementById('emp_role');
            if (!roleSelect) return;

            // Cache original optgroups on first run
            if (!window._cachedRoleOptgroups) {
                window._cachedRoleOptgroups = Array.from(roleSelect.querySelectorAll('optgroup'));
            }

            const currentVal = roleSelect.value;
            roleSelect.innerHTML = '';

            window._cachedRoleOptgroups.forEach(og => {
                const label = og.getAttribute('label') || '';
                const isOfficeGroup = label.includes('(OFFICE)') || label.includes('OFFICE & CENTRAL STORE');
                if (isOffice && isOfficeGroup) {
                    roleSelect.appendChild(og.cloneNode(true));
                } else if (!isOffice && !isOfficeGroup) {
                    roleSelect.appendChild(og.cloneNode(true));
                }
            });

            // Restore previous selection if valid in new group, else pick sensible default
            let matched = false;
            for (let i = 0; i < roleSelect.options.length; i++) {
                if (roleSelect.options[i].value === currentVal) {
                    roleSelect.selectedIndex = i;
                    matched = true;
                    break;
                }
            }
            if (!matched && roleSelect.options.length > 0) {
                roleSelect.selectedIndex = isOffice ? 2 : 0; // Default to HR or Project Engineer
            }
        }

            const city = document.getElementById('emp_city') ? document.getElementById('emp_city').value : 'Lahore';
            const siteSelect = document.getElementById('emp_site');

            if (radioOffice) radioOffice.checked = isOffice;
            if (radioSite) radioSite.checked = !isOffice;

            if (lblOffice && lblSite) {
                if (isOffice) {
                    lblOffice.className = 'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-bold transition cursor-pointer bg-blue-50 text-[#242b5f] border-2 border-[#242b5f] shadow-xs';

            filterRolesByWorkplace(isOffice);

            if (siteSelect) {
                const sites = getSitesForCity(city);
                siteSelect.innerHTML = sites.map(s => `<option value="${s}">${s}</option>`).join('');

                const targetOption = isOffice 
                    ? sites.find(s => s.includes('🏢')) || sites[0]
                    : sites.find(s => s.includes('🏗️')) || sites[1] || sites[0];

            if (shiftSelect) {
                if (isOffice) {
                    for (let i = 0; i < shiftSelect.options.length; i++) {
                        if (shiftSelect.options[i].value.includes('Head Office') || shiftSelect.options[i].value.includes('09:00 AM')) {
                            shiftSelect.selectedIndex = i;
                            break;
                        }
                    }
                } else {
                    for (let i = 0; i < shiftSelect.options.length; i++) {
                        if (shiftSelect.options[i].value.includes('General Site') || shiftSelect.options[i].value.includes('08:00 AM')) {
                            shiftSelect.selectedIndex = i;
                            break;
                        }
                    }
                }
            }
        };

        // Dynamically update site options based on selected city
        window.handleEmployeeCityChange = function(city) {
            const isOfficeSelected = document.getElementById('wp_office')?.checked;
            window.handleWorkplaceTypeChange(isOfficeSelected ? 'office' : 'site');

            const metaElem = document.getElementById('preview_emp_meta');
            if (metaElem) {
                const role = document.getElementById('emp_role')?.value || 'Project Engineer';
                metaElem.innerText = `${role} • ${city} Division`;
            }
        };

        // Smart role selection handler: automatically connects Office roles to Office workplace and 9-6 shift
        window.handleEmployeeRoleChange = function(role) {
            const city = document.getElementById('emp_city') ? document.getElementById('emp_city').value : 'Karachi';
            const metaElem = document.getElementById('preview_emp_meta');
            if (metaElem) {
                metaElem.innerText = `${role} • ${city} Division`;
            }

            const roleSelect = document.getElementById('emp_role');
            if (roleSelect && roleSelect.selectedOptions[0]) {
                const optgroupLabel = roleSelect.selectedOptions[0].parentElement?.getAttribute('label') || '';
                const isOffice = optgroupLabel.includes('(OFFICE)');
                window.handleWorkplaceTypeChange(isOffice ? 'office' : 'site');
            }
        };

        // Photo preview handler
        window.previewEmployeePhoto = function(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('photo_preview');
                    const placeholder = document.getElementById('photo_placeholder');
                    if (preview && placeholder) {
                        preview.src = e.target.result;
                        preview.classList.remove('hidden');
                        placeholder.classList.add('hidden');
                    }
                };
                reader.readAsDataURL(input.files[0]);
            }
        };

        // Interactive submission logic: adds row to the table with "Pending CEO"
        window.submitNewWorker = function() {
            const name = document.getElementById('emp_name').value.trim();
            const contact = document.getElementById('emp_contact').value.trim();
            const rawRole = document.getElementById('emp_role').value;
            const city = document.getElementById('emp_city') ? document.getElementById('emp_city').value : 'Karachi';
            const site = document.getElementById('emp_site').value;
            const salary = document.getElementById('emp_salary').value || '65000';
            const cnic = document.getElementById('emp_cnic').value || '42101-XXXXXXX-X';
            const photoPreview = document.getElementById('photo_preview');
            const hasPhoto = photoPreview && !photoPreview.classList.contains('hidden') && photoPreview.src;

            if (!name || !contact) {
                showToast('Please enter Employee Name and Contact Number!', 'error');
                return;
            }

            const displayRole = rawRole;
            const initials = name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() || 'NW';
            const newEmpId = 'EMP-' + Math.floor(1050 + Math.random() * 50);

            const avatarHTML = hasPhoto 
                ? `<img src="${photoPreview.src}" class="w-7 h-7 rounded-full object-cover border border-gray-300 shrink-0">` 
                : `<div class="w-7 h-7 rounded-full bg-[#242b5f] text-white flex items-center justify-center font-bold text-[10px] shrink-0">${initials}</div>`;

            const tbody = document.getElementById('employee-table-body');
            const newRow = document.createElement('tr');
            newRow.className = 'hover:bg-blue-50/20 transition group bg-blue-50/15 border-l-4 border-[#242b5f]';
            
            newRow.innerHTML = '' +
                '<td class="px-4 py-2.5">' +
                    '<div class="flex items-center gap-2.5">' +
                        avatarHTML +
                        '<div>' +
                            '<a href="employee-profile.html" class="font-bold text-[#242b5f] hover:underline block leading-tight">' + name + '</a>' +
                            '<p class="text-[9.5px] text-gray-400">' + displayRole + ' • ' + city + '</p>' +
                        '</div>' +
                    '</div>' +
                '</td>' +
                '<td class="px-4 py-2.5"><span class="text-[10px] font-bold text-gray-700 bg-yellow-100 text-yellow-800 px-1.5 py-0.5 rounded">' + newEmpId + '</span></td>' +
                '<td class="px-4 py-2.5 text-gray-700 font-semibold">' + displayRole + '</td>' +
                '<td class="px-4 py-2.5 text-gray-700 font-medium">' + site + '</td>' +
                '<td class="px-4 py-2.5 text-gray-500"><div>' + contact + '</div><div class="text-[9px] text-gray-400">' + cnic + '</div></td>' +
                '<td class="px-4 py-2.5 font-bold text-gray-700">Rs. ' + Number(salary).toLocaleString() + '</td>' +
                '<td class="px-4 py-2.5 text-center">' +
                    '<span class="bg-blue-50 text-blue-700 px-2 py-0.5 rounded text-[9.5px] font-bold border border-blue-200 uppercase tracking-wide flex items-center justify-center gap-1 mx-auto w-max"><i class="fas fa-spinner fa-spin text-[8px]"></i> Pending CEO</span>' +
                '</td>' +
                '<td class="px-4 py-2.5 text-right relative dropdown">' +
                    '<button class="dropdown-toggle text-gray-400 hover:text-[#242b5f] p-1 rounded hover:bg-gray-100 transition focus:outline-none" onclick="toggleDropdown(this, event)"><i class="fas fa-ellipsis-v text-xs"></i></button>' +
                    '<div class="dropdown-menu absolute right-4 top-8 w-52 bg-white rounded-lg shadow-lg border border-gray-100 py-1 z-50 text-left">' +
                        '<a href="employee-profile.html" class="block px-3 py-1.5 text-xs text-gray-700 hover:bg-gray-50 flex items-center gap-2"><i class="fas fa-user-circle w-4 text-[#242b5f]"></i> View Profile</a>' +
                        '<button onclick="openMonthHistoryModal(\'' + name.replace(/'/g, "\\'") + '\', \'' + displayRole + '\', \'' + newEmpId + '\')" class="w-full text-left px-3 py-1.5 text-xs text-gray-700 hover:bg-gray-50 flex items-center gap-2 font-semibold"><i class="fas fa-calendar-alt w-4 text-green-600"></i> Attendance Log</button>' +
                        '<button onclick="openPayslipModal({ name: \'' + name.replace(/'/g, "\\'") + '\', role: \'' + displayRole + '\', empId: \'' + newEmpId + '\', base: ' + Number(salary) + ', site: \'' + site + '\' })" class="w-full text-left px-3 py-1.5 text-xs text-gray-700 hover:bg-gray-50 flex items-center gap-2 font-semibold"><i class="fas fa-file-invoice-dollar w-4 text-blue-600"></i> Salary Invoice</button>' +
                    '</div>' +
                '</td>';

            tbody.insertBefore(newRow, tbody.firstChild);

            // Update CEO counter badge
            const pendingStat = document.getElementById('stat-pending-ceo');
            if (pendingStat) pendingStat.innerHTML = '3 <span class="text-[10px] text-orange-500 font-normal">Drafts</span>';

            // Return to directory view & reset form
            showDirectoryView();

            document.getElementById('emp_name').value = '';
            document.getElementById('emp_contact').value = '';
            if (document.getElementById('emp_address')) document.getElementById('emp_address').value = '';
            if (document.getElementById('emp_emergency_name')) document.getElementById('emp_emergency_name').value = '';
            if (document.getElementById('emp_emergency_phone')) document.getElementById('emp_emergency_phone').value = '';
            if (document.getElementById('emp_prev_company')) document.getElementById('emp_prev_company').value = '';
            if (document.getElementById('emp_prev_salary')) document.getElementById('emp_prev_salary').value = '';
            if (document.getElementById('emp_leave_reason')) document.getElementById('emp_leave_reason').value = '';
            if (photoPreview) {
                photoPreview.src = '';
                photoPreview.classList.add('hidden');
                document.getElementById('photo_placeholder')?.classList.remove('hidden');
            }

            showToast(`${displayRole} ${name} onboarded for ${site} & queued for CEO Review.`, 'success');
        };
    </script>
</body>
</html>
