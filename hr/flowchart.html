<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmix ERP - HR & Site Operations Flowchart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html { font-size: 13px !important; }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .canvas-grid {
            background-image: radial-gradient(rgba(36, 43, 95, 0.12) 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="text-slate-800 bg-[#f8fafc]">
    <div id="app-layout" class="flex min-h-screen"></div>

    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/shared.js"></script>
    <script>
        renderLayout('flowchart');

        const pageHTML = `
            <div class="space-y-4">
                
                <!-- 1. Header Toolbar -->
                <div class="bg-white p-4 rounded-xl shadow-xs border border-slate-200/80 flex flex-wrap items-center justify-between gap-3">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-[#242b5f] to-[#39428c] text-white flex items-center justify-center text-lg shadow-md shadow-indigo-950/15">
                            <i class="fas fa-diagram-project"></i>
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <h2 class="text-base font-bold text-slate-800 tracking-tight">HR & Site Operations Workflow Flowchart</h2>
                                <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[9.5px] font-bold bg-indigo-50 text-[#242b5f] border border-indigo-100">
                                    <i class="fas fa-layer-group text-[8.5px]"></i> Canvas v1.0
                                </span>
                            </div>
                            <p class="text-xs text-slate-500 mt-0.5">End-to-end business architecture, operational routing & data lifecycle across all 8 HR modules</p>
                        </div>
                    </div>

                    <div class="flex items-center gap-2">
                        <a href="index.html" class="bg-white border border-slate-200 hover:border-slate-300 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold shadow-2xs transition flex items-center gap-1.5">
                            <i class="fas fa-arrow-left text-[10px]"></i> HR Dashboard
                        </a>
                        <button onclick="exportToPDF('Cosmix_HR_Process_Flowchart')" class="bg-white border border-slate-200 hover:border-red-600 text-slate-700 hover:text-red-700 px-3 py-1.5 rounded-lg text-xs font-semibold shadow-2xs transition flex items-center gap-1.5">
                            <i class="fas fa-file-pdf text-red-500 text-xs"></i> Export PDF
                        </button>
                        <button onclick="toggleCanvasFullscreen()" class="bg-[#242b5f] text-white hover:opacity-95 px-3.5 py-1.5 rounded-lg text-xs font-bold shadow-sm transition flex items-center gap-1.5">
                            <i class="fas fa-expand text-[10.5px]"></i> Fullscreen Canvas
                        </button>
                    </div>
                </div>

                <!-- 2. High-Level Workflow Phase Overview Cards -->
                <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">
                    
                    <div class="bg-white p-3 rounded-xl border border-slate-200/80 shadow-2xs hover:border-indigo-400 transition group cursor-pointer" onclick="highlightPhase('onboarding')">
                        <div class="flex items-center justify-between mb-1.5">
                            <span class="text-[9px] font-bold text-indigo-700 bg-indigo-50 px-1.5 py-0.2 rounded border border-indigo-100">Phase 1</span>
                            <i class="fas fa-user-plus text-indigo-600 text-xs"></i>
                        </div>
                        <h4 class="font-bold text-slate-800 text-xs truncate">Onboarding</h4>
                        <p class="text-[9.5px] text-slate-400 mt-0.5 leading-snug">NADRA ID, Emergency, Prior Salary & CEO loop</p>
                    </div>

                    <div class="bg-white p-3 rounded-xl border border-slate-200/80 shadow-2xs hover:border-blue-400 transition group cursor-pointer" onclick="highlightPhase('sites')">
                        <div class="flex items-center justify-between mb-1.5">
                            <span class="text-[9px] font-bold text-blue-700 bg-blue-50 px-1.5 py-0.2 rounded border border-blue-100">Phase 2</span>
                            <i class="fas fa-map-marked-alt text-blue-600 text-xs"></i>
                        </div>
                        <h4 class="font-bold text-slate-800 text-xs truncate">Working Sites</h4>
                        <p class="text-[9.5px] text-slate-400 mt-0.5 leading-snug">GPS 80m Geofencing & ZKTeco Biometrics</p>
                    </div>

                    <div class="bg-white p-3 rounded-xl border border-slate-200/80 shadow-2xs hover:border-purple-400 transition group cursor-pointer" onclick="highlightPhase('rules')">
                        <div class="flex items-center justify-between mb-1.5">
                            <span class="text-[9px] font-bold text-purple-700 bg-purple-50 px-1.5 py-0.2 rounded border border-purple-100">Phase 3</span>
                            <i class="fas fa-sliders-h text-purple-600 text-xs"></i>
                        </div>
                        <h4 class="font-bold text-slate-800 text-xs truncate">Policy Rules</h4>
                        <p class="text-[9.5px] text-slate-400 mt-0.5 leading-snug">15-min grace, 3 lates, EOBI & FBR tax</p>
                    </div>

                    <div class="bg-white p-3 rounded-xl border border-slate-200/80 shadow-2xs hover:border-emerald-400 transition group cursor-pointer" onclick="highlightPhase('attendance')">
                        <div class="flex items-center justify-between mb-1.5">
                            <span class="text-[9px] font-bold text-emerald-700 bg-emerald-50 px-1.5 py-0.2 rounded border border-emerald-100">Phase 4</span>
                            <i class="fas fa-user-clock text-emerald-600 text-xs"></i>
                        </div>
                        <h4 class="font-bold text-slate-800 text-xs truncate">Daily Attendance</h4>
                        <p class="text-[9.5px] text-slate-400 mt-0.5 leading-snug">TCP/IP Sync & Mobile GPS punches</p>
                    </div>

                    <div class="bg-white p-3 rounded-xl border border-slate-200/80 shadow-2xs hover:border-amber-400 transition group cursor-pointer" onclick="highlightPhase('payroll')">
                        <div class="flex items-center justify-between mb-1.5">
                            <span class="text-[9px] font-bold text-amber-700 bg-amber-50 px-1.5 py-0.2 rounded border border-amber-100">Phase 5</span>
                            <i class="fas fa-file-invoice-dollar text-amber-600 text-xs"></i>
                        </div>
                        <h4 class="font-bold text-slate-800 text-xs truncate">Payroll Run</h4>
                        <p class="text-[9.5px] text-slate-400 mt-0.5 leading-snug">Net computation, loan EMIs & bank advice</p>
                    </div>

                    <div class="bg-white p-3 rounded-xl border border-slate-200/80 shadow-2xs hover:border-rose-400 transition group cursor-pointer" onclick="highlightPhase('offboarding')">
                        <div class="flex items-center justify-between mb-1.5">
                            <span class="text-[9px] font-bold text-rose-700 bg-rose-50 px-1.5 py-0.2 rounded border border-rose-100">Phase 6</span>
                            <i class="fas fa-user-minus text-rose-600 text-xs"></i>
                        </div>
                        <h4 class="font-bold text-slate-800 text-xs truncate">Offboarding</h4>
                        <p class="text-[9.5px] text-slate-400 mt-0.5 leading-snug">3-step exit, clearances & F&F settlement</p>
                    </div>

                </div>

                <!-- 3. Main Flowchart Interactive Canvas Area -->
                <div id="flowchart-canvas-container" class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col transition-all">
                    
                    <!-- Canvas Top Action Bar -->
                    <div class="px-5 py-3 border-b border-slate-100 bg-slate-50/70 flex flex-wrap items-center justify-between gap-2">
                        <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                            <span class="text-xs font-bold text-slate-700">Interactive Canvas Stage</span>
                            <span class="text-[10px] text-slate-400">| Zoom: 100% | Mode: Pan & Inspect</span>
                        </div>

                        <div class="flex items-center gap-1.5">
                            <button onclick="showToast('Zoom In', 'info')" class="w-7 h-7 rounded-lg bg-white border border-slate-200 hover:bg-slate-100 flex items-center justify-center text-slate-600 text-xs transition" title="Zoom In">
                                <i class="fas fa-plus text-[10px]"></i>
                            </button>
                            <button onclick="showToast('Zoom Out', 'info')" class="w-7 h-7 rounded-lg bg-white border border-slate-200 hover:bg-slate-100 flex items-center justify-center text-slate-600 text-xs transition" title="Zoom Out">
                                <i class="fas fa-minus text-[10px]"></i>
                            </button>
                            <button onclick="showToast('Canvas Reset', 'info')" class="w-7 h-7 rounded-lg bg-white border border-slate-200 hover:bg-slate-100 flex items-center justify-center text-slate-600 text-xs transition" title="Reset View">
                                <i class="fas fa-compress text-[10px]"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Flowchart Blueprint Canvas Placeholder -->
                    <div class="canvas-grid p-10 min-h-[500px] flex flex-col items-center justify-center text-center relative">
                        
                        <div class="max-w-xl bg-white/95 backdrop-blur-sm p-8 rounded-2xl border border-indigo-100 shadow-xl space-y-4">
                            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-[#242b5f] to-[#39428c] text-white flex items-center justify-center text-2xl mx-auto shadow-lg shadow-indigo-950/20">
                                <i class="fas fa-diagram-project"></i>
                            </div>

                            <div>
                                <h3 class="text-base font-bold text-slate-800">HR Operations Flowchart Canvas Ready</h3>
                                <p class="text-xs text-slate-500 mt-1 leading-relaxed">
                                    Flowchart page aur navigation setup complete ho chuka hai. Abhi flowchart design nahi kiya gaya hai jaise aapne instruct kiya tha:
                                    <br>
                                    <span class="font-bold text-[#242b5f]">"abhi just banao flowchart design nahi karna hai abhi apnai okkey samajhai"</span>
                                </p>
                            </div>

                            <div class="flex flex-wrap items-center justify-center gap-2 pt-1">
                                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[10.5px] font-bold bg-emerald-50 text-emerald-800 border border-emerald-200">
                                    <i class="fas fa-check-circle text-emerald-600"></i> Bottom-Right Button Active on All Pages
                                </span>
                                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[10.5px] font-bold bg-indigo-50 text-indigo-800 border border-indigo-200">
                                    <i class="fas fa-sitemap text-indigo-600"></i> Sidebar Navigation Linked
                                </span>
                            </div>

                            <div class="pt-3 border-t border-slate-100 flex flex-wrap items-center justify-center gap-2">
                                <a href="index.html" class="px-4 py-2 rounded-lg text-xs font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 transition">
                                    Return to Dashboard
                                </a>
                                <a href="employee-master.html" class="px-4 py-2 rounded-lg text-xs font-bold text-white bg-[#242b5f] hover:bg-[#1b214a] transition shadow-xs">
                                    Open Employee Master
                                </a>
                            </div>
                        </div>

                    </div>

                </div>

            </div>
        `;

        setPageContent('HR & Site Operations Flowchart', pageHTML);

        window.toggleCanvasFullscreen = function() {
            const container = document.getElementById('flowchart-canvas-container');
            if (container) {
                if (!document.fullscreenElement) {
                    container.requestFullscreen().catch(err => {
                        showToast('Fullscreen mode not available', 'info');
                    });
                } else {
                    document.exitFullscreen();
                }
            }
        };

        window.highlightPhase = function(phase) {
            showToast('Selected Phase: ' + phase.toUpperCase() + ' (Ready for diagram mapping)', 'info');
        };
    </script>
</body>
</html>
