<!DOCTYPE html>

                                        </button>

                                                <p class="text-[8.5px] font-bold text-gray-400 uppercase tracking-wider">Offboarding Steps</p>

                                            <button onclick="openModal('Assign Replacement', '<div class=space-y-2><label class=\\'text-xs font-bold\\'>Select Replacement</label><select class=\\'w-full border rounded p-1.5 text-xs\\'><option>Ali Khan (HVAC Eng)</option><option>John Doe</option></select></div>', () => showToast('Replacement Assigned!'))" class="w-full text-left px-3 py-1.5 text-xs text-gray-700 hover:bg-gray-50 flex items-center gap-2"><i class="fas fa-exchange-alt w-4"></i> Assign Replacement</button>

                                            </div>
                                        </div>

                                        <div class="font-semibold text-red-600">Termination</div>

                                    </td>
                                    <td class="px-4 py-2.5 text-gray-700 font-medium">Sep 15, 2026</td>

                                    </td>
                                    <td class="px-4 py-2.5">
                                        <span class="bg-green-50 text-green-700 px-2 py-0.5 rounded text-[9.5px] font-bold border border-green-100 flex items-center gap-1 w-max"><i class="fas fa-check"></i> Handover Complete</span>

                                        <button class="dropdown-toggle text-gray-400 hover:text-[#242b5f] p-1 rounded hover:bg-gray-100 transition focus:outline-none" onclick="toggleDropdown(this, event)">

                                            <button onclick="showToast('Downloading Clearance Certificate PDF...', 'info')" class="w-full text-left px-3 py-1.5 text-xs text-gray-700 hover:bg-gray-50 flex items-center gap-2"><i class="fas fa-print w-4"></i> Print Clearance</button>

                                    </td>

                                        <div class="flex items-center gap-2.5">
                                            <div class="w-7 h-7 rounded-full bg-blue-100 text-[#242b5f] flex items-center justify-center font-bold text-[10px]">HT</div>
                                            <div>
                                                <a href="employee-profile.html" class="font-bold text-[#242b5f] hover:underline block leading-tight">Hamza Tariq</a>
                                                <span class="text-[9.5px] text-gray-400">EMP-1028 • Site Electrician</span>
                                            </div>
                                        </div>
                                    </td>

                                            <i class="fas fa-ellipsis-v text-xs"></i>
                                        </button>
                                        <div class="dropdown-menu absolute right-4 top-8 w-48 bg-white rounded-lg shadow-lg border border-gray-100 py-1 z-50 text-left">
                                            <button onclick="openModal('Release Gratuity & Clearance', '<p class=text-xs>Approve clearance and issue experience letter for Hamza Tariq?</p>', () => { showToast('Clearance & Experience Letter approved!', 'success'); document.getElementById('offboard-status-3').innerHTML = '<span class=\\'bg-green-100 text-green-700 px-2 py-0.5 rounded text-[9.5px] font-bold border border-green-200 uppercase tracking-wide\\'>Settled</span>'; })" class="w-full text-left px-3 py-1.5 text-xs text-green-600 hover:bg-green-50 flex items-center gap-2"><i class="fas fa-certificate w-4"></i> Issue Experience Letter</button>

                                        </div>
                                    </td>
                                </tr>

                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        `);
    </script>
</body>
