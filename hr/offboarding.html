        setPageContent('6. Offboarding, Clearances & Warnings', pageHTML);

        // ==============================================================
        // JAVASCRIPT WORKFLOW CONTROLLER
        // ==============================================================

        // 1. Tab Switcher
        window.switchOffboardingTab = function(tab) {
            const tabs = ['pipeline', 'warnings', 'settlements', 'replacements'];
            tabs.forEach(t => {
                const btn = document.getElementById(`tab-btn-${t}`);
                const view = document.getElementById(`view-${t}`);
                if (t === tab) {
                    btn.className = 'tab-btn active px-3.5 py-2.5 text-xs font-bold text-[#242b5f] transition flex items-center gap-2 border-b-[2.5px] border-[#242b5f] bg-white';
                    view.classList.remove('hidden');
                } else {
                    btn.className = 'tab-btn px-3.5 py-2.5 text-xs font-semibold text-gray-600 hover:text-[#242b5f] transition flex items-center gap-2 border-b-2 border-transparent';
                    view.classList.add('hidden');
                }
            });
        };

        // Helper to update active exit count across KPIs and tabs
        function updateActiveExitCounts() {
            const tbody = document.getElementById('offboarding-table-body');
            const count = tbody ? tbody.children.length : 3;
            const statActive = document.getElementById('stat-active-cases');
            if (statActive) statActive.innerHTML = `${count} <span class="text-[10px] text-orange-600 font-normal">Active Exits</span>`;
            const badgeCount = document.getElementById('badge-pipeline-count');
            if (badgeCount) badgeCount.innerText = count;
        }

        // Helper to update incoming mobile queue counter & empty state
        function updateMobileQueueStatus() {
            const container = document.getElementById('mobile-requests-container');
            if (!container) return;
            const pendingCards = container.querySelectorAll('[id^="app-req-"]');
            const count = pendingCards.length;
            const badge = document.getElementById('badge-app-requests');
            if (badge) {
                if (count > 0) {
                    badge.innerText = `${count} Pending HR Review`;
                    badge.className = 'bg-blue-100 text-blue-800 text-[9.5px] font-extrabold px-2 py-0.5 rounded-full border border-blue-200 animate-pulse';
                } else {
                    badge.innerText = '0 Pending';
                    badge.className = 'bg-gray-100 text-gray-500 text-[9.5px] font-bold px-2 py-0.5 rounded-full border border-gray-200';
                    container.innerHTML = `
                        <div class="col-span-full text-center py-5 px-4 bg-white rounded-lg border border-dashed border-gray-200 space-y-1">
                            <div class="w-8 h-8 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto text-sm">
                                <i class="fas fa-check"></i>
                            </div>
                            <p class="text-xs font-bold text-gray-700">All incoming mobile resignation requests have been processed!</p>
                            <p class="text-[10px] text-gray-400">Any new requests submitted via Cosmix Mobile Self-Service App will appear here immediately.</p>
                        </div>
                    `;
                }
            }
        }

        // 2. Visual Exit Type Selector
        window.selectExitType = function(type) {
            document.getElementById('exit_category').value = type;
            
            const mapping = [
                { type: 'Resignation', id: 'card-exit-resignation' },
                { type: 'Termination', id: 'card-exit-termination' },
                { type: 'Contract Expiry', id: 'card-exit-contract-expiry' }
            ];

            mapping.forEach(item => {
                const card = document.getElementById(item.id);
                if (!card) return;
                const icon = card.querySelector('.card-icon');
                const check = card.querySelector('.card-check');

                if (item.type === type) {
                    card.className = 'p-3 rounded-lg border-2 border-[#242b5f] bg-blue-50/40 cursor-pointer transition flex items-center justify-between ring-2 ring-[#242b5f]/10 shadow-2xs';
                    if (icon) icon.className = 'card-icon w-8 h-8 rounded-lg bg-[#242b5f] text-white flex items-center justify-center text-xs shrink-0';
                    if (check) check.classList.remove('hidden');
                } else {
                    card.className = 'p-3 rounded-lg border border-gray-200 bg-white hover:border-gray-300 cursor-pointer transition flex items-center justify-between';
                    if (icon) icon.className = 'card-icon w-8 h-8 rounded-lg bg-gray-100 text-gray-500 flex items-center justify-center text-xs shrink-0';
                    if (check) check.classList.add('hidden');
                }
            });
        };

        // 3. Initiate Exit Modal Handlers (Simplified 3-Step)
        window.openInitiateExitModal = function() {
            document.getElementById('initiate-exit-modal').classList.remove('hidden');
        };

        window.closeInitiateExitModal = function() {
            document.getElementById('initiate-exit-modal').classList.add('hidden');
        };

                                ${name}

                            <p class="text-[9.5px] text-gray-400">${code} • ${role} • ${site}</p>
                        </div>
                    </div>
                </td>
                <td class="px-4 py-2.5">
                    <div class="flex items-center gap-1.5">

                    </div>
                    <p class="text-[9px] text-amber-700 font-semibold mt-0.5"><i class="fas fa-clock text-[8.5px] mr-0.5"></i> Exit Initiated Today</p>
                </td>
                <td class="px-4 py-2.5">
                    <div class="space-y-1">

                        </div>
                        <div class="w-36 bg-gray-100 rounded-full h-1.5 overflow-hidden">

                        </div>
                        <p class="text-[8.5px] text-gray-400">Store, Accounts & IT Pending</p>
                    </div>
                </td>
                <td class="px-4 py-2.5">
                    <div class="font-bold text-gray-800 text-xs">Under Audit</div>
                    <span class="bg-yellow-50 text-yellow-800 px-1.5 py-0.5 rounded text-[9px] font-bold border border-yellow-200">
                        Calculation Pending
                    </span>
                </td>
                <td class="px-4 py-2.5 text-right">
                    <div class="flex items-center justify-end gap-1.5">
                        <button onclick="openDepartmentClearanceModal('${code}', '${name}', '${role}', '${site}', false, false, false, false)" class="bg-[#242b5f] hover:bg-[#1a2046] text-white px-2.5 py-1 rounded text-xs font-semibold shadow-2xs transition flex items-center gap-1">
                            <i class="fas fa-tasks text-[9.5px]"></i> Clearances
                        </button>
                        <div class="relative dropdown">
                            <button class="dropdown-toggle text-gray-400 hover:text-[#242b5f] p-1 rounded hover:bg-gray-100 transition focus:outline-none" onclick="toggleDropdown(this, event)">
                                <i class="fas fa-ellipsis-v text-xs"></i>
                            </button>
                            <div class="dropdown-menu absolute right-0 top-7 w-48 bg-white rounded-lg shadow-lg border border-gray-100 py-1 z-50 text-left">
                                <button onclick="openFFSettlementModal('${code}', '${name}', 65000, 15, 4, 0)" class="w-full text-left px-3 py-1.5 text-xs text-emerald-600 hover:bg-emerald-50 flex items-center gap-2 font-medium">
                                    <i class="fas fa-calculator w-4"></i> F&F Calculator
                                </button>
                                <button onclick="printExperienceLetter('${name}', '${role}', 'Jan 2024', '${lastDay}')" class="w-full text-left px-3 py-1.5 text-xs text-purple-600 hover:bg-purple-50 flex items-center gap-2">
                                    <i class="fas fa-file-contract w-4"></i> Experience Certificate
                                </button>
                                <div class="h-px bg-gray-100 my-1"></div>
                                <button onclick="revokeBiometricAccess('${code}', '${name}')" class="w-full text-left px-3 py-1.5 text-xs text-red-600 hover:bg-red-50 flex items-center gap-2">
                                    <i class="fas fa-user-lock w-4"></i> Revoke Biometric
                                </button>
                            </div>
                        </div>
                    </div>
                </td>
            `;

            tbody.insertBefore(row, tbody.firstChild);
            updateActiveExitCounts();
            closeInitiateExitModal();
            showToast(`Exit workflow started for ${name}! Clearances activated across Store, Accounts & IT.`, 'success');
        };

        // 4. Mobile App Resignation Handlers
        window.acceptMobileResignation = function(empId, name) {
            // Remove card from mobile queue with smooth animation
            const card = document.getElementById('app-req-' + empId.toLowerCase());
            if (card) {
                card.style.transition = 'all 0.25s ease';
                card.style.opacity = '0';
                card.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    card.remove();
                    updateMobileQueueStatus();
                }, 250);
            }
            
            showToast(`Resignation of ${name} sent to Director/Boss for final approval.`, 'success');
        };

        window.discussMobileResignation = function(empId, name) {
            openModal(
                'Schedule Retention Talk: ' + name,
                `<div class="space-y-3 text-xs">
                    <p class="text-gray-600">Coordinate with Site Project Manager to explore retaining <b>${name} (${empId})</b> before approving final offboarding.</p>
                    <div>
                        <label class="block text-[10.5px] font-bold text-gray-700 mb-1">Proposed Retention Measure</label>
                        <select id="retention_offer" class="w-full border border-gray-200 rounded px-2.5 py-1.5 text-xs bg-white focus:outline-none focus:border-[#242b5f]">
                            <option value="increment">Salary Increment Review (+10-15%)</option>
                            <option value="transfer">Site Transfer closer to worker's hometown</option>
                            <option value="allowance">Add Outstation / Site Hardship Allowance</option>
                            <option value="leave">Approve 10-day Emergency Paid Leave</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10.5px] font-bold text-gray-700 mb-1">Supervisor Discussion Notes</label>
                        <textarea rows="2" class="w-full border border-gray-200 rounded p-2 text-xs bg-white outline-none focus:border-[#242b5f]" placeholder="Enter key points discussed with the worker..."></textarea>
                    </div>
                </div>`,
                () => showToast(`Retention meeting logged for ${name} with Site Manager!`, 'info')
            );
        };

        window.rejectMobileResignation = function(empId, name) {
            openModal(
                'Reject Resignation: ' + name,
                `<div class="space-y-2 text-xs">
                    <p class="text-gray-700">Are you sure you want to decline this mobile resignation request for <b>${name} (${empId})</b>?</p>
                    <p class="text-gray-500 text-[10.5px]">A status update will be sent to the worker's mobile app instructing them to complete mandatory project handover first.</p>
                </div>`,
                () => {
                    const card = document.getElementById('app-req-' + empId.toLowerCase());
                    if (card) {
                        card.style.transition = 'all 0.25s ease';
                        card.style.opacity = '0';
                        card.style.transform = 'scale(0.95)';
                        setTimeout(() => {
                            card.remove();
                            updateMobileQueueStatus();
                        }, 250);
                    }
                    showToast(`Resignation request from ${name} declined and sent back to mobile app.`, 'info');
                }
            );

        // 3. Department Clearance Modal Handlers
        let activeClrEmp = null;

        window.openDepartmentClearanceModal = function(code, name, role, site, store, fin, it, hr) {
            activeClrEmp = { code, name, role, site };
            document.getElementById('clr-emp-name').innerText = `Clearance Sheet: ${name} (${code})`;
            document.getElementById('clr-emp-sub').innerText = `${role} • Project Site: ${site}`;

            document.getElementById('chk_store_tools').checked = store;
            document.getElementById('chk_finance_advance').checked = fin;
            document.getElementById('chk_it_biometric').checked = it;
            document.getElementById('chk_hr_interview').checked = hr;

            updateClearanceMath();
            document.getElementById('clearance-modal').classList.remove('hidden');
        };

        window.closeDepartmentClearanceModal = function() {
            document.getElementById('clearance-modal').classList.add('hidden');
        };

        window.updateClearanceMath = function() {
            let total = 2;
            let cleared = 0;

            if (document.getElementById('chk_store_tools')?.checked) cleared++;
            if (document.getElementById('chk_finance_advance')?.checked) cleared++;

            const pct = Math.round((cleared / total) * 100);
            document.getElementById('clr-progress-text').innerText = `${pct}% Cleared (${cleared} of ${total})`;
            document.getElementById('clr-progress-bar').style.width = `${pct}%`;

            // Update mini badges
            if (document.getElementById('clr-badge-store')) {
                document.getElementById('clr-badge-store').className = document.getElementById('chk_store_tools')?.checked 
                    ? 'bg-green-100 text-green-800 font-bold px-2 py-0.5 rounded text-[9.5px]' 
                    : 'bg-red-100 text-red-800 font-bold px-2 py-0.5 rounded text-[9.5px]';
                document.getElementById('clr-badge-store').innerText = document.getElementById('chk_store_tools')?.checked ? 'Signed Off' : 'Pending';
            }

            if (document.getElementById('clr-badge-finance')) {
                document.getElementById('clr-badge-finance').className = document.getElementById('chk_finance_advance')?.checked 
                    ? 'bg-green-100 text-green-800 font-bold px-2 py-0.5 rounded text-[9.5px]' 
                    : 'bg-red-100 text-red-800 font-bold px-2 py-0.5 rounded text-[9.5px]';
                document.getElementById('clr-badge-finance').innerText = document.getElementById('chk_finance_advance')?.checked ? 'Cleared' : 'Hold: Advance';
            }
        };

        window.saveClearanceStatus = function() {
            closeDepartmentClearanceModal();
            showToast(`Clearance progress updated for ${activeClrEmp ? activeClrEmp.name : 'worker'}!`, 'success');
        };

        // 4. Full & Final Settlement Calculator Handlers
        let activeFFBasic = 85000;

        window.openFFSettlementModal = function(code, name, basicSalary, unpaidDays, leaveDays, advanceBal) {
            activeFFBasic = basicSalary || 85000;
            document.getElementById('ff-emp-sub').innerText = `${name} (${code}) • Base Salary: Rs. ${activeFFBasic.toLocaleString()}`;
            document.getElementById('ff_unpaid_days').value = unpaidDays || 18;
            document.getElementById('ff_leave_days').value = leaveDays || 6;
            document.getElementById('ff_advance_bal').value = advanceBal || 0;

            calculateFFMath();
            document.getElementById('ff-modal').classList.remove('hidden');
        };

        window.closeFFModal = function() {
            document.getElementById('ff-modal').classList.add('hidden');
        };

        window.calculateFFMath = function() {
            const dailyRate = Math.round(activeFFBasic / 30);
            const unpaidDays = parseFloat(document.getElementById('ff_unpaid_days').value) || 0;
            const leaveDays = parseFloat(document.getElementById('ff_leave_days').value) || 0;
            const gratuity = parseFloat(document.getElementById('ff_gratuity').value) || 0;

            const advanceBal = parseFloat(document.getElementById('ff_advance_bal').value) || 0;
            const toolPenalty = parseFloat(document.getElementById('ff_tool_penalty').value) || 0;

            const proratedSalary = unpaidDays * dailyRate;
            const leaveAmount = leaveDays * dailyRate;

            document.getElementById('ff_prorated_salary').value = proratedSalary.toLocaleString();
            document.getElementById('ff_leave_amount').value = leaveAmount.toLocaleString();

            const totalEarnings = proratedSalary + leaveAmount + gratuity;
            const totalDeductions = advanceBal + toolPenalty;
            const netPayable = Math.max(0, totalEarnings - totalDeductions);

            document.getElementById('ff-total-earnings').innerText = `Rs. ${totalEarnings.toLocaleString()}`;
            document.getElementById('ff-total-deductions').innerText = `Rs. ${totalDeductions.toLocaleString()}`;
            document.getElementById('ff-net-payable').innerText = `Rs. ${netPayable.toLocaleString()}`;
        };

        window.approveFFSettlement = function() {
            closeFFModal();
            showToast('Full & Final Settlement approved and routed to Accounts for cheque disbursement!', 'success');
        };

    </script>
