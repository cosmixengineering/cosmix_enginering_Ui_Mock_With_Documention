                const endTimeRaw = document.getElementById('new-shift-end').value;
                const breakMins = parseInt(document.getElementById('new-shift-break').value) || 0;
                const graceMins = parseInt(document.getElementById('new-shift-grace').value) || 15;
                const halfDayCutoff = document.getElementById('new-shift-halfday').value.trim() || '10:30 AM';
                const absentCutoff = document.getElementById('new-shift-absent').value.trim() || '12:00 PM';
                const otRule = document.getElementById('new-shift-ot').value;
                const nightPay = parseFloat(document.getElementById('new-shift-nightpay').value) || 0;
                const desc = document.getElementById('new-shift-desc').value.trim() || 'Custom work schedule configured by HR.';
                const selectedSite = document.getElementById('new-shift-site').value;

                const days = [];
                document.querySelectorAll('input[name="new-shift-days"]:checked').forEach(cb => days.push(cb.value));

                const formatTime12 = (t24) => {
                    if (!t24) return '';
                    let [h, m] = t24.split(':').map(Number);
                    const ampm = h >= 12 ? 'PM' : 'AM';
                    h = h % 12 || 12;
                    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')} ${ampm}`;
                };

                const newShift = {
                    id: 'sh_' + Date.now(),
                    code: code || `SH-SITE-0${shiftsData.length + 1}`,
                    name: name,
                    category: cat,
                    startTime: formatTime12(startTimeRaw),
                    endTime: formatTime12(endTimeRaw),
                    startTimeRaw: startTimeRaw,
                    endTimeRaw: endTimeRaw,
                    duration: `8.0h Work (${breakMins}m Break)`,
                    totalHours: 9.0,
                    workHours: 8.0,
                    breakMins: breakMins,
                    breakName: breakMins > 0 ? `${breakMins}m Lunch/Break` : 'No Break',
                    graceMins: graceMins,
                    halfDayCutoff: halfDayCutoff,
                    absentCutoff: absentCutoff,
                    otRule: otRule,
                    nightAllowance: nightPay,
                    days: days.length > 0 ? days : ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
                    assignedCount: 0,
                    assignedLabel: '0 Workers Assigned (Newly Created)',
                    sites: [selectedSite],
                    status: 'Active',
                    badgeColor: 'bg-emerald-50 text-emerald-700 border-emerald-200',
                    icon: 'fa-business-time',
                    iconColor: 'text-[#242b5f]',
                    bgGradient: 'from-emerald-50/40 to-blue-50/20',
                    description: desc
                };

                shiftsData.unshift(newShift);
                saveShifts(shiftsData);
                filterShifts();
                showToast(`New Shift "${name}" created successfully!`, 'success');
            });
        };

        window.calculateNewShiftHours = () => {
            const start = document.getElementById('new-shift-start')?.value;
            const end = document.getElementById('new-shift-end')?.value;
            const brk = parseInt(document.getElementById('new-shift-break')?.value) || 0;
            const calcEl = document.getElementById('new-shift-duration-calc');
            if (!start || !end || !calcEl) return;

            let [sh, sm] = start.split(':').map(Number);
            let [eh, em] = end.split(':').map(Number);
            let startMins = sh * 60 + sm;
            let endMins = eh * 60 + em;
            if (endMins < startMins) endMins += 24 * 60; // Overnight shift

            let totalMins = endMins - startMins;
            let workMins = Math.max(0, totalMins - brk);
            let workHours = (workMins / 60).toFixed(1);
            calcEl.value = `${workHours} Hours`;
        };

        // ===== MODAL 2: EDIT SHIFT =====
        window.openEditShiftModal = (shiftId) => {
            const shift = shiftsData.find(s => s.id === shiftId);
            if (!shift) return;

            const html = `
                <div class="space-y-3.5 text-xs text-left max-h-[75vh] overflow-y-auto pr-1">
                    <div class="bg-gray-50 p-2.5 rounded-lg border border-gray-200 flex justify-between items-center">
                        <div>
                            <span class="text-[9px] font-mono font-bold text-gray-500">${shift.code}</span>
                            <h4 class="font-bold text-xs text-gray-800">${shift.name}</h4>
                        </div>
                        <span class="text-[9px] px-2 py-0.5 rounded font-bold ${shift.status === 'Active' ? 'bg-green-100 text-green-700' : 'bg-gray-200 text-gray-700'}">${shift.status}</span>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                        <div>
                            <label class="block font-bold text-gray-700 mb-1">Shift Name</label>
                            <input type="text" id="edit-shift-name" value="${shift.name}" class="w-full border border-gray-200 rounded p-1.5 text-xs font-bold text-gray-800 focus:border-[#242b5f]">
                        </div>
                        <div>
                            <label class="block font-bold text-gray-700 mb-1">Category</label>
                            <select id="edit-shift-cat" class="w-full border border-gray-200 rounded p-1.5 text-xs bg-white focus:border-[#242b5f]">
                                <option value="Site Technical" ${shift.category === 'Site Technical' ? 'selected' : ''}>Site Technical / Field MEP</option>
                                <option value="Corporate" ${shift.category === 'Corporate' ? 'selected' : ''}>Head Office / Corporate</option>
                                <option value="Night Operations" ${shift.category === 'Night Operations' ? 'selected' : ''}>Night Operations</option>
                                <option value="Special" ${shift.category === 'Special' ? 'selected' : ''}>Special / Half-Day</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-3 gap-2">
                        <div>
                            <label class="block font-bold text-gray-700 mb-1">Start Time (24h)</label>
                            <input type="time" id="edit-shift-start" value="${shift.startTimeRaw || '08:00'}" class="w-full border border-gray-200 rounded p-1.5 text-xs bg-white font-bold">
                        </div>
                        <div>
                            <label class="block font-bold text-gray-700 mb-1">End Time (24h)</label>
                            <input type="time" id="edit-shift-end" value="${shift.endTimeRaw || '17:00'}" class="w-full border border-gray-200 rounded p-1.5 text-xs bg-white font-bold">
                        </div>
                        <div>
                            <label class="block font-bold text-gray-700 mb-1">Late Grace (Mins)</label>
                            <input type="number" id="edit-shift-grace" value="${shift.graceMins}" class="w-full border border-gray-200 rounded p-1.5 text-xs bg-white font-bold">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                        <div>
                            <label class="block font-bold text-gray-700 mb-1">½ Day Arrival Cutoff</label>
                            <input type="text" id="edit-shift-halfday" value="${shift.halfDayCutoff}" class="w-full border border-gray-200 rounded p-1.5 text-xs">
                        </div>
                        <div>
                            <label class="block font-bold text-gray-700 mb-1">Absent Arrival Cutoff</label>
                            <input type="text" id="edit-shift-absent" value="${shift.absentCutoff}" class="w-full border border-gray-200 rounded p-1.5 text-xs">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                        <div>
                            <label class="block font-bold text-gray-700 mb-1">Night Shift Extra Allowance (PKR)</label>
                            <input type="number" id="edit-shift-nightpay" value="${shift.nightAllowance}" class="w-full border border-gray-200 rounded p-1.5 text-xs font-bold">
                        </div>
                        <div>
                            <label class="block font-bold text-gray-700 mb-1">Shift Status</label>
                            <select id="edit-shift-status" class="w-full border border-gray-200 rounded p-1.5 text-xs bg-white">
                                <option value="Active" ${shift.status === 'Active' ? 'selected' : ''}>Active</option>
                                <option value="Inactive" ${shift.status === 'Inactive' ? 'selected' : ''}>Inactive / Template</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block font-bold text-gray-700 mb-1">Operational Description</label>
                        <textarea id="edit-shift-desc" rows="2" class="w-full border border-gray-200 rounded p-1.5 text-xs">${shift.description || ''}</textarea>
                    </div>
                </div>
            `;

            openModal(`Edit Shift: ${shift.name}`, html, () => {
                shift.name = document.getElementById('edit-shift-name').value.trim();
                shift.category = document.getElementById('edit-shift-cat').value;
                const st = document.getElementById('edit-shift-start').value;
                const et = document.getElementById('edit-shift-end').value;
                shift.startTimeRaw = st;
                shift.endTimeRaw = et;
                
                const formatTime12 = (t24) => {
                    if (!t24) return '';
                    let [h, m] = t24.split(':').map(Number);
                    const ampm = h >= 12 ? 'PM' : 'AM';
                    h = h % 12 || 12;
                    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')} ${ampm}`;
                };
                shift.startTime = formatTime12(st);
                shift.endTime = formatTime12(et);

                shift.graceMins = parseInt(document.getElementById('edit-shift-grace').value) || 15;
                shift.halfDayCutoff = document.getElementById('edit-shift-halfday').value.trim();
                shift.absentCutoff = document.getElementById('edit-shift-absent').value.trim();
                shift.nightAllowance = parseFloat(document.getElementById('edit-shift-nightpay').value) || 0;
                shift.status = document.getElementById('edit-shift-status').value;
                shift.description = document.getElementById('edit-shift-desc').value.trim();

                saveShifts(shiftsData);
                filterShifts();
                showToast(`Shift "${shift.name}" updated successfully!`, 'success');
            });
        };

        // ===== MODAL 3: ASSIGN ROSTER TO WORKERS =====
        window.openAssignRosterModal = (shiftId) => {
            const currentShift = shiftId ? shiftsData.find(s => s.id === shiftId) : shiftsData[0];
            const shiftOptions = shiftsData.filter(s => s.status === 'Active').map(s => {
                return `<option value="${s.id}" ${currentShift && s.id === currentShift.id ? 'selected' : ''}>${s.name} (${s.startTime} - ${s.endTime})</option>`;
            }).join('');

            const html = `
                <div class="space-y-3 text-xs text-left">
                    <div class="bg-indigo-50 p-2.5 rounded-lg border border-indigo-100 flex items-center gap-2">
                        <i class="fas fa-users-cog text-[#242b5f]"></i>
                        <p class="text-[11px] text-gray-700">Assign an entire project site, department, or selected technicians to a work shift roster.</p>
                    </div>

                    <div>
                        <label class="block font-bold text-gray-700 mb-1">Target Shift Schedule *</label>
                        <select id="roster-assign-shift" class="w-full border border-gray-200 rounded p-1.5 text-xs bg-white font-bold text-gray-800 focus:border-[#242b5f]">
                            ${shiftOptions}
                        </select>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                        <div>
                            <label class="block font-bold text-gray-700 mb-1">Assignment Scope *</label>
                            <select id="roster-assign-scope" class="w-full border border-gray-200 rounded p-1.5 text-xs bg-white text-gray-700">
                                <option value="site">Entire Project Site</option>
                                <option value="dept">Entire Department</option>
                                <option value="custom">Selected Individual Technicians</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-bold text-gray-700 mb-1">Target Site / Department</label>
                            <select id="roster-assign-target" class="w-full border border-gray-200 rounded p-1.5 text-xs bg-white text-gray-700">
                                <option value="Karachi High-Rise Commercial Tower">Karachi High-Rise Commercial Tower (28 Workers)</option>
                                <option value="Islamabad Federal Govt Complex">Islamabad Federal Govt Complex (24 Workers)</option>
                                <option value="Peshawar Industrial Substation">Peshawar Industrial Substation (18 Workers)</option>
                                <option value="Port Qasim Chiller & Cold Storage">Port Qasim Chiller (16 Workers)</option>
                                <option value="Lahore HQ & Central Workshop">Lahore HQ & Workshop (34 Staff)</option>
                                <option value="MEP & Execution Department">MEP & Execution Department (64 Workers)</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block font-bold text-gray-700 mb-1">Effective From Date</label>
                            <input type="date" class="w-full border border-gray-200 rounded p-1.5 text-xs bg-white" value="2026-09-08">
                        </div>
                        <div>
                            <label class="block font-bold text-gray-700 mb-1">Roster Cycle</label>
                            <select class="w-full border border-gray-200 rounded p-1.5 text-xs bg-white">
                                <option>Current Monthly Cycle (Sep 2026)</option>
                                <option>Permanent Roster Assignment</option>
                                <option>Weekly Rotating Shift (7 Days)</option>
                            </select>
                        </div>
                    </div>

                    <div class="p-2 bg-green-50 rounded border border-green-200 text-[10px] text-green-800 flex items-center gap-1.5 font-medium">
                        <i class="fas fa-check-circle"></i> Biometric device schedules will be refreshed at site automatically.
                    </div>
                </div>
            `;

            openModal('Assign Work Shift Roster', html, () => {
                const target = document.getElementById('roster-assign-target').value;
                const shiftSelect = document.getElementById('roster-assign-shift');
                const shiftName = shiftSelect.options[shiftSelect.selectedIndex].text;
                showToast(`Roster assigned! ${target} mapped to "${shiftName}".`, 'success');
            });
        };

        // Actions: Clone, Toggle Status, Delete
        window.cloneShift = (shiftId) => {
            const orig = shiftsData.find(s => s.id === shiftId);
            if (!orig) return;

            const cloned = JSON.parse(JSON.stringify(orig));
            cloned.id = 'sh_' + Date.now();
            cloned.code = `${orig.code}-COPY`;
            cloned.name = `${orig.name} (Copy)`;
            cloned.assignedCount = 0;
            cloned.assignedLabel = '0 Workers Assigned (Cloned Template)';

            shiftsData.unshift(cloned);
            saveShifts(shiftsData);
            filterShifts();
            showToast(`Shift cloned as "${cloned.name}"!`, 'success');
        };

        window.toggleShiftStatus = (shiftId) => {
            const shift = shiftsData.find(s => s.id === shiftId);
            if (!shift) return;

            shift.status = (shift.status === 'Active') ? 'Inactive' : 'Active';
            saveShifts(shiftsData);
            filterShifts();
            showToast(`Shift "${shift.name}" marked as ${shift.status}!`, 'info');
        };

        window.deleteShift = (shiftId) => {
            const shift = shiftsData.find(s => s.id === shiftId);
            if (!shift) return;

            if (shift.assignedCount > 0) {
                if (!confirm(`Warning: "${shift.name}" has ${shift.assignedCount} workers assigned. Are you sure you want to delete this shift?`)) {
                    return;
                }
            } else {
                if (!confirm(`Are you sure you want to remove shift "${shift.name}"?`)) {
                    return;
                }
            }

            shiftsData = shiftsData.filter(s => s.id !== shiftId);
            saveShifts(shiftsData);
            filterShifts();
            showToast(`Shift "${shift.name}" deleted.`, 'info');
        };

        // Initialize display
        filterShifts();
    </script>
</body>
</html>
