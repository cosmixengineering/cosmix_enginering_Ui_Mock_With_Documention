                                        </div>
                                    </div>
                                    <span class="text-xs text-[#242b5f] font-bold flex items-center gap-1 group-hover:underline"><i class="fas fa-eye text-xs"></i> View Invoice</span>
                                </div>
                                <div onclick="openPayslipModal({ name: 'Ali Khan', role: 'HVAC Engineer', empId: 'EMP-1042', month: 'July 2026', site: 'Karachi High-Rise', base: 85000, ot: 6000, advanceEmi: 5000, tax: 2500 })" class="px-5 py-3 hover:bg-blue-50/20 transition flex justify-between items-center cursor-pointer group">
                                    <div class="flex items-center gap-3">
                                        <div class="w-8 h-8 rounded bg-red-50 text-red-500 flex items-center justify-center border border-red-100 group-hover:bg-[#242b5f] group-hover:text-white transition">
                                            <i class="fas fa-file-invoice-dollar text-sm"></i>
                                        </div>
                                        <div>
                                            <p class="text-xs font-bold text-gray-800 group-hover:text-[#242b5f]">July 2026 Salary Slip</p>
                                            <p class="text-[9px] text-gray-400 mt-0.5 uppercase tracking-wider">Disbursed: 1 Aug • Rs. 85,920 Net</p>
                                        </div>
                                    </div>
                                    <span class="text-xs text-[#242b5f] font-bold flex items-center gap-1 group-hover:underline"><i class="fas fa-eye text-xs"></i> View Invoice</span>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        `);

        // Real-time Geofence Map State & Handlers
        let employeeMap = null;
        let employeeMarker = null;
        let geofenceCircle = null;
        let trailPolyline = null;
        let showingTrail = false;

        const SITE_LOCATIONS = {
            karachi: {
                name: 'Karachi High-Rise (Block 4, Clifton)',
                lat: 24.8138,
                lng: 67.0299,
                radius: 80,
                coords: '24.8138° N, 67.0299° E',
                punch: '09:02 AM • 5th Floor MEP Chiller Zone',
                trail: [
                    [24.8130, 67.0292],
                    [24.8134, 67.0295],
                    [24.8137, 67.0298],
                    [24.8138, 67.0299]
                ]
            },
            lahore: {
                name: 'Head Office (Gulberg III, Lahore)',
                lat: 31.5204,
                lng: 74.3587,
                radius: 60,
                coords: '31.5204° N, 74.3587° E',
                punch: '08:55 AM • 2nd Floor Engineering Dept',
                trail: [
                    [31.5198, 74.3580],
                    [31.5201, 74.3583],
                    [31.5204, 74.3587]
                ]
            },
            islamabad: {
                name: 'Islamabad Govt Complex Site',
                lat: 33.7294,
                lng: 73.0931,
                radius: 100,
                coords: '33.7294° N, 73.0931° E',
                punch: '08:45 AM • Substation Site Yard',
                trail: [
                    [33.7285, 73.0920],
                    [33.7290, 73.0926],
                    [33.7294, 73.0931]
                ]
            }
        };

        let currentSiteKey = 'karachi';

        function initEmployeeMap() {
            const mapEl = document.getElementById('live-map');
            if (!mapEl) return;

            const site = SITE_LOCATIONS[currentSiteKey];

            if (typeof L !== 'undefined') {
                try {
                    if (employeeMap) {
                        employeeMap.remove();
                    }
                    employeeMap = L.map('live-map', { 
                        zoomControl: false,
                        attributionControl: false 
                    }).setView([site.lat, site.lng], 16);

                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19
                    }).addTo(employeeMap);

                    L.control.zoom({ position: 'bottomright' }).addTo(employeeMap);

                    // Geofence Circle Perimeter
                    geofenceCircle = L.circle([site.lat, site.lng], {
                        color: '#242b5f',
                        weight: 2,
                        fillColor: '#3b82f6',
                        fillOpacity: 0.18,
                        radius: site.radius
                    }).addTo(employeeMap);

                    // Custom Pulsing Worker Pin
                    const workerIcon = L.divIcon({
                        className: 'custom-worker-pin',
                        html: `
                            <div style="position:relative; width:34px; height:34px; display:flex; align-items:center; justify-content:center;">
                                <div style="position:absolute; width:100%; height:100%; border-radius:50%; background:#22c55e; opacity:0.4; animation:ping 1.5s cubic-bezier(0,0,0.2,1) infinite;"></div>
                                <div style="width:28px; height:28px; border-radius:50%; background:#242b5f; color:white; font-size:10px; font-weight:bold; display:flex; align-items:center; justify-content:center; border:2.5px solid white; box-shadow:0 2px 6px rgba(0,0,0,0.35);">
                                    AK
                                </div>
                            </div>
                        `,
                        iconSize: [34, 34],
                        iconAnchor: [17, 17]
                    });

                    employeeMarker = L.marker([site.lat, site.lng], { icon: workerIcon }).addTo(employeeMap);
                    
                    updatePopupContent(site);

                    trailPolyline = L.polyline(site.trail, {
                        color: '#0284c7',
                        weight: 3,
                        dashArray: '5, 8',
                        opacity: 0.85
                    });

                    setTimeout(() => {
                        employeeMap.invalidateSize();
                    }, 300);
                } catch(err) {
                    console.warn('Leaflet map initialization notice:', err);
                }
            }
        }

        function updatePopupContent(site) {
            if (!employeeMarker) return;
            employeeMarker.bindPopup(`
                <div style="font-family:Inter,sans-serif; font-size:11px; line-height:1.4; padding:2px;">
                    <b style="color:#242b5f; font-size:12px;">Ali Khan (EMP-1042)</b><br>
                    <span style="color:#64748b;">HVAC Engineer • MEP Operations</span><br>
                    <div style="margin-top:4px; padding:3px 6px; background:#ecfdf5; border:1px solid #a7f3d0; border-radius:4px; color:#047857; font-weight:bold; font-size:10px;">
                        ● Inside Permitted Geofence (Work Hours)
                    </div>
                    <div style="margin-top:4px; color:#334155; font-size:10px; border-top:1px solid #f1f5f9; padding-top:3px;">
                        <b>Current Site:</b> ${site.name}<br>
                        <b>Activity:</b> ${site.punch}
                    </div>
                </div>
            `);
        }

        window.switchMapSite = (key) => {
            currentSiteKey = key;
            const site = SITE_LOCATIONS[key];
            if (!site) return;

            document.getElementById('meta-site-name').innerText = site.name;
            document.getElementById('meta-coords').innerText = site.coords;
            document.getElementById('meta-radius').innerHTML = `<i class="fas fa-check-circle mr-1 text-green-600"></i> Within ${site.radius}m (±3.2m)`;
            document.getElementById('meta-timestamp').innerText = 'Just now (Switched)';

            if (employeeMap && employeeMarker && geofenceCircle) {
                employeeMap.flyTo([site.lat, site.lng], 16, { duration: 1.2 });
                employeeMarker.setLatLng([site.lat, site.lng]);
                geofenceCircle.setLatLng([site.lat, site.lng]);
                geofenceCircle.setRadius(site.radius);
                updatePopupContent(site);

                if (showingTrail) {
                    employeeMap.removeLayer(trailPolyline);
                    trailPolyline = L.polyline(site.trail, {
                        color: '#0284c7',
                        weight: 3,
                        dashArray: '5, 8',
                        opacity: 0.85
                    }).addTo(employeeMap);
                }
            }

            showToast(`Map centered on ${site.name}`, 'info');
        };

        window.pingLiveGPS = () => {
            showToast('Pinging GPS transponder on Ali Khan’s mobile device...', 'info');
            setTimeout(() => {
                const site = SITE_LOCATIONS[currentSiteKey];
                showToast(`GPS Lock Acquired! Lat: ${site.lat}° N, Long: ${site.lng}° E (Inside Geofence • Signal: 100%)`, 'success');
                if (employeeMarker) {
                    employeeMarker.openPopup();
                }
            }, 500);
        };

        window.toggleMovementTrail = () => {
            if (!employeeMap || !trailPolyline) return;
            showingTrail = !showingTrail;
            if (showingTrail) {
                const site = SITE_LOCATIONS[currentSiteKey];
                trailPolyline.setLatLngs(site.trail);
                trailPolyline.addTo(employeeMap);
                showToast('Showing Shift Movement Trail (4 check-points recorded today)', 'info');
            } else {
                employeeMap.removeLayer(trailPolyline);
                showToast('Shift Movement Trail hidden', 'info');
            }
        };

        window.openGeofenceModal = () => {
            const site = SITE_LOCATIONS[currentSiteKey];
            openModal(
                'Worksite Geofence Configuration',
                `
                <div class="space-y-3">
                    <div class="p-3 bg-blue-50/70 border border-blue-200 rounded-lg text-xs">
                        <p class="font-bold text-[#242b5f] flex items-center gap-1.5"><i class="fas fa-satellite"></i> ${site.name}</p>
                        <p class="text-[10px] text-gray-600 mt-1">Center: ${site.coords} • Current Radius: <strong>${site.radius} meters</strong></p>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-700 mb-1">Permitted Work Radius (Meters)</label>
                        <input type="number" id="geofence-radius-input" value="${site.radius}" min="20" max="500" class="w-full text-xs border border-gray-300 rounded-lg p-2 focus:ring-1 focus:ring-[#242b5f] outline-none">
                        <p class="text-[10px] text-gray-400 mt-1">If the employee checks in outside this radius, the system generates an Out-of-Radius Attendance Exception alert.</p>
                    </div>
                    <div class="p-2.5 bg-gray-50 rounded border border-gray-200 text-[10.5px] space-y-1 text-gray-600">
                        <p><strong>Enforcement Hours:</strong> 08:00 AM - 05:00 PM (Monday - Saturday)</p>
                        <p><strong>Biometric Verification:</strong> GPS + Facial match required on mobile app</p>
                    </div>
                </div>
                `,
                () => {
                    const newRadius = parseInt(document.getElementById('geofence-radius-input').value) || 80;
                    site.radius = newRadius;
                    if (geofenceCircle) {
                        geofenceCircle.setRadius(newRadius);
                    }
                    document.getElementById('meta-radius').innerHTML = `<i class="fas fa-check-circle mr-1 text-green-600"></i> Within ${newRadius}m (±3.2m)`;
                    showToast(`Geofence perimeter updated to ${newRadius} meters!`, 'success');
                }
            );
        };

        // Initialize map after layout rendering
        setTimeout(initEmployeeMap, 200);
    </script>
</body>
</html>
