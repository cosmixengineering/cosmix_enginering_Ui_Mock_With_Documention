                date.setMonth(date.getMonth() + months);
                const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
                endElem.innerText = `${monthNames[date.getMonth()]} ${date.getFullYear()}`;
            }

            // Policy Cap Warning
            const capIndicator = document.getElementById('cap-warning-indicator');
            if (capIndicator) {
                const maxCap = baseSalary * 0.5;
                if (monthlyDeductionPkr > maxCap) {
                    capIndicator.classList.remove('hidden');
                    capIndicator.innerHTML = `<i class="fas fa-exclamation-triangle text-amber-600 mr-1.5"></i> <strong>Policy Caution:</strong> Monthly deduction of Rs. ${monthlyDeductionPkr.toLocaleString()} exceeds the 50% salary ceiling (Rs. ${maxCap.toLocaleString()}). Requires CEO waiver approval.`;
                } else {
                    capIndicator.classList.add('hidden');
                }
            }
        };

        // View Repayment Schedule Amortization Modal
        window.viewRepaymentSchedule = (empName, appCode, principal, totalMonths, mode, monthlyAmount, paidCount) => {
            const modal = document.getElementById('schedule-modal');
            const subtitle = document.getElementById('schedule-subtitle');
            const body = document.getElementById('schedule-body');

            subtitle.innerText = `${empName} • ${appCode} • Principal: Rs. ${principal.toLocaleString()} over ${totalMonths} Months`;

            const monthsNames = ['Oct 2026', 'Nov 2026', 'Dec 2026', 'Jan 2027', 'Feb 2027', 'Mar 2027', 'Apr 2027', 'May 2027', 'Jun 2027', 'Jul 2027', 'Aug 2027', 'Sep 2027', 'Oct 2027', 'Nov 2027', 'Dec 2027', 'Jan 2028', 'Feb 2028', 'Mar 2028'];

            let remaining = principal;
            let rowsHtml = '';

            for (let i = 1; i <= totalMonths; i++) {
                const emi = (i === totalMonths) ? remaining : Math.min(monthlyAmount, remaining);
                const isPaid = (i <= paidCount);
                remaining = Math.max(0, remaining - emi);

                const statusBadge = isPaid
                    ? '<span class="bg-green-100 text-green-800 text-[9px] font-bold px-2 py-0.5 rounded border border-green-200"><i class="fas fa-check mr-1"></i> Paid in Payroll</span>'
                    : (i === paidCount + 1)
                        ? '<span class="bg-blue-100 text-blue-800 text-[9px] font-bold px-2 py-0.5 rounded border border-blue-200"><i class="fas fa-clock mr-1"></i> Next Payroll Cut</span>'
                        : '<span class="bg-gray-100 text-gray-600 text-[9px] font-semibold px-2 py-0.5 rounded">Scheduled</span>';

                rowsHtml += `
                    <tr class="${isPaid ? 'bg-green-50/20' : ''}">
                        <td class="px-3 py-2 font-bold text-gray-700">EMI #${i}</td>
                        <td class="px-3 py-2 text-gray-600 font-medium">${monthsNames[i-1] || 'Month ' + i}</td>
                        <td class="px-3 py-2 font-bold text-[#242b5f]">Rs. ${Math.round(emi).toLocaleString()}</td>
                        <td class="px-3 py-2 text-gray-500 font-medium">Rs. ${Math.round(remaining).toLocaleString()}</td>
                        <td class="px-3 py-2 text-right">${statusBadge}</td>
                    </tr>
                `;
            }

            body.innerHTML = `
                <div class="space-y-3">
                    <div class="grid grid-cols-3 gap-2 bg-gray-50 p-2.5 rounded-lg border border-gray-200 text-center text-xs">
                        <div>
                            <p class="text-[9px] text-gray-400 font-bold uppercase">Total Principal</p>
                            <p class="font-bold text-gray-800 text-sm">Rs. ${principal.toLocaleString()}</p>
                        </div>
                        <div>
                            <p class="text-[9px] text-gray-400 font-bold uppercase">Tenure Duration</p>
                            <p class="font-bold text-[#242b5f] text-sm">${totalMonths} Months</p>
                        </div>
                        <div>
                            <p class="text-[9px] text-gray-400 font-bold uppercase">Recovery Mode</p>
                            <p class="font-bold text-purple-700 text-sm">${mode}</p>
                        </div>
                    </div>

                    <div class="overflow-x-auto border border-gray-100 rounded-lg">
                        <table class="w-full text-left text-xs whitespace-nowrap">
                            <thead class="bg-gray-50 text-gray-500 text-[9px] uppercase font-bold border-b border-gray-200">
                                <tr>
                                    <th class="px-3 py-2">Installment</th>
                                    <th class="px-3 py-2">Payroll Period</th>
                                    <th class="px-3 py-2">Deduction</th>
                                    <th class="px-3 py-2">Remaining Bal</th>
                                    <th class="px-3 py-2 text-right">Status</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                                ${rowsHtml}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            modal.classList.remove('hidden');
        };

        // Early Full Settlement Modal Helper
        window.recordEarlySettlement = (empName, amount) => {
            const html = `<p class="text-xs text-gray-700">Record manual cash settlement of remaining <strong>Rs. ${amount.toLocaleString()}</strong> for <strong>${empName}</strong>?</p><p class="text-[10px] text-gray-400 mt-1">This will mark all future scheduled EMIs as settled and remove deductions from payroll.</p>`;
            openModal('Early Settlement Confirmation', html, () => showToast(`Full settlement recorded for ${empName}! Loan closed.`, 'success'));
        };

        // Approval Action Handler
        window.approveLoanRequest = (appCode, empName, statusElemId) => {
            showToast(`Approved ${appCode} for ${empName}! Queued for Finance disbursement.`, 'success');
            const elem = document.getElementById(statusElemId);
            if (elem) {
                elem.innerHTML = `
                    <span class="bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded text-[9.5px] font-bold uppercase border border-emerald-200 shadow-2xs">
                        Approved & Active
                    </span>
                `;
            }
        };

        // Submit New Advance / Loan Form into Table
        window.submitNewAdvanceLoan = () => {
            const isLoan = (document.querySelector('input[name="app_type"]:checked').value === 'LOAN');
            const employeeSelect = document.getElementById('form_employee');
            const selectedOpt = employeeSelect.options[employeeSelect.selectedIndex];
            const empName = selectedOpt.getAttribute('data-name');
            const empCode = selectedOpt.getAttribute('data-code');
            const empRole = selectedOpt.getAttribute('data-role');
            const empSite = selectedOpt.getAttribute('data-site');
            const baseSalary = parseFloat(employeeSelect.value);

            const principal = parseFloat(document.getElementById('form_principal_amount').value) || 25000;
            const months = parseInt(document.getElementById('form_repay_months').value) || 3;
            const isPercent = (document.querySelector('input[name="deduction_mode"]:checked').value === 'PERCENT');
            const deductionVal = parseFloat(document.getElementById('form_deduction_value').value) || 0;

            let monthlyPkr = 0;
            let planDisplay = '';
            let modeBadge = '';

            if (isPercent) {
                monthlyPkr = Math.round((deductionVal / 100) * baseSalary);
                planDisplay = `${deductionVal}% of Salary <span class="text-[9px] text-gray-500 font-normal">(Rs. ${monthlyPkr.toLocaleString()} / mo)</span>`;
                modeBadge = '<span class="inline-block text-[8.5px] bg-purple-50 text-purple-700 px-1 rounded font-semibold border border-purple-100">Percentage (%) Mode</span>';
            } else {
                monthlyPkr = Math.round(deductionVal);
                planDisplay = `Rs. ${monthlyPkr.toLocaleString()} <span class="text-[9px] text-gray-500 font-normal">/ mo</span>`;
                modeBadge = '<span class="inline-block text-[8.5px] bg-emerald-50 text-emerald-700 px-1 rounded font-semibold border border-emerald-100">Flat Amount (PKR)</span>';
            }

            const appType = isLoan ? 'LOAN' : 'ADVANCE';
            const randomNum = Math.floor(100 + Math.random() * 900);
            const appCode = isLoan ? `LON-2026-0${randomNum}` : `ADV-2026-0${randomNum}`;
            const purpose = isLoan ? document.getElementById('form_loan_purpose').value : 'Urgent Household / Medical';
            const typeBadge = isLoan
                ? '<span class="inline-flex items-center gap-1 bg-blue-50 text-blue-700 border border-blue-200 text-[9px] px-1.5 py-0.2 rounded font-bold"><i class="fas fa-landmark text-[8px]"></i> Company Loan</span>'
                : '<span class="inline-flex items-center gap-1 bg-amber-50 text-amber-700 border border-amber-200 text-[9px] px-1.5 py-0.2 rounded font-bold"><i class="fas fa-bolt text-[8px]"></i> Salary Advance</span>';

            const statusId = 'adv-status-' + Date.now();

            const newRow = document.createElement('tr');
            newRow.setAttribute('data-category', appType);
            newRow.setAttribute('data-status', 'PENDING');
            newRow.className = 'hover:bg-blue-50/20 transition group bg-blue-50/10';
            newRow.innerHTML = `
                <td class="px-3.5 py-2.5">
                    <div class="font-bold text-[#242b5f]">${appCode}</div>
                    ${typeBadge}
                </td>
                <td class="px-3.5 py-2.5">
                    <div class="flex items-center gap-2">
                        <div class="w-7 h-7 rounded-full bg-[#242b5f] text-white flex items-center justify-center font-bold text-[10px]">
                            ${empName.substring(0,2).toUpperCase()}
                        </div>
                        <div>
                            <a href="employee-profile.html" class="font-bold text-[#242b5f] hover:underline block leading-tight">${empName}</a>
                            <span class="text-[9px] text-gray-400">${empCode} • ${empRole} (${empSite})</span>
                        </div>
                    </div>
                </td>
                <td class="px-3.5 py-2.5">
                    <div class="font-bold text-gray-800">Rs. ${principal.toLocaleString()}</div>
                    <div class="text-[9px] text-gray-500">${purpose}</div>
                </td>
                <td class="px-3.5 py-2.5 text-center">
                    <span class="bg-gray-100 text-gray-800 px-2 py-0.5 rounded text-[10px] font-bold border border-gray-200">
                        ${months} Months
                    </span>
                </td>
                <td class="px-3.5 py-2.5">
                    <div class="font-bold text-gray-800">${planDisplay}</div>
                    ${modeBadge}
                </td>
                <td class="px-3.5 py-2.5">
                    <div class="w-28 bg-gray-100 h-1.5 rounded-full overflow-hidden mb-1">
                        <div class="bg-blue-500 h-full" style="width: 0%"></div>
                    </div>
                    <div class="text-[9px] text-gray-500">
                        0 of ${months} Paid <span class="text-orange-600 font-semibold">• Awaiting Sign-off</span>
                    </div>
                </td>
                <td class="px-3.5 py-2.5">
                    <div class="text-[9px] text-gray-600">Base: Rs. ${baseSalary.toLocaleString()}</div>
                    <div class="text-[9px] text-blue-600 font-semibold"><i class="fas fa-check-circle mr-0.5"></i> Form Validated</div>
                </td>
                <td class="px-3.5 py-2.5 text-center" id="${statusId}">
                    <span class="bg-orange-50 text-orange-700 px-2.5 py-0.5 rounded text-[9.5px] font-bold uppercase border border-orange-200 shadow-2xs flex items-center justify-center gap-1 mx-auto w-max">
                        <i class="fas fa-clock"></i> CEO Review
                    </span>
                </td>
                <td class="px-3.5 py-2.5 text-right relative dropdown">
                    <button class="dropdown-toggle text-gray-400 hover:text-[#242b5f] p-1 rounded hover:bg-gray-100 transition focus:outline-none" onclick="toggleDropdown(this, event)">
                        <i class="fas fa-ellipsis-v text-xs"></i>
                    </button>
                    <div class="dropdown-menu absolute right-4 top-8 w-52 bg-white rounded-lg shadow-lg border border-gray-100 py-1 z-50 text-left">
                        <button onclick="approveLoanRequest('${appCode}', '${empName}', '${statusId}')" class="w-full text-left px-3 py-1.5 text-xs text-green-700 hover:bg-green-50 font-medium flex items-center gap-2">
                            <i class="fas fa-check w-4 text-green-600"></i> Approve & Disburse
                        </button>
                        <button onclick="viewRepaymentSchedule('${empName}', '${appCode}', ${principal}, ${months}, '${isPercent ? 'Percentage (' + deductionVal + '%)' : 'Flat'}', ${monthlyPkr}, 0)" class="w-full text-left px-3 py-1.5 text-xs text-blue-700 hover:bg-blue-50 font-medium flex items-center gap-2">
                            <i class="fas fa-calendar-alt w-4 text-blue-600"></i> Amortization Schedule
                        </button>
                    </div>
                </td>
            `;

            const tbody = document.getElementById('advance-table-body');
            tbody.insertBefore(newRow, tbody.firstChild);

            closeAdvanceLoanModal();
            showToast(`${isLoan ? 'Company Loan' : 'Salary Advance'} application submitted for CEO review!`, 'success');
        };
    </script>
</body>
</html>
