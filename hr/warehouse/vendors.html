<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Directory | Cosmix ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 h-screen overflow-hidden">
    <div id="app-layout"></div>
    <script src="../../assets/js/shared.js"></script>
    <script>
        renderLayout('vendors');
        setPageContent('Vendor & Supplier Directory', `
            <!-- Stats -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500 mb-1">Total Active Vendors</p>
                        <h3 class="text-2xl font-bold text-gray-900">45</h3>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center text-blue-600 text-lg">
                        <i class="fas fa-handshake"></i>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500 mb-1">Pending Deliveries</p>
                        <h3 class="text-2xl font-bold text-amber-600">8</h3>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-amber-50 flex items-center justify-center text-amber-600 text-lg">
                        <i class="fas fa-truck-loading"></i>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500 mb-1">Blacklisted</p>
                        <h3 class="text-2xl font-bold text-red-600">2</h3>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-red-50 flex items-center justify-center text-red-600 text-lg">
                        <i class="fas fa-ban"></i>
                    </div>
                </div>
            </div>

            <!-- Main Actions & Filters -->
            <div class="bg-white rounded-t-xl border border-gray-200 shadow-sm p-4 flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex-1 w-full relative">
                    <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input type="text" placeholder="Search by Vendor Name, Category, or NTN..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#242b5f] focus:border-transparent text-sm">
                </div>
                <div class="flex gap-3 w-full md:w-auto">
                    <select class="border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#242b5f]">
                        <option>Category: All</option>
                        <option>HVAC Equipment</option>
                        <option>Piping & Plumbing</option>
                        <option>Electrical / Cables</option>
                        <option>General Hardware</option>
                    </select>
                    <button class="bg-[#242b5f] hover:bg-blue-800 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm transition flex items-center gap-2 whitespace-nowrap">
                        <i class="fas fa-plus"></i> Add New Vendor
                    </button>
                </div>
            </div>

            <!-- Active Vendors Table -->
            <div class="bg-white shadow-sm border border-gray-200 rounded-b-xl overflow-hidden flex flex-col h-[calc(100vh-320px)]">
                <div class="overflow-y-auto flex-1 custom-scrollbar">
                    <table class="w-full text-left text-sm text-gray-600">
                        <thead class="bg-gray-50 text-gray-700 border-b border-gray-200 uppercase text-xs font-semibold sticky top-0 z-10 shadow-sm">
                            <tr>
                                <th class="px-6 py-4">Vendor Code / Name</th>
                                <th class="px-6 py-4">Category</th>
                                <th class="px-6 py-4">Contact Person</th>
                                <th class="px-6 py-4 text-center">Active POs</th>
                                <th class="px-6 py-4 text-center">Status</th>
                                <th class="px-6 py-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100">
                            <!-- Vendor 1 -->
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="px-6 py-4">
                                    <div class="flex items-center gap-3">
                                        <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 font-bold text-xs">DA</div>
                                        <div>
                                            <p class="font-bold text-gray-900">Daikin MEA</p>
                                            <p class="font-mono text-xs text-gray-500">VND-1001 • NTN: 893412-1</p>
                                        </div>
                                    </div>
                                </td>
                                <td class="px-6 py-4 font-semibold text-gray-700">HVAC Equipment (VRF, Chillers)</td>
                                <td class="px-6 py-4">
                                    <p class="font-bold text-gray-800">Tariq Jameel</p>
                                    <p class="text-xs text-indigo-600 hover:underline cursor-pointer"><i class="fas fa-phone-alt text-[10px]"></i> 0300-1234567</p>
                                </td>
                                <td class="px-6 py-4 text-center font-bold text-[#242b5f]">3</td>
                                <td class="px-6 py-4 text-center">
                                    <span class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">Approved</span>
                                </td>
                                <td class="px-6 py-4 text-right whitespace-nowrap">
                                    <button onclick="openModal('vendorHistoryModal')" class="text-xs bg-indigo-50 text-indigo-700 border border-indigo-200 px-3 py-1 rounded hover:bg-indigo-100 font-bold mr-2"><i class="fas fa-history mr-1"></i> Supply History</button>
                                    <button class="text-gray-400 hover:text-[#242b5f]" title="Edit"><i class="fa-solid fa-pen-to-square"></i></button>
                                </td>
                            </tr>
                            
                            <!-- Vendor 2 -->
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="px-6 py-4">
                                    <div class="flex items-center gap-3">
                                        <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-700 font-bold text-xs">PP</div>
                                        <div>
                                            <p class="font-bold text-gray-900">Popular Pipes</p>
                                            <p class="font-mono text-xs text-gray-500">VND-1045 • NTN: 112233-4</p>
                                        </div>
                                    </div>
                                </td>
                                <td class="px-6 py-4 font-semibold text-gray-700">Piping & Plumbing (PVC, PPRC)</td>
                                <td class="px-6 py-4">
                                    <p class="font-bold text-gray-800">Rizwan Ali</p>
                                    <p class="text-xs text-indigo-600 hover:underline cursor-pointer"><i class="fas fa-phone-alt text-[10px]"></i> 0321-9876543</p>
                                </td>
                                <td class="px-6 py-4 text-center font-bold text-[#242b5f]">1</td>
                                <td class="px-6 py-4 text-center">
                                    <span class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">Approved</span>
                                </td>
                                <td class="px-6 py-4 text-right whitespace-nowrap">
                                    <button onclick="openModal('vendorHistoryModal')" class="text-xs bg-indigo-50 text-indigo-700 border border-indigo-200 px-3 py-1 rounded hover:bg-indigo-100 font-bold mr-2"><i class="fas fa-history mr-1"></i> Supply History</button>
                                    <button class="text-gray-400 hover:text-[#242b5f]" title="Edit"><i class="fa-solid fa-pen-to-square"></i></button>
                                </td>
                            </tr>

                            <!-- Vendor 3 -->
                            <tr class="hover:bg-gray-50 transition-colors bg-red-50/20">
                                <td class="px-6 py-4">
                                    <div class="flex items-center gap-3">
                                        <div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-gray-600 font-bold text-xs">LH</div>
                                        <div>
                                            <p class="font-bold text-gray-900">Local Hardware Supplier</p>
                                            <p class="font-mono text-xs text-gray-500">VND-2011 • NTN: N/A</p>
                                        </div>
                                    </div>
                                </td>
                                <td class="px-6 py-4 font-semibold text-gray-700">General Consumables</td>
                                <td class="px-6 py-4">
                                    <p class="font-bold text-gray-800">Shop Manager</p>
                                    <p class="text-xs text-indigo-600 hover:underline cursor-pointer"><i class="fas fa-phone-alt text-[10px]"></i> 021-3456789</p>
                                </td>
                                <td class="px-6 py-4 text-center font-bold text-gray-400">-</td>
                                <td class="px-6 py-4 text-center">
                                    <span class="bg-red-100 text-red-700 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">Blacklisted</span>
                                </td>
                                <td class="px-6 py-4 text-right whitespace-nowrap">
                                    <button onclick="openModal('vendorHistoryModal')" class="text-xs bg-indigo-50 text-indigo-700 border border-indigo-200 px-3 py-1 rounded hover:bg-indigo-100 font-bold mr-2"><i class="fas fa-history mr-1"></i> Supply History</button>
                                    <button class="text-gray-400 hover:text-[#242b5f]" title="Edit"><i class="fa-solid fa-pen-to-square"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="px-6 py-4 border-t border-gray-200 bg-gray-50 flex justify-between items-center text-sm shrink-0">
                    <span class="text-gray-500">Showing 1 to 3 of 45 vendors</span>
                    <div class="flex gap-2">
                        <button class="px-3 py-1 border border-gray-300 rounded bg-white text-gray-400 cursor-not-allowed shadow-sm font-semibold">Previous</button>
                        <button class="px-3 py-1 border border-gray-300 rounded bg-white hover:bg-gray-50 text-gray-700 shadow-sm font-semibold transition">Next</button>
                    </div>
                </div>
            </div>

            <!-- Vendor Supply History Modal -->
            <div id="vendorHistoryModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden z-50 flex items-center justify-center transition-opacity p-4">
                <div class="bg-white w-full max-w-4xl rounded-xl shadow-xl flex flex-col overflow-hidden max-h-[85vh]">
                    <div class="p-4 border-b border-gray-200 flex justify-between items-center bg-[#242b5f] text-white">
                        <h3 class="font-bold"><i class="fas fa-history mr-2"></i> Supply History Ledger: Daikin MEA</h3>
                        <button onclick="closeModal('vendorHistoryModal')" class="text-gray-300 hover:text-white transition-colors"><i class="fas fa-times"></i></button>
                    </div>
                    <div class="p-5 flex-1 overflow-y-auto custom-scrollbar bg-gray-50">
                        
                        <div class="grid grid-cols-3 gap-4 mb-5">
                            <div class="bg-white border border-gray-200 p-3 rounded-lg shadow-sm">
                                <p class="text-xs text-gray-500 font-bold uppercase mb-1">Total Supplies (YTD)</p>
                                <p class="text-xl font-bold text-indigo-700">Rs. 4.5M</p>
                            </div>
                            <div class="bg-white border border-gray-200 p-3 rounded-lg shadow-sm">
                                <p class="text-xs text-gray-500 font-bold uppercase mb-1">Items Supplied</p>
                                <p class="text-xl font-bold text-emerald-600">12 Unique Items</p>
                            </div>
                            <div class="bg-white border border-gray-200 p-3 rounded-lg shadow-sm">
                                <p class="text-xs text-gray-500 font-bold uppercase mb-1">Quality Defect Rate</p>
                                <p class="text-xl font-bold text-gray-900">0.5% <span class="text-xs text-emerald-500 font-normal">(Excellent)</span></p>
                            </div>
                        </div>

                        <h4 class="font-bold text-gray-800 uppercase tracking-wide text-xs mb-3 border-b border-gray-200 pb-2">Recent Item Deliveries (GRN)</h4>
                        
                        <div class="bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm">
                            <table class="w-full text-left text-sm text-gray-600">
                                <thead class="bg-gray-100 text-gray-700 uppercase text-[10px] font-bold">
                                    <tr>
                                        <th class="px-4 py-2">Date</th>
                                        <th class="px-4 py-2">GRN / PO Ref</th>
                                        <th class="px-4 py-2">Item Description</th>
                                        <th class="px-4 py-2 text-center">Qty Received</th>
                                        <th class="px-4 py-2 text-right">Value (Rs.)</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100">
                                    <tr>
                                        <td class="px-4 py-3 font-semibold text-gray-800">05-Sep-2026</td>
                                        <td class="px-4 py-3 font-mono text-xs text-indigo-600">GRN-1040 / PO-085</td>
                                        <td class="px-4 py-3 font-bold text-gray-900">VRF Outdoor Units (20 HP)</td>
                                        <td class="px-4 py-3 text-center font-bold text-emerald-600">5 Units</td>
                                        <td class="px-4 py-3 text-right text-gray-800 font-mono">1,500,000</td>
                                    </tr>
                                    <tr>
                                        <td class="px-4 py-3 font-semibold text-gray-800">20-Aug-2026</td>
                                        <td class="px-4 py-3 font-mono text-xs text-indigo-600">GRN-1012 / PO-072</td>
                                        <td class="px-4 py-3 font-bold text-gray-900">Digital Thermostats</td>
                                        <td class="px-4 py-3 text-center font-bold text-emerald-600">50 Pcs</td>
                                        <td class="px-4 py-3 text-right text-gray-800 font-mono">250,000</td>
                                    </tr>
                                    <tr>
                                        <td class="px-4 py-3 font-semibold text-gray-800">10-Aug-2026</td>
                                        <td class="px-4 py-3 font-mono text-xs text-indigo-600">GRN-0995 / PO-068</td>
                                        <td class="px-4 py-3 font-bold text-gray-900">Refrigerant Gas R-410A</td>
                                        <td class="px-4 py-3 text-center font-bold text-emerald-600">20 Cyls</td>
                                        <td class="px-4 py-3 text-right text-gray-800 font-mono">120,000</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="p-4 border-t border-gray-200 bg-white flex justify-end gap-3 shrink-0">
                        <button onclick="closeModal('vendorHistoryModal')" class="px-4 py-2 bg-gray-100 rounded-md text-gray-700 font-bold hover:bg-gray-200 transition text-sm">Close</button>
                        <button class="px-4 py-2 border border-indigo-200 text-indigo-700 rounded-md font-bold hover:bg-indigo-50 transition text-sm flex items-center gap-2"><i class="fas fa-print"></i> Print Report</button>
                    </div>
                </div>
            </div>
        `);
        
        window.openModal = function(id) {
            const modal = document.getElementById(id);
            if(modal) { modal.classList.remove('hidden'); }
        };
        window.closeModal = function(id) {
            const modal = document.getElementById(id);
            if(modal) { modal.classList.add('hidden'); }
        };
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</body>
</html>
