<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outward (Dispatch) | Cosmix ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>html { font-size: 13px !important; } body { font-family: 'Inter', sans-serif; } table th { padding: 0.4rem 0.75rem !important; font-size: 0.72rem !important; } table td { padding: 0.45rem 0.75rem !important; font-size: 0.78rem !important; }</style>
</head>
<body class="text-gray-800">
    <div id="app-layout" class="flex min-h-screen"></div>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <script src="../../assets/js/shared.js"></script>
    <script>
        renderLayout('outward');
        setPageContent('Outward (Dispatch)', `
<div class="flex items-center justify-between mb-6">
                    <h3 class="text-lg font-bold text-gray-800">Approved Site Demands (Pending Dispatch)</h3>
                </div>
                
                <div class="space-y-6">
                    <!-- Demand 1 -->
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col md:flex-row">
                        <div class="bg-indigo-50 border-r border-gray-200 p-6 md:w-1/4 flex flex-col justify-center">
                            <div class="flex items-center gap-2 mb-2">
                                <a href="request-detail.html" class="text-indigo-600 text-xs font-bold uppercase tracking-wider hover:underline flex items-center gap-1">REQ-8890</a>
                            </div>
                            <h4 class="font-bold text-gray-900 text-lg mb-2">DHA Phase 8 Site</h4>
                            <p class="text-sm text-gray-600"><i class="fa-regular fa-user mr-1"></i> Supervisor: Ali Raza</p>
                            <p class="text-sm text-gray-600 mt-1"><i class="fa-regular fa-calendar mr-1"></i> Date: 10-Sep-2026</p>
                            <a href="request-detail.html" class="mt-4 inline-block text-center bg-white border border-indigo-200 text-indigo-700 font-bold text-xs px-3 py-1.5 rounded hover:bg-indigo-50 transition shadow-sm w-full">View Full Request Details <i class="fas fa-arrow-right ml-1"></i></a>
                            <span class="inline-block mt-4 bg-emerald-100 text-emerald-700 text-xs font-bold px-2 py-1 rounded text-center">Approved by HO</span>
                        </div>
                        <div class="p-6 md:w-2/4">
                            <h5 class="text-sm font-bold text-gray-700 mb-3 uppercase tracking-wide border-b pb-2">Requested Items</h5>
                            <ul class="space-y-3">
                                <li class="flex justify-between items-center text-sm">
                                    <div class="flex items-center gap-2">
                                        <i class="fa-solid fa-box text-gray-400"></i>
                                        <span class="font-medium text-gray-800">OPC Cement (Lucky)</span>
                                    </div>
                                    <span class="font-bold">200 Bags</span>
                                </li>
                                <li class="flex justify-between items-center text-sm">
                                    <div class="flex items-center gap-2">
                                        <i class="fa-solid fa-box text-gray-400"></i>
                                        <span class="font-medium text-gray-800">Safety Helmets</span>
                                    </div>
                                    <span class="font-bold">15 Pcs</span>
                                </li>
                            </ul>
                        </div>
                        <div class="bg-gray-50 border-l border-gray-200 p-6 md:w-1/4 flex flex-col justify-center items-center gap-3">
                            <div class="w-full text-center">
                                <p class="text-xs text-gray-500 mb-1">Assign Delivery / Handover</p>
                                <select class="w-full border border-gray-300 text-gray-700 py-2 px-3 rounded text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-2">
                                    <option>Select Supply Guy...</option>
                                    <option>Imran Khan (Rider)</option>
                                    <option>Kamran Ahmed (Driver)</option>
                                </select>
                                <button onclick="openModal('dispatchModal')" class="w-full bg-indigo-600 text-white font-semibold py-2 rounded-md hover:bg-indigo-700 transition-colors shadow-sm text-xs mb-2">
                                    Hand Over Delivery
                                </button>
                                <button class="w-full bg-white border border-red-200 text-red-600 font-semibold py-2 rounded-md hover:bg-red-50 transition-colors shadow-sm text-xs">
                                    Send to Administrator (Purchase)
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Demand 2 -->
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col md:flex-row">
                        <div class="bg-indigo-50 border-r border-gray-200 p-6 md:w-1/4 flex flex-col justify-center">
                            <div class="flex items-center gap-2 mb-2">
                                <a href="request-detail.html" class="text-indigo-600 text-xs font-bold uppercase tracking-wider hover:underline flex items-center gap-1">REQ-8895</a>
                            </div>
                            <h4 class="font-bold text-gray-900 text-lg mb-2">Clifton Block 2 Site</h4>
                            <p class="text-sm text-gray-600"><i class="fa-regular fa-user mr-1"></i> Supervisor: Usama Tariq</p>
                            <p class="text-sm text-gray-600 mt-1"><i class="fa-regular fa-calendar mr-1"></i> Date: 10-Sep-2026</p>
                            <a href="request-detail.html" class="mt-4 inline-block text-center bg-white border border-indigo-200 text-indigo-700 font-bold text-xs px-3 py-1.5 rounded hover:bg-indigo-50 transition shadow-sm w-full">View Full Request Details <i class="fas fa-arrow-right ml-1"></i></a>
                            <span class="inline-block mt-4 bg-emerald-100 text-emerald-700 text-xs font-bold px-2 py-1 rounded text-center">Approved by HO</span>
                        </div>
                        <div class="p-6 md:w-2/4">
                            <h5 class="text-sm font-bold text-gray-700 mb-3 uppercase tracking-wide border-b pb-2">Requested Items</h5>
                            <ul class="space-y-3">
                                <li class="flex justify-between items-center text-sm">
                                    <div class="flex items-center gap-2">
                                        <i class="fa-solid fa-box text-gray-400"></i>
                                        <span class="font-medium text-gray-800">PVC Pipe 4" (Popular)</span>
                                    </div>
                                    <span class="font-bold">50 Lengths</span>
                                </li>
                            </ul>
                        </div>
                        <div class="bg-gray-50 border-l border-gray-200 p-6 md:w-1/4 flex flex-col justify-center items-center gap-3">
                            <div class="w-full text-center">
                                <p class="text-xs text-gray-500 mb-1">Assign Delivery / Handover</p>
                                <select class="w-full border border-gray-300 text-gray-700 py-2 px-3 rounded text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-2">
                                    <option>Select Supply Guy...</option>
                                    <option>Imran Khan (Rider)</option>
                                    <option>Kamran Ahmed (Driver)</option>
                                </select>
                                <button onclick="openModal('dispatchModal')" class="w-full bg-indigo-600 text-white font-semibold py-2 rounded-md hover:bg-indigo-700 transition-colors shadow-sm text-xs mb-2">
                                    Hand Over Delivery
                                </button>
                                <button class="w-full bg-white border border-red-200 text-red-600 font-semibold py-2 rounded-md hover:bg-red-50 transition-colors shadow-sm text-xs">
                                    Send to Administrator (Purchase)
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Dispatch Modal -->
                <div id="dispatchModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden z-50 flex items-center justify-center transition-opacity">
                    <div class="bg-white w-full max-w-3xl rounded-xl shadow-xl flex flex-col max-h-[90vh]">
                        <div class="p-5 border-b border-gray-200 flex justify-between items-center bg-gray-50 rounded-t-xl">
                            <h3 class="font-bold text-gray-800 text-lg"><i class="fas fa-truck-fast mr-2 text-indigo-600"></i> Generate Material Issue Slip (MIS)</h3>
                            <button onclick="closeModal('dispatchModal')" class="text-gray-400 hover:text-red-500 transition-colors"><i class="fas fa-times text-lg"></i></button>
                        </div>
                        <div class="p-6 overflow-y-auto space-y-4">
                            <div class="bg-indigo-50 border border-indigo-100 rounded-lg p-4 flex justify-between items-center mb-2">
                                <div>
                                    <p class="text-xs text-indigo-600 font-bold uppercase mb-1">Requesting Site</p>
                                    <p class="font-bold text-gray-800">Site A (DHA Phase 8)</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-xs text-indigo-600 font-bold uppercase mb-1">Approved By</p>
                                    <p class="text-gray-800 font-bold">Engr. Salman</p>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1 uppercase">Dispatch Date</label>
                                    <input type="date" class="w-full px-3 py-2 border border-gray-300 rounded-md text-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1 uppercase">Vehicle / Driver Details</label>
                                    <input type="text" placeholder="e.g. Company Truck T-01" class="w-full px-3 py-2 border border-gray-300 rounded-md text-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                </div>
                            </div>
                            
                            <h4 class="font-bold text-gray-800 mt-4 mb-2 text-sm border-b pb-2">Issuing Items</h4>
                            <table class="w-full text-sm text-left text-gray-600 border border-gray-200">
                                <thead class="bg-gray-50 text-xs uppercase font-semibold text-gray-700">
                                    <tr>
                                        <th class="px-3 py-2">Item</th>
                                        <th class="px-3 py-2 text-center">Requested</th>
                                        <th class="px-3 py-2 text-center">Current Stock</th>
                                        <th class="px-3 py-2">Issue Qty</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr class="border-t border-gray-200">
                                        <td class="px-3 py-2 font-semibold text-gray-800">Cement Bags (OPC)</td>
                                        <td class="px-3 py-2 text-center bg-gray-50">200 Bags</td>
                                        <td class="px-3 py-2 text-center text-emerald-600 font-bold">1,250 Bags</td>
                                        <td class="px-3 py-2"><input type="number" value="200" max="1250" class="w-20 px-2 py-1 border border-gray-300 rounded text-center focus:outline-none focus:ring-1 focus:ring-blue-500"></td>
                                    </tr>
                                </tbody>
                            </table>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mt-4 mb-1 uppercase">Gate Pass Remarks</label>
                                <textarea rows="2" placeholder="Add any special instructions for the gate..." class="w-full px-3 py-2 border border-gray-300 rounded-md text-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                            </div>
                        </div>
                        <div class="p-5 border-t border-gray-200 bg-gray-50 flex justify-end gap-3 rounded-b-xl">
                            <button onclick="closeModal('dispatchModal')" class="px-4 py-2 border border-gray-300 rounded-md text-gray-600 hover:bg-gray-100 font-semibold text-sm transition">Cancel</button>
                            <button onclick="closeModal('dispatchModal')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-md font-semibold text-sm transition shadow-sm">Hand Over & Print MIS</button>
                        </div>
                    </div>
                </div>

        `);
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    </script>
</body>
</html>
