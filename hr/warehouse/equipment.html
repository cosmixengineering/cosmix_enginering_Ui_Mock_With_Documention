<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools & Equipment Allocation | Cosmix ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 h-screen overflow-hidden">
    <div id="app-layout"></div>
    <script src="../../assets/js/shared.js"></script>
    <script>
        renderLayout('equipment');
        setPageContent('Tools & Equipment Allocation', `
            <!-- Stats -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500 mb-1">Total Assets</p>
                        <h3 class="text-2xl font-bold text-gray-900">340</h3>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center text-blue-600 text-lg">
                        <i class="fas fa-toolbox"></i>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500 mb-1">Currently Assigned</p>
                        <h3 class="text-2xl font-bold text-emerald-600">215</h3>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-emerald-50 flex items-center justify-center text-emerald-600 text-lg">
                        <i class="fas fa-user-check"></i>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500 mb-1">Under Maintenance</p>
                        <h3 class="text-2xl font-bold text-amber-600">12</h3>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-amber-50 flex items-center justify-center text-amber-600 text-lg">
                        <i class="fas fa-tools"></i>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500 mb-1">Overdue Returns</p>
                        <h3 class="text-2xl font-bold text-red-600">5</h3>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-red-50 flex items-center justify-center text-red-600 text-lg">
                        <i class="fas fa-clock"></i>
                    </div>
                </div>
            </div>

            <!-- Main Actions & Filters -->
            <div class="bg-white rounded-t-xl border border-gray-200 shadow-sm p-4 flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex-1 w-full relative">
                    <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input type="text" placeholder="Search by Asset ID, Tool Name, or Assignee..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#242b5f] focus:border-transparent text-sm">
                </div>
                <div class="flex gap-3 w-full md:w-auto">
                    <select class="border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#242b5f]">
                        <option>Status: All</option>
                        <option>Assigned</option>
                        <option>Available</option>
                        <option>Maintenance</option>
                    </select>
                    <button onclick="openModal('assignToolModal')" class="bg-[#242b5f] hover:bg-blue-800 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm transition flex items-center gap-2 whitespace-nowrap">
                        <i class="fas fa-plus"></i> Assign Tool
                    </button>
                </div>
            </div>

            <!-- Active Assignments Table -->
            <div class="bg-white shadow-sm border border-gray-200 rounded-b-xl overflow-hidden">
                <table class="w-full text-left text-sm text-gray-600">
                    <thead class="bg-gray-50 text-gray-700 border-b border-gray-200 uppercase text-xs font-semibold">
                        <tr>
                            <th class="px-6 py-4">Asset Tag</th>
                            <th class="px-6 py-4">Tool / Equipment</th>
                            <th class="px-6 py-4">Assigned To</th>
                            <th class="px-6 py-4">Site Location</th>
                            <th class="px-6 py-4">Issue Date</th>
                            <th class="px-6 py-4 text-center">Status</th>
                            <th class="px-6 py-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100">
                        <!-- Record 1 -->
                        <tr class="hover:bg-gray-50 transition-colors">
                            <td class="px-6 py-4 font-mono text-xs font-semibold text-gray-500">AST-WLD-092</td>
                            <td class="px-6 py-4">
                                <p class="font-bold text-gray-900">Inverter Welding Machine (MMA-200)</p>
                                <p class="text-xs text-gray-500">Brand: Ingco</p>
                            </td>
                            <td class="px-6 py-4 font-bold text-indigo-700">Usman Tariq (Welder)</td>
                            <td class="px-6 py-4">DHA Phase 8</td>
                            <td class="px-6 py-4 text-xs">05-Sep-2026</td>
                            <td class="px-6 py-4 text-center">
                                <span class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-xs font-bold">In Use</span>
                            </td>
                            <td class="px-6 py-4 text-right whitespace-nowrap">
                                <button onclick="openModal('returnToolModal')" class="text-xs bg-indigo-50 text-indigo-700 border border-indigo-200 px-3 py-1 rounded hover:bg-indigo-100 font-bold mr-2"><i class="fas fa-undo mr-1"></i> Return</button>
                                <button class="text-gray-400 hover:text-gray-600" title="More Actions"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                            </td>
                        </tr>
                        <!-- Record 2 -->
                        <tr class="hover:bg-gray-50 transition-colors">
                            <td class="px-6 py-4 font-mono text-xs font-semibold text-gray-500">AST-DRL-105</td>
                            <td class="px-6 py-4">
                                <p class="font-bold text-gray-900">Rotary Hammer Drill 800W</p>
                                <p class="text-xs text-gray-500">Brand: Bosch</p>
                            </td>
                            <td class="px-6 py-4 font-bold text-indigo-700">Ali Raza (Supervisor)</td>
                            <td class="px-6 py-4">Clifton Block 2</td>
                            <td class="px-6 py-4 text-xs">01-Sep-2026</td>
                            <td class="px-6 py-4 text-center">
                                <span class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-xs font-bold">In Use</span>
                            </td>
                            <td class="px-6 py-4 text-right whitespace-nowrap">
                                <button onclick="openModal('returnToolModal')" class="text-xs bg-indigo-50 text-indigo-700 border border-indigo-200 px-3 py-1 rounded hover:bg-indigo-100 font-bold mr-2"><i class="fas fa-undo mr-1"></i> Return</button>
                                <button class="text-gray-400 hover:text-gray-600" title="More Actions"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                            </td>
                        </tr>
                        <!-- Record 3 -->
                        <tr class="hover:bg-gray-50 transition-colors bg-red-50/30">
                            <td class="px-6 py-4 font-mono text-xs font-semibold text-gray-500">AST-GEN-012</td>
                            <td class="px-6 py-4">
                                <p class="font-bold text-gray-900">Portable Generator 5kVA</p>
                                <p class="text-xs text-gray-500">Brand: Honda</p>
                            </td>
                            <td class="px-6 py-4 font-bold text-indigo-700">Naveed (Site Engineer)</td>
                            <td class="px-6 py-4">Bahria Town HQ</td>
                            <td class="px-6 py-4 text-xs font-bold text-red-600">20-Aug-2026 (Overdue)</td>
                            <td class="px-6 py-4 text-center">
                                <span class="bg-red-100 text-red-700 px-3 py-1 rounded-full text-xs font-bold">Overdue</span>
                            </td>
                            <td class="px-6 py-4 text-right whitespace-nowrap">
                                <button onclick="alert('Sending warning notification to Naveed...')" class="text-xs bg-red-50 text-red-700 border border-red-200 px-3 py-1 rounded hover:bg-red-100 font-bold mr-2"><i class="fas fa-bell mr-1"></i> Remind</button>
                                <button class="text-gray-400 hover:text-gray-600" title="More Actions"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div class="px-6 py-4 border-t border-gray-200 bg-gray-50 flex justify-between items-center text-sm">
                    <span class="text-gray-500">Showing 1 to 3 of 215 assignments</span>
                    <div class="flex gap-2">
                        <button class="px-3 py-1 border border-gray-300 rounded bg-white text-gray-400 cursor-not-allowed">Previous</button>
                        <button class="px-3 py-1 border border-gray-300 rounded bg-white hover:bg-gray-50 text-gray-700">Next</button>
                    </div>
                </div>
            </div>

            <!-- Assign Tool Modal -->
            <div id="assignToolModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden z-50 flex items-center justify-center transition-opacity">
                <div class="bg-white w-full max-w-lg rounded-xl shadow-xl flex flex-col overflow-hidden">
                    <div class="p-5 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                        <h3 class="font-bold text-gray-800"><i class="fas fa-plus-circle mr-2 text-emerald-600"></i> New Tool / Equipment Assignment</h3>
                        <button onclick="closeModal('assignToolModal')" class="text-gray-400 hover:text-red-500 transition-colors"><i class="fas fa-times"></i></button>
                    </div>
                    <div class="p-6 space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1 uppercase">Scan or Select Asset</label>
                            <div class="relative">
                                <i class="fas fa-barcode absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                                <select class="w-full pl-9 px-3 py-2 border border-gray-300 rounded-md text-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-[#242b5f]">
                                    <option>Select equipment...</option>
                                    <option>AST-WLD-093 - Inverter Welding Machine</option>
                                    <option>AST-SAF-201 - Full Body Harness (Large)</option>
                                    <option>AST-DRL-108 - Heavy Duty Grinder</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1 uppercase">Assign To (Worker/Emp)</label>
                                <select class="w-full px-3 py-2 border border-gray-300 rounded-md text-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-[#242b5f]">
                                    <option>Select Employee...</option>
                                    <option>Ali Raza</option>
                                    <option>Usman Tariq</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1 uppercase">Site Location</label>
                                <select class="w-full px-3 py-2 border border-gray-300 rounded-md text-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-[#242b5f]">
                                    <option>DHA Phase 8</option>
                                    <option>Clifton Block 2</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1 uppercase">Issue Date</label>
                                <input type="date" class="w-full px-3 py-2 border border-gray-300 rounded-md text-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-[#242b5f]">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1 uppercase">Expected Return</label>
                                <input type="date" class="w-full px-3 py-2 border border-gray-300 rounded-md text-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-[#242b5f]">
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1 uppercase">Remarks / Condition Checklist</label>
                            <textarea rows="2" placeholder="Note any existing damage or special instructions..." class="w-full px-3 py-2 border border-gray-300 rounded-md text-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-[#242b5f]"></textarea>
                        </div>
                    </div>
                    <div class="p-5 border-t border-gray-200 bg-gray-50 flex justify-end gap-3">
                        <button onclick="closeModal('assignToolModal')" class="px-4 py-2 border border-gray-300 rounded-md text-gray-600 hover:bg-gray-100 font-semibold text-sm transition">Cancel</button>
                        <button onclick="closeModal('assignToolModal')" class="px-4 py-2 bg-[#242b5f] hover:bg-blue-800 text-white rounded-md font-semibold text-sm transition shadow-sm"><i class="fas fa-check mr-1"></i> Assign & Print Slip</button>
                    </div>
                </div>
            </div>
            
            <!-- Return Tool Modal -->
            <div id="returnToolModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden z-50 flex items-center justify-center transition-opacity">
                <div class="bg-white w-full max-w-sm rounded-xl shadow-xl flex flex-col overflow-hidden">
                    <div class="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                        <h3 class="font-bold text-gray-800"><i class="fas fa-undo mr-2 text-indigo-600"></i> Return Equipment</h3>
                        <button onclick="closeModal('returnToolModal')" class="text-gray-400 hover:text-red-500 transition-colors"><i class="fas fa-times"></i></button>
                    </div>
                    <div class="p-5 space-y-4">
                        <div class="bg-indigo-50 border border-indigo-100 p-3 rounded text-sm text-indigo-900">
                            <strong>AST-WLD-092</strong> - Inverter Welding Machine
                            <div class="text-xs mt-1 text-indigo-700">Assigned to: Usman Tariq</div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1 uppercase">Return Condition</label>
                            <select class="w-full px-3 py-2 border border-gray-300 rounded-md text-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-[#242b5f]">
                                <option>Good / Working</option>
                                <option>Needs Maintenance (Minor)</option>
                                <option>Damaged / Broken</option>
                                <option>Lost / Stolen</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1 uppercase">Return Notes</label>
                            <textarea rows="2" placeholder="Any details about the return condition..." class="w-full px-3 py-2 border border-gray-300 rounded-md text-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-[#242b5f]"></textarea>
                        </div>
                    </div>
                    <div class="p-4 border-t border-gray-200 bg-gray-50 flex justify-end gap-3">
                        <button onclick="closeModal('returnToolModal')" class="px-4 py-2 border border-gray-300 rounded-md text-gray-600 hover:bg-gray-100 font-semibold text-sm transition">Cancel</button>
                        <button onclick="closeModal('returnToolModal')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-md font-semibold text-sm transition shadow-sm">Confirm Return</button>
                    </div>
                </div>
            </div>
        `);

        window.openModal = function(id) {
            const modal = document.getElementById(id);
            if(modal) { modal.classList.remove('hidden'); }
        };
        window.closeModal = function(id) {
            const modal = document.getElementById(id);
            if(modal) { modal.classList.add('hidden'); }
        };
    </script>
</body>
</html>
