<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock History & Ledger | Cosmix ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 h-screen overflow-hidden">
    <div id="app-layout"></div>
    <script src="../../assets/js/shared.js"></script>
    <script>
        renderLayout('history');
        setPageContent('Stock History & Ledger', `
            <!-- Filters and Actions -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6 flex flex-col md:flex-row gap-4 justify-between items-end">
                <div class="flex-1 grid grid-cols-1 md:grid-cols-4 gap-4 w-full">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Search Item / Code</label>
                        <div class="relative">
                            <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                            <input type="text" placeholder="e.g. Copper Coil" class="w-full pl-9 pr-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-[#242b5f]">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Transaction Type</label>
                        <select class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-[#242b5f]">
                            <option>All Transactions</option>
                            <option>Inward (GRN)</option>
                            <option>Outward (Dispatch)</option>
                            <option>Site Return</option>
                            <option>Manual Adjustment</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">From Date</label>
                        <input type="date" value="2026-09-01" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-[#242b5f]">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">To Date</label>
                        <input type="date" value="2026-09-11" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-[#242b5f]">
                    </div>
                </div>
                <div class="flex gap-2">
                    <button class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-md text-sm font-bold shadow-sm hover:bg-gray-50 transition flex items-center gap-2">
                        <i class="fas fa-file-excel text-green-600"></i> Export
                    </button>
                    <button class="bg-[#242b5f] hover:bg-blue-800 text-white px-6 py-2 rounded-md text-sm font-bold shadow-sm transition">
                        Apply Filter
                    </button>
                </div>
            </div>

            <!-- History Ledger Table -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col h-[calc(100vh-270px)]">
                <div class="overflow-y-auto flex-1 custom-scrollbar">
                    <table class="w-full text-left text-sm text-gray-600">
                        <thead class="bg-gray-50 text-gray-700 border-b border-gray-200 uppercase text-xs font-semibold sticky top-0 shadow-sm z-10">
                            <tr>
                                <th class="px-5 py-4">Date & Time</th>
                                <th class="px-5 py-4">Transaction ID</th>
                                <th class="px-5 py-4">Item Details</th>
                                <th class="px-5 py-4">Type</th>
                                <th class="px-5 py-4">Reference / Site</th>
                                <th class="px-5 py-4 text-center">Qty Change</th>
                                <th class="px-5 py-4 text-center">Closing Balance</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100">
                            <!-- Outward Transaction -->
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="px-5 py-3 whitespace-nowrap">
                                    <div class="font-bold text-gray-800">11-Sep-2026</div>
                                    <div class="text-xs text-gray-500">14:30 PM</div>
                                </td>
                                <td class="px-5 py-3 font-mono text-xs text-indigo-600 font-bold">MIS-8890</td>
                                <td class="px-5 py-3">
                                    <div class="font-bold text-gray-900">VRF Outdoor Units (20 HP)</div>
                                    <div class="text-xs text-gray-500">ITM-HVAC-001</div>
                                </td>
                                <td class="px-5 py-3">
                                    <span class="bg-red-50 text-red-600 border border-red-200 text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider"><i class="fas fa-arrow-up mr-1"></i> Outward</span>
                                </td>
                                <td class="px-5 py-3 font-semibold text-gray-700">DHA Phase 8 Site</td>
                                <td class="px-5 py-3 text-center font-bold text-red-600">- 2</td>
                                <td class="px-5 py-3 text-center font-bold text-gray-900">10</td>
                            </tr>

                            <!-- Inward Transaction -->
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="px-5 py-3 whitespace-nowrap">
                                    <div class="font-bold text-gray-800">10-Sep-2026</div>
                                    <div class="text-xs text-gray-500">09:15 AM</div>
                                </td>
                                <td class="px-5 py-3 font-mono text-xs text-indigo-600 font-bold">GRN-1052</td>
                                <td class="px-5 py-3">
                                    <div class="font-bold text-gray-900">Copper Coil Tube 5/8"</div>
                                    <div class="text-xs text-gray-500">ITM-HVAC-002</div>
                                </td>
                                <td class="px-5 py-3">
                                    <span class="bg-emerald-50 text-emerald-600 border border-emerald-200 text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider"><i class="fas fa-arrow-down mr-1"></i> Inward</span>
                                </td>
                                <td class="px-5 py-3 font-semibold text-gray-700">PO-2026-092 (Popular Pipes)</td>
                                <td class="px-5 py-3 text-center font-bold text-emerald-600">+ 50</td>
                                <td class="px-5 py-3 text-center font-bold text-gray-900">55</td>
                            </tr>
                            
                            <!-- Site Return -->
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="px-5 py-3 whitespace-nowrap">
                                    <div class="font-bold text-gray-800">09-Sep-2026</div>
                                    <div class="text-xs text-gray-500">16:45 PM</div>
                                </td>
                                <td class="px-5 py-3 font-mono text-xs text-indigo-600 font-bold">RET-0041</td>
                                <td class="px-5 py-3">
                                    <div class="font-bold text-gray-900">Refrigerant Gas R-410A</div>
                                    <div class="text-xs text-gray-500">ITM-HVAC-003</div>
                                </td>
                                <td class="px-5 py-3">
                                    <span class="bg-blue-50 text-blue-600 border border-blue-200 text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider"><i class="fas fa-undo mr-1"></i> Return</span>
                                </td>
                                <td class="px-5 py-3 font-semibold text-gray-700">Clifton Block 2 Site</td>
                                <td class="px-5 py-3 text-center font-bold text-blue-600">+ 1</td>
                                <td class="px-5 py-3 text-center font-bold text-gray-900">15</td>
                            </tr>

                            <!-- Manual Adjustment -->
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="px-5 py-3 whitespace-nowrap">
                                    <div class="font-bold text-gray-800">08-Sep-2026</div>
                                    <div class="text-xs text-gray-500">11:00 AM</div>
                                </td>
                                <td class="px-5 py-3 font-mono text-xs text-indigo-600 font-bold">ADJ-008</td>
                                <td class="px-5 py-3">
                                    <div class="font-bold text-gray-900">GI Sheet (22 Gauge)</div>
                                    <div class="text-xs text-gray-500">ITM-HVAC-004</div>
                                </td>
                                <td class="px-5 py-3">
                                    <span class="bg-purple-50 text-purple-600 border border-purple-200 text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider"><i class="fas fa-sliders-h mr-1"></i> Adjust</span>
                                </td>
                                <td class="px-5 py-3 font-semibold text-gray-700">Audit Correction</td>
                                <td class="px-5 py-3 text-center font-bold text-red-600">- 5</td>
                                <td class="px-5 py-3 text-center font-bold text-gray-900">80</td>
                            </tr>

                            <!-- Outward Transaction -->
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="px-5 py-3 whitespace-nowrap">
                                    <div class="font-bold text-gray-800">07-Sep-2026</div>
                                    <div class="text-xs text-gray-500">10:15 AM</div>
                                </td>
                                <td class="px-5 py-3 font-mono text-xs text-indigo-600 font-bold">MIS-8875</td>
                                <td class="px-5 py-3">
                                    <div class="font-bold text-gray-900">VRF Outdoor Units (20 HP)</div>
                                    <div class="text-xs text-gray-500">ITM-HVAC-001</div>
                                </td>
                                <td class="px-5 py-3">
                                    <span class="bg-red-50 text-red-600 border border-red-200 text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider"><i class="fas fa-arrow-up mr-1"></i> Outward</span>
                                </td>
                                <td class="px-5 py-3 font-semibold text-gray-700">Bahria Town HQ Site</td>
                                <td class="px-5 py-3 text-center font-bold text-red-600">- 4</td>
                                <td class="px-5 py-3 text-center font-bold text-gray-900">12</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="px-6 py-4 border-t border-gray-200 bg-gray-50 flex justify-between items-center text-sm shrink-0">
                    <span class="text-gray-500 font-semibold">Showing 5 of 1,245 transactions</span>
                    <div class="flex gap-2">
                        <button class="px-3 py-1 border border-gray-300 rounded bg-white text-gray-400 cursor-not-allowed shadow-sm font-semibold">Previous</button>
                        <button class="px-3 py-1 border border-gray-300 rounded bg-white hover:bg-gray-50 text-gray-700 shadow-sm font-semibold transition">Next</button>
                    </div>
                </div>
            </div>
        `);
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</body>
</html>
