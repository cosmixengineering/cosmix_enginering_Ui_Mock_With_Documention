<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Inventory | Cosmix ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>html { font-size: 13px !important; } body { font-family: 'Inter', sans-serif; } table th { padding: 0.4rem 0.75rem !important; font-size: 0.72rem !important; } table td { padding: 0.45rem 0.75rem !important; font-size: 0.78rem !important; }</style>
</head>
<body class="text-gray-800">
    <div id="app-layout" class="flex min-h-screen"></div>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <script src="../../assets/js/shared.js"></script>
    <script>
        renderLayout('inventory');
        setPageContent('Master Inventory', `
<!-- Top Header -->
            

            <!-- Content -->
            
                
                <!-- Filters -->
                <div class="bg-white rounded-t-xl border-b border-gray-100 p-4 flex gap-4 items-center">
                    <div class="relative flex-1 max-w-md">
                        <i class="fa-solid fa-search absolute left-3 top-3 text-gray-400"></i>
                        <input type="text" placeholder="Search by SKU, Item Name..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <select class="border border-gray-300 text-gray-700 py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option>All Categories</option>
                        <option>Civil & Construction</option>
                        <option>Electrical</option>
                        <option>Plumbing</option>
                        <option>Tools & Equipment</option>
                    </select>
                    <select class="border border-gray-300 text-gray-700 py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option>Stock Status: All</option>
                        <option>In Stock</option>
                        <option>Low Stock</option>
                        <option>Out of Stock</option>
                    </select>
                </div>

                <!-- Table -->
                <div class="bg-white shadow-sm border border-gray-200 rounded-b-xl overflow-hidden">
                    <table class="w-full text-left text-sm text-gray-600">
                        <thead class="bg-gray-50 text-gray-700 border-b border-gray-200 uppercase text-xs font-semibold">
                            <tr>
                                <th class="px-6 py-4">SKU / Code</th>
                                <th class="px-6 py-4">Item Name & Desc</th>
                                <th class="px-6 py-4">Category</th>
                                <th class="px-6 py-4">Unit</th>
                                <th class="px-6 py-4 text-right">In Stock</th>
                                <th class="px-6 py-4 text-center">Status</th>
                                <th class="px-6 py-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100">
                            <!-- Item 1 -->
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="px-6 py-4 font-mono text-xs font-semibold text-gray-500">ITM-CIV-001</td>
                                <td class="px-6 py-4">
                                    <p class="font-bold text-gray-900">OPC Cement (Lucky)</p>
                                    <p class="text-xs text-gray-500">50kg Bags, Grade 43</p>
                                </td>
                                <td class="px-6 py-4">Civil & Construction</td>
                                <td class="px-6 py-4">Bags</td>
                                <td class="px-6 py-4 text-right font-bold text-gray-900">1,250</td>
                                <td class="px-6 py-4 text-center">
                                    <span class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-xs font-bold">Good</span>
                                </td>
                                <td class="px-6 py-4 text-right">
                                    <button class="text-blue-600 hover:text-blue-800 mr-3"><i class="fa-solid fa-pen-to-square"></i></button>
                                    <button class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                                </td>
                            </tr>
                            <!-- Item 2 -->
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="px-6 py-4 font-mono text-xs font-semibold text-gray-500">ITM-ELE-042</td>
                                <td class="px-6 py-4">
                                    <p class="font-bold text-gray-900">Copper Wire 3/29</p>
                                    <p class="text-xs text-gray-500">Pakistan Cables, Single Core</p>
                                </td>
                                <td class="px-6 py-4">Electrical</td>
                                <td class="px-6 py-4">Coils</td>
                                <td class="px-6 py-4 text-right font-bold text-red-600">3</td>
                                <td class="px-6 py-4 text-center">
                                    <span class="bg-red-100 text-red-700 px-3 py-1 rounded-full text-xs font-bold">Critical</span>
                                </td>
                                <td class="px-6 py-4 text-right">
                                    <button class="text-blue-600 hover:text-blue-800 mr-3"><i class="fa-solid fa-pen-to-square"></i></button>
                                    <button class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                                </td>
                            </tr>
                            <!-- Item 3 -->
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="px-6 py-4 font-mono text-xs font-semibold text-gray-500">ITM-PLM-110</td>
                                <td class="px-6 py-4">
                                    <p class="font-bold text-gray-900">PVC Pipe 4"</p>
                                    <p class="text-xs text-gray-500">Schedule 40, Popular Pipes</p>
                                </td>
                                <td class="px-6 py-4">Plumbing</td>
                                <td class="px-6 py-4">Lengths</td>
                                <td class="px-6 py-4 text-right font-bold text-amber-600">15</td>
                                <td class="px-6 py-4 text-center">
                                    <span class="bg-amber-100 text-amber-700 px-3 py-1 rounded-full text-xs font-bold">Low</span>
                                </td>
                                <td class="px-6 py-4 text-right">
                                    <button class="text-blue-600 hover:text-blue-800 mr-3"><i class="fa-solid fa-pen-to-square"></i></button>
                                    <button class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    
                    <div class="px-6 py-4 border-t border-gray-200 bg-gray-50 flex justify-between items-center text-sm">
                        <span class="text-gray-500">Showing 1 to 3 of 1,245 items</span>
                        <div class="flex gap-2">
                            <button class="px-3 py-1 border border-gray-300 rounded bg-white text-gray-400 cursor-not-allowed">Previous</button>
                            <button class="px-3 py-1 border border-gray-300 rounded bg-white hover:bg-gray-50 text-gray-700">Next</button>
                        </div>
                    </div>
                </div>
        `);
    </script>
</body>
</html>
