                                    </td>
                                    <td class="px-4 py-2.5">
                                        <span class="bg-blue-50 text-[#242b5f] px-2 py-0.5 rounded text-[9.5px] font-bold border border-blue-100">Loan Policy</span>
                                    </td>
                                    <td class="px-4 py-2.5 text-gray-600 font-medium">% Cap of Base Salary</td>
                                    <td class="px-4 py-2.5">
                                        <div class="font-bold text-[#242b5f] font-mono text-[11px]">Max 50% of Base Salary (1-5 EMIs)</div>
                                        <div class="text-[9px] text-gray-400">Special approval needed for > 50% cap</div>
                                    </td>
                                    <td class="px-4 py-2.5 text-gray-700 font-medium">Employees with > 6 months tenure</td>
                                    <td class="px-4 py-2.5 text-center">
                                        <span class="text-green-600 text-sm font-bold"><i class="fas fa-toggle-on text-base text-[#242b5f]"></i></span>
                                    </td>
                                    <td class="px-4 py-2.5 text-center">
                                        <span class="bg-green-50 text-green-700 px-2.5 py-0.5 rounded text-[9.5px] font-bold border border-green-200 uppercase">Active</span>
                                    </td>
                                    <td class="px-4 py-2.5 text-right">
                                        <button onclick="openEditRuleModal('Advance Salary Borrowing Cap', 'Loan Policy', '% Cap of Base Salary', 'Max 50%', 'Tenure > 6 months')" class="text-gray-400 hover:text-[#242b5f] p-1 rounded hover:bg-gray-100 text-xs transition" title="Edit Rule"><i class="fas fa-pen"></i></button>
                                    </td>
                                </tr>

                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Slide-over Drawer Modal: Add / Edit Policy Rule -->
                <div id="rule-modal" class="fixed inset-0 z-50 hidden">
                    <div class="absolute inset-0 bg-gray-900/40 backdrop-blur-sm" onclick="document.getElementById('rule-modal').classList.add('hidden')"></div>
                    
                    <div class="absolute inset-y-0 right-0 w-full max-w-xl bg-white shadow-2xl flex flex-col border-l border-gray-200">
                        
                        <!-- Header -->
                        <div class="flex items-center justify-between px-5 py-3 border-b border-gray-200 bg-gray-50/50">
                            <div class="flex items-center gap-2.5">
                                <div class="w-7 h-7 rounded-md bg-[#e8eaf6] text-[#242b5f] flex items-center justify-center text-xs">
                                    <i class="fas fa-sliders-h"></i>
                                </div>
                                <div>
                                    <h3 class="text-sm font-bold text-[#242b5f]" id="rule-modal-title">Configure Salary Rule / Deduction</h3>
                                    <p class="text-[10px] text-gray-400">Define deduction formulas, tax rates & allowance percentages</p>
                                </div>
                            </div>
                            <button onclick="document.getElementById('rule-modal').classList.add('hidden')" class="text-gray-400 hover:text-red-500 text-base p-1 rounded hover:bg-gray-100 transition">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>

                        <!-- Form Body -->
                        <div class="flex-1 overflow-y-auto p-5 space-y-4 text-xs">
                            
                            <!-- 1. Rule Identification -->
                            <div class="bg-gray-50/60 p-3.5 rounded-lg border border-gray-200">
                                <h4 class="text-xs font-bold text-gray-700 mb-2.5 flex items-center gap-1.5">
                                    <i class="fas fa-tag text-blue-600"></i> 1. Rule Name & Category
                                </h4>
                                <div class="grid grid-cols-2 gap-2.5">
                                    <div class="col-span-2">
                                        <label class="block text-[10px] font-bold text-gray-600 mb-1">Component / Policy Name <span class="text-red-500">*</span></label>
                                        <input id="rule_name" type="text" class="w-full border border-gray-200 rounded px-2.5 py-1.5 text-xs focus:ring-1 focus:ring-[#242b5f] bg-white outline-none" placeholder="e.g. Site Food & Mess Allowance">
                                    </div>
                                    <div>
                                        <label class="block text-[10px] font-bold text-gray-600 mb-1">Category <span class="text-red-500">*</span></label>
                                        <select id="rule_category" class="w-full border border-gray-200 rounded px-2 py-1.5 text-xs bg-white focus:outline-none">
                                            <option value="Statutory Deduction">Statutory Deduction (Govt/Tax)</option>
                                            <option value="Attendance Penalty">Attendance / Disciplinary Penalty</option>
                                            <option value="Earning Allowance">Earning Allowance / Benefit</option>
                                            <option value="Loan Policy">Loan & Advance Rule</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-[10px] font-bold text-gray-600 mb-1">Calculation Method</label>
                                        <select id="rule_method" class="w-full border border-gray-200 rounded px-2 py-1.5 text-xs bg-white focus:outline-none">
                                            <option value="Percentage of Basic">% of Basic Salary</option>
                                            <option value="Fixed Amount PKR">Fixed Monthly PKR Amount</option>
                                            <option value="Hourly Multiplier">Hourly Rate Multiplier</option>
                                            <option value="Per Occurrence">Per Day / Per Occurrence</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <!-- 2. Rate & Formula Parameters -->
                            <div class="bg-gray-50/60 p-3.5 rounded-lg border border-gray-200">
                                <h4 class="text-xs font-bold text-gray-700 mb-2.5 flex items-center gap-1.5">
                                    <i class="fas fa-calculator text-green-600"></i> 2. Rate & Mathematical Value
                                </h4>
                                <div class="grid grid-cols-2 gap-2.5">
                                    <div>
                                        <label class="block text-[10px] font-bold text-gray-600 mb-1">Value / Rate <span class="text-red-500">*</span></label>
                                        <input id="rule_value" type="text" class="w-full border border-gray-200 rounded px-2.5 py-1.5 text-xs focus:ring-1 focus:ring-[#242b5f] bg-white outline-none" placeholder="e.g. 5000 or 15%">
                                    </div>
                                    <div>
                                        <label class="block text-[10px] font-bold text-gray-600 mb-1">Applies To Workforce</label>
                                        <select id="rule_applicability" class="w-full border border-gray-200 rounded px-2 py-1.5 text-xs bg-white focus:outline-none">
                                            <option value="All Employees">All Employees (150)</option>
                                            <option value="Field Techs Only">Field Technicians Only</option>
                                            <option value="Site Engineers Only">Site Engineers Only</option>
                                            <option value="Head Office Staff">Head Office Staff</option>
                                        </select>
                                    </div>
                                    <div class="col-span-2">
                                        <label class="block text-[10px] font-bold text-gray-600 mb-1">Formula Note / Business Rule Description</label>
                                        <textarea id="rule_desc" class="w-full border border-gray-200 rounded px-2.5 py-1.5 text-xs focus:ring-1 focus:ring-[#242b5f] bg-white outline-none" rows="2" placeholder="e.g. Automatically credit Rs. 5,000 for technicians on remote outstation shifts..."></textarea>
                                    </div>
                                </div>
                            </div>

                        </div>

                        <!-- Footer -->
                        <div class="px-5 py-3 border-t border-gray-200 bg-white flex justify-between items-center">
                            <span class="text-[10px] text-gray-400 font-bold uppercase"><i class="fas fa-lock mr-1"></i> Will sync with next payroll run</span>
                            <div class="flex gap-2">
                                <button onclick="document.getElementById('rule-modal').classList.add('hidden')" class="px-3 py-1.5 text-xs font-semibold text-gray-600 hover:bg-gray-100 rounded-md transition">Cancel</button>
                                <button onclick="submitNewRule()" class="bg-[#242b5f] text-white px-4 py-1.5 rounded-md text-xs font-bold shadow-sm hover:opacity-90 transition flex items-center gap-1.5">
                                    <i class="fas fa-check text-[10px]"></i> Save Policy Rule
                                </button>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        `;

        setPageContent('Salary Rules, Deductions & Allowances', pageHTML);

        // Edit rule modal helper
        window.openEditRuleModal = function(name, cat, type, val, app) {
            document.getElementById('rule-modal-title').innerText = 'Edit Policy: ' + name;
            document.getElementById('rule_name').value = name;
            document.getElementById('rule_category').value = cat;
            document.getElementById('rule_value').value = val;
            document.getElementById('rule_applicability').value = app;
            document.getElementById('rule-modal').classList.remove('hidden');
        };

        // Submit new rule
        window.submitNewRule = function() {
            const name = document.getElementById('rule_name').value.trim();
            const cat = document.getElementById('rule_category').value;
            const val = document.getElementById('rule_value').value.trim();
            const app = document.getElementById('rule_applicability').value;
            const method = document.getElementById('rule_method').value;

            if (!name || !val) {
                showToast('Please enter Rule Name and Value!', 'error');
                return;
            }

            const tbody = document.getElementById('rules-table-body');
            const newRow = document.createElement('tr');
            newRow.className = 'hover:bg-blue-50/20 transition group bg-blue-50/20 border-l-4 border-[#242b5f]';

            const catBadgeClass = cat.includes('Deduction') 
                ? 'bg-red-50 text-red-700 border-red-100' 
                : cat.includes('Penalty') 
                ? 'bg-orange-50 text-orange-700 border-orange-100' 
                : 'bg-green-50 text-green-700 border-green-100';

            newRow.innerHTML = `
                <td class="px-4 py-2.5">
                    <div class="font-bold text-gray-800">${name}</div>
                    <div class="text-[9px] text-gray-400">Newly configured custom company rule</div>
                </td>
                <td class="px-4 py-2.5">
                    <span class="${catBadgeClass} px-2 py-0.5 rounded text-[9.5px] font-bold border">${cat}</span>
                </td>
                <td class="px-4 py-2.5 text-gray-600 font-medium">${method}</td>
                <td class="px-4 py-2.5">
                    <div class="font-bold text-[#242b5f] font-mono text-[11px]">${val}</div>
                    <div class="text-[9px] text-gray-400">Configured by HR Admin</div>
                </td>
                <td class="px-4 py-2.5 text-gray-700 font-medium">${app}</td>
                <td class="px-4 py-2.5 text-center">
                    <span class="text-green-600 text-sm font-bold"><i class="fas fa-toggle-on text-base text-[#242b5f]"></i></span>
                </td>
                <td class="px-4 py-2.5 text-center">
                    <span class="bg-green-50 text-green-700 px-2.5 py-0.5 rounded text-[9.5px] font-bold border border-green-200 uppercase">Active</span>
                </td>
                <td class="px-4 py-2.5 text-right">
                    <button onclick="openEditRuleModal('${name.replace(/'/g, "\\'")}', '${cat}', '${method}', '${val}', '${app}')" class="text-gray-400 hover:text-[#242b5f] p-1 rounded hover:bg-gray-100 text-xs transition" title="Edit Rule"><i class="fas fa-pen"></i></button>
                </td>
            `;

            tbody.insertBefore(newRow, tbody.firstChild);

            // Update stats counter
            const statRules = document.getElementById('stat-active-rules');
            if (statRules) statRules.innerHTML = '12 <span class="text-[10px] text-green-600 font-normal">Active</span>';

            document.getElementById('rule-modal').classList.add('hidden');
            document.getElementById('rule_name').value = '';
            document.getElementById('rule_value').value = '';

            showToast(`Rule "${name}" saved and synced with Payroll Engine!`, 'success');
        };
    </script>
</body>
</html>
