                        <button onclick="actionAddOvertimeModal(${day})" class="p-2.5 border border-gray-200 rounded-lg hover:bg-indigo-50 hover:border-indigo-300 text-left transition group">
                            <p class="text-xs font-bold text-indigo-700 flex items-center justify-between">
                                <span><i class="fas fa-business-time mr-1"></i> Add Overtime (+2h)</span>
                                <i class="fas fa-arrow-right text-[9px] opacity-0 group-hover:opacity-100 transition"></i>
                            </p>
                            <p class="text-[9.5px] text-gray-400 mt-0.5">Authorize site technician OT</p>
                        </button>

                        <button onclick="filterLogToDate(${day})" class="p-2.5 border border-gray-200 rounded-lg hover:bg-gray-100 text-left transition group">
                            <p class="text-xs font-bold text-gray-700 flex items-center justify-between">
                                <span><i class="fas fa-list-alt mr-1"></i> View Date Punch Log</span>
                                <i class="fas fa-arrow-down text-[9px] opacity-0 group-hover:opacity-100 transition"></i>
                            </p>
                            <p class="text-[9.5px] text-gray-400 mt-0.5">Scroll & inspect daily table</p>
                        </button>
                    </div>
                </div>
            `;

            openModal(`Direct Attendance Actions: Day ${day} Sep 2026`, body, null);
        };

        // Sub-Modal 1: Mark All Present
        window.actionMarkAllPresentModal = (day) => {
            const body = `
                <div class="space-y-3">
                    <div class="p-2.5 bg-green-50 border border-green-200 rounded-lg flex items-center justify-between">
                        <div>
                            <p class="font-bold text-xs text-green-800">Bulk Attendance Clear: ${day} Sep 2026</p>
                            <p class="text-[10px] text-green-600">Active Organization: 8 Sites • 150 Workers</p>
                        </div>
                        <span class="bg-green-600 text-white text-[9px] px-2 py-0.5 rounded font-bold">100% Present</span>
                    </div>

                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div>
                            <label class="block font-bold text-gray-700 text-[10px] mb-1">Standard Punch-In Time</label>
                            <input type="text" id="bulk-in-time" class="w-full border rounded p-1.5 text-xs bg-white focus:outline-none focus:border-[#242b5f]" value="09:00 AM">
                        </div>
                        <div>
                            <label class="block font-bold text-gray-700 text-[10px] mb-1">Standard Punch-Out Time</label>
                            <input type="text" id="bulk-out-time" class="w-full border rounded p-1.5 text-xs bg-white focus:outline-none focus:border-[#242b5f]" value="06:00 PM">
                        </div>
                    </div>

                    <div class="space-y-1.5 text-[11px] bg-gray-50 p-2.5 rounded border border-gray-200">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" checked class="rounded text-[#242b5f] focus:ring-0">
                            <span class="text-gray-700">Auto-resolve missing check-ins and late arrival flags</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" checked class="rounded text-[#242b5f] focus:ring-0">
                            <span class="text-gray-700">Sync with payroll engine (Full daily wage credited)</span>
                        </label>
                    </div>
                </div>
            `;
            openModal(`Confirm Mark All Present - ${day} Sep 2026`, body, () => {
                applyDayStatus(day, '150/150 Present', 'bg-green-100 text-green-800 border border-green-300');
                if (day === 7) {
                    const s1 = document.getElementById('status-row-1');
                    const s2 = document.getElementById('status-row-2');
                    const s3 = document.getElementById('status-row-3');
                    if (s1) s1.innerHTML = '<span class="bg-green-100 text-green-700 px-2 py-0.5 rounded text-[8.5px] font-bold uppercase">Present</span>';
                    if (s2) s2.innerHTML = '<span class="bg-green-100 text-green-700 px-2 py-0.5 rounded text-[8.5px] font-bold uppercase">Present</span>';
                    if (s3) s3.innerHTML = '<span class="bg-green-100 text-green-700 px-2 py-0.5 rounded text-[8.5px] font-bold uppercase">Present</span>';
                }
                showToast(`All 150 workers marked Present for ${day} September!`, 'success');
            });
        };

        // Sub-Modal 2: Waive All Late Arrivals
        window.actionWaiveLatesModal = (day) => {
            const body = `
                <div class="space-y-3">
                    <div class="p-2.5 bg-blue-50 border border-blue-200 rounded-lg">
                        <p class="font-bold text-xs text-[#242b5f]">Waive Exceptions for ${day} Sep 2026</p>
                        <p class="text-[10px] text-gray-500">Pending Cases: 3 (Ali Khan +60m, Usman Tariq missing punch, Sara Ahmed radius alert)</p>
                    </div>

                    <div>
                        <label class="block font-bold text-gray-700 text-[10px] mb-1">Reason for HR Waiver</label>
                        <select id="waiver-reason" class="w-full border border-gray-200 rounded p-1.5 text-xs bg-white text-gray-700 focus:border-[#242b5f]">
                            <option>Severe Road Traffic / Monsoon Rain Delay</option>
                            <option>Approved Direct Client Emergency Dispatch</option>
                            <option>Biometric Machine Time Synchronization Lag</option>
                            <option>CEO / Executive Management Special Approval</option>
                        </select>
                    </div>

                    <div>
                        <label class="block font-bold text-gray-700 text-[10px] mb-1">HR Officer Remarks</label>
                        <input type="text" class="w-full border border-gray-200 rounded p-1.5 text-xs focus:border-[#242b5f]" placeholder="e.g. Approved as one-time grace by HR Desk" value="Approved grace waiver for transit delay">
                    </div>

                    <div class="p-2 bg-blue-50/70 rounded border border-blue-100 text-[10px] text-[#242b5f] flex items-center gap-1.5">
                        <i class="fas fa-shield-alt text-blue-600"></i> Penalties reversed. Full 9h shift will be counted in payroll.
                    </div>
                </div>
            `;
            openModal(`Waive Late Penalties - ${day} Sep 2026`, body, () => {
                applyDayStatus(day, '145/145 Waived', 'bg-blue-100 text-blue-800 border border-blue-300');
                if (day === 7) {
                    const s1 = document.getElementById('status-row-1');
                    const s2 = document.getElementById('status-row-2');
                    const s3 = document.getElementById('status-row-3');
                    if (s1) s1.innerHTML = '<span class="bg-green-100 text-green-700 px-2 py-0.5 rounded text-[8.5px] font-bold uppercase">Waived</span>';
                    if (s2) s2.innerHTML = '<span class="bg-green-100 text-green-700 px-2 py-0.5 rounded text-[8.5px] font-bold uppercase">Resolved</span>';
                    if (s3) s3.innerHTML = '<span class="bg-green-100 text-green-700 px-2 py-0.5 rounded text-[8.5px] font-bold uppercase">Approved</span>';
                }
                showToast(`Late arrival penalties waived for ${day} September!`, 'success');
            });
        };

        // Sub-Modal 3: Declare Gazetted Holiday
        window.actionDeclareHolidayModal = (day) => {
            const body = `
                <div class="space-y-3">
                    <div>
                        <label class="block font-bold text-gray-700 text-[10px] mb-1">Date</label>
                        <input type="text" class="w-full border border-gray-200 rounded p-1.5 text-xs bg-gray-50 font-bold text-gray-700" value="${day} September 2026" readonly>
                    </div>

                    <div>
                        <label class="block font-bold text-gray-700 text-[10px] mb-1">Holiday Title / Occasion</label>
                        <input type="text" id="modal-holiday-name" class="w-full border border-gray-200 rounded p-1.5 text-xs focus:border-[#242b5f]" placeholder="e.g. Eid Milad-un-Nabi (12 Rabi-ul-Awwal)" value="Eid Milad-un-Nabi">
                    </div>

                    <div>
                        <label class="block font-bold text-gray-700 text-[10px] mb-1">Applicable Scope</label>
                        <select class="w-full border border-gray-200 rounded p-1.5 text-xs bg-white text-gray-700">
                            <option>Full Organization (All 8 Sites & HQ Staff)</option>
                            <option>Site Technicians Only</option>
                            <option>Lahore Head Office Only</option>
                        </select>
                    </div>

                    <div class="p-2 bg-purple-50 rounded border border-purple-100 text-[10px] text-purple-800 flex items-center gap-1.5">
                        <i class="fas fa-umbrella-beach"></i> Roster will mark all 150 workers with Paid Gazetted Holiday status.
                    </div>
                </div>
            `;
            openModal(`Declare Gazetted Holiday - ${day} Sep 2026`, body, () => {
                const name = document.getElementById('modal-holiday-name').value || 'Public Holiday';
                applyDayStatus(day, `Holiday: ${name}`, 'bg-purple-100 text-purple-800 border border-purple-300');
                showToast(`Gazetted Holiday applied: ${name} on ${day} Sep!`, 'success');
            });
        };

        // Sub-Modal 4: Declare Half-Day
        window.actionDeclareHalfDayModal = (day) => {
            const body = `
                <div class="space-y-3">
                    <div>
                        <label class="block font-bold text-gray-700 text-[10px] mb-1">Date</label>
                        <input type="text" class="w-full border border-gray-200 rounded p-1.5 text-xs bg-gray-50 font-bold text-gray-700" value="${day} September 2026" readonly>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block font-bold text-gray-700 text-[10px] mb-1">Shift Early Close Time</label>
                            <input type="text" id="halfday-time" class="w-full border border-gray-200 rounded p-1.5 text-xs bg-white focus:border-[#242b5f]" value="02:00 PM">
                        </div>
                        <div>
                            <label class="block font-bold text-gray-700 text-[10px] mb-1">Shift Hours</label>
                            <input type="text" class="w-full border border-gray-200 rounded p-1.5 text-xs bg-gray-50" value="4.5 Hours" readonly>
                        </div>
                    </div>

                    <div>
                        <label class="block font-bold text-gray-700 text-[10px] mb-1">Reason for Half-Day</label>
                        <select class="w-full border border-gray-200 rounded p-1.5 text-xs bg-white text-gray-700">
                            <option>Friday Early Prayer & Townhall Session</option>
                            <option>Company Annual Strategy Briefing</option>
                            <option>Severe Weather & Heavy Rain Advisory</option>
                            <option>Facility Disinfection & MEP Maintenance</option>
                        </select>
                    </div>

                    <div class="p-2 bg-orange-50 rounded border border-orange-100 text-[10px] text-orange-800 flex items-center gap-1.5">
                        <i class="fas fa-clock"></i> Biometric checkouts after 02:00 PM will be marked complete without deductions.
                    </div>
                </div>
            `;
            openModal(`Declare Half-Day Schedule - ${day} Sep 2026`, body, () => {
                applyDayStatus(day, 'Half-Day (2 PM Close)', 'bg-orange-100 text-orange-800 border border-orange-200');
                showToast(`Half-Day declared for ${day} Sep! Shift ends at 02:00 PM.`, 'success');
            });
        };

        // Sub-Modal 5: Add Bulk Overtime
        window.actionAddOvertimeModal = (day) => {
            const body = `
                <div class="space-y-3">
                    <div>
                        <label class="block font-bold text-gray-700 text-[10px] mb-1">Date</label>
                        <input type="text" class="w-full border border-gray-200 rounded p-1.5 text-xs bg-gray-50 font-bold text-gray-700" value="${day} September 2026" readonly>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block font-bold text-gray-700 text-[10px] mb-1">Overtime Duration</label>
                            <select id="ot-hours" class="w-full border border-gray-200 rounded p-1.5 text-xs bg-white text-gray-700 focus:border-[#242b5f]">
                                <option value="2.0">+2.0 Hours (1.5x Standard Rate)</option>
                                <option value="3.0">+3.0 Hours (1.5x Standard Rate)</option>
                                <option value="4.0">+4.0 Hours (2.0x Double Rate)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-bold text-gray-700 text-[10px] mb-1">Target Sites</label>
                            <select class="w-full border border-gray-200 rounded p-1.5 text-xs bg-white text-gray-700 focus:border-[#242b5f]">
                                <option>All 8 Sites (48 Technicians)</option>
                                <option>Karachi High-Rise Site Only (16 workers)</option>
                                <option>Islamabad Govt Complex (20 workers)</option>
                                <option>Peshawar Substation (12 workers)</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block font-bold text-gray-700 text-[10px] mb-1">Project Justification</label>
                        <input type="text" class="w-full border border-gray-200 rounded p-1.5 text-xs focus:border-[#242b5f]" placeholder="e.g. Night Chiller Pressure Testing & Ducting" value="Night Chiller Pressure Testing & Ducting Work">
                    </div>

                    <div class="p-2 bg-blue-50 rounded border border-blue-100 text-[10px] text-[#242b5f] flex justify-between items-center">
                        <span><i class="fas fa-coins text-amber-500 mr-1"></i> Estimated Overtime Wages:</span>
                        <span class="font-bold">Rs. 38,400 (Rs. 800/worker)</span>
                    </div>
                </div>
            `;
            openModal(`Authorize Bulk Overtime - ${day} Sep 2026`, body, () => {
                const hours = document.getElementById('ot-hours').value;
                applyDayStatus(day, `+${hours}h Overtime`, 'bg-blue-100 text-blue-800 border border-blue-300');
                showToast(`+${hours}h Overtime authorized for site technicians on ${day} Sep!`, 'success');
            });
        };

        window.applyDayStatus = (day, label, pillClass) => {
            const badgeEl = document.getElementById(`cal-badge-${day}`);
            if (badgeEl) {
                badgeEl.innerHTML = `<span class="${pillClass} text-[8.5px] px-1 py-0.2 rounded font-bold">${label}</span>`;
            }
            closeModal();
            showToast(`Day ${day} Sep updated: ${label}!`, 'success');
        };

        window.filterLogToDate = (day) => {
            closeModal();
            const titleEl = document.getElementById('table-date-title');
            if (titleEl) {
                titleEl.innerText = `Live Exceptions & Daily Log (${day} Sep, 2026 - Selected Roster)`;
            }
            const tableSection = document.getElementById('view-table');
            if (tableSection) {
                tableSection.scrollIntoView({ behavior: 'smooth' });
                tableSection.classList.add('ring-2', 'ring-[#242b5f]', 'ring-offset-2');
                setTimeout(() => {
                    tableSection.classList.remove('ring-2', 'ring-[#242b5f]', 'ring-offset-2');
                }, 1500);
            }
            showToast(`Loaded daily punch records for ${day} September 2026`, 'info');
        };

        window.openAddHolidayModal = () => {
            actionDeclareHolidayModal(16);
        };

        window.quickWaiveToday = () => {
            actionWaiveLatesModal(7);
        };

        window.markAllDaysPresent = () => {
            actionMarkAllPresentModal(7);
        };
    </script>
</body>
</html>
