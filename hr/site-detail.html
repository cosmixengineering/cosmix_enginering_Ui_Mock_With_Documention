                                            <i class="fas fa-plane-departure"></i>
                                        </span>
                                        <div>
                                            <h4 class="font-bold text-amber-900 text-xs">Outstation Deployment Expense Package</h4>
                                            <p class="text-[9.5px] text-amber-700">Inter-city relocation allowance & expense breakdown</p>
                                        </div>
                                    </div>
                                    <span class="bg-amber-100 text-amber-900 px-2 py-0.5 rounded text-[9.5px] font-extrabold uppercase tracking-wide">
                                        Outstation Protocol Active
                                    </span>
                                </div>

                                <!-- Expense Grid -->
                                <div class="grid grid-cols-2 gap-2.5">
                                    
                                    <!-- 1. Daily Allowance -->
                                    <div>
                                        <label class="block text-[10px] font-bold text-gray-700 mb-0.5">Daily Allowance (TA/DA Per Diem)</label>
                                        <div class="flex items-center gap-1">
                                            <span class="text-gray-400 text-xs">Rs.</span>
                                            <input type="number" id="exp_daily_rate" value="1500" oninput="calculateOutstationTotal()" class="w-full border rounded px-2 py-1 text-xs bg-white font-bold">
                                            <span class="text-gray-400 text-[10px]">/day</span>
                                        </div>
                                        <p class="text-[9px] text-gray-400 mt-0.5" id="exp_tada_subtotal">30 days x Rs. 1,500 = Rs. 45,000</p>
                                    </div>

                                    <!-- 2. Travel Fare -->
                                    <div>
                                        <label class="block text-[10px] font-bold text-gray-700 mb-0.5">Travel Fare / Ticket Cost</label>
                                        <div class="flex items-center gap-1">
                                            <span class="text-gray-400 text-xs">Rs.</span>
                                            <input type="number" id="exp_ticket_fare" value="6500" oninput="calculateOutstationTotal()" class="w-full border rounded px-2 py-1 text-xs bg-white font-bold">
                                        </div>
                                        <p class="text-[9px] text-gray-400 mt-0.5">Daewoo Sleeper / AC Train / Flight</p>
                                    </div>

                                    <!-- 3. Lodging & Mess Allowance -->
                                    <div>
                                        <label class="block text-[10px] font-bold text-gray-700 mb-0.5">Site Lodging / Mess Allowance</label>
                                        <div class="flex items-center gap-1">
                                            <span class="text-gray-400 text-xs">Rs.</span>
                                            <input type="number" id="exp_lodging" value="15000" oninput="calculateOutstationTotal()" class="w-full border rounded px-2 py-1 text-xs bg-white font-bold">
                                        </div>
                                        <p class="text-[9px] text-gray-400 mt-0.5">Site camp / hotel / rental room</p>
                                    </div>

                                    <!-- 4. Mobilization Cash Advance -->
                                    <div>
                                        <label class="block text-[10px] font-bold text-gray-700 mb-0.5">Mobilization Relocation Advance</label>
                                        <div class="flex items-center gap-1">
                                            <span class="text-gray-400 text-xs">Rs.</span>
                                            <input type="number" id="exp_advance" value="10000" oninput="calculateOutstationTotal()" class="w-full border rounded px-2 py-1 text-xs bg-white font-bold">
                                        </div>
                                        <p class="text-[9px] text-gray-400 mt-0.5">Cash given before journey</p>
                                    </div>
                                </div>

                                <!-- Dynamic Custom Expense Items List -->
                                <div class="pt-2 border-t border-amber-200">
                                    <div class="flex items-center justify-between mb-1.5">
                                        <span class="text-[10px] font-bold text-gray-700">Additional Custom Expenses (Heavy tools, Local Conveyance, PPE):</span>
                                        <button type="button" onclick="addCustomExpenseRow()" class="text-[10px] text-blue-700 hover:text-blue-900 font-bold flex items-center gap-1">
                                            <i class="fas fa-plus-circle"></i> + Add Expense Item
                                        </button>
                                    </div>
                                    <div id="custom-expenses-container" class="space-y-1.5">
                                        <!-- Custom item rows injected here -->
                                        <div class="flex items-center gap-2 custom-exp-row">
                                            <input type="text" placeholder="e.g. Heavy Testing Toolbag Cargo" value="Heavy Testing Toolbag Cargo Transit" class="flex-1 border rounded px-2 py-1 text-xs bg-white">
                                            <div class="flex items-center gap-1 w-28">
                                                <span class="text-gray-400 text-xs">Rs.</span>
                                                <input type="number" value="2500" oninput="calculateOutstationTotal()" class="w-full border rounded px-2 py-1 text-xs bg-white font-bold custom-exp-val">
                                            </div>
                                            <button type="button" onclick="removeCustomExpenseRow(this)" class="text-red-500 hover:text-red-700 text-xs px-1"><i class="fas fa-trash-alt"></i></button>
                                        </div>
                                    </div>
                                </div>

                                <!-- Total Outstation Package Bar -->
                                <div class="bg-[#242b5f] text-white p-3 rounded-lg shadow-sm flex items-center justify-between mt-2">
                                    <div>
                                        <p class="text-[9px] text-gray-300 font-bold uppercase tracking-wider">Total Outstation Package (PKR)</p>
                                        <h3 class="text-xl font-extrabold" id="total-outstation-package-disp">Rs. 79,000</h3>
                                    </div>
                                    <span class="text-[10px] text-amber-300 font-semibold flex items-center gap-1 bg-white/10 px-2 py-1 rounded">
                                        <i class="fas fa-calculator"></i> Auto-Calculated
                                    </span>
                                </div>

                            </div>

                            <div>
                                <label class="block text-[10.5px] font-bold text-gray-700 mb-1">Transfer Justification & Handover Instructions</label>
                                <textarea id="tr_notes" rows="2" class="w-full border rounded p-2 text-xs bg-white outline-none focus:border-[#242b5f]" placeholder="e.g. Urgent VRF chiller commissioning required at Lahore facility for 30 days..."></textarea>
                            </div>

                        </div>

                        <div class="px-5 py-3 border-t border-gray-200 bg-white flex justify-end gap-2">
                            <button onclick="closeTransferModal()" class="px-3 py-1.5 text-xs font-semibold text-gray-600 hover:bg-gray-100 rounded-md transition">Cancel</button>
                            <button onclick="confirmWorkerTransfer()" class="bg-[#242b5f] text-white px-4 py-1.5 rounded-md text-xs font-bold shadow-sm hover:opacity-90 transition flex items-center gap-1.5">
                                <i class="fas fa-check"></i> Confirm & Reassign Worker
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        `;

        setPageContent(`Working Site: ${siteData.name}`, pageHTML);

        // ==============================================================
        // JAVASCRIPT CONTROLLERS
        // ==============================================================

        // 1. Tab Switcher
        window.switchSiteTab = function(tab) {
            const tabs = ['roster', 'outstation', 'geofence', 'contract'];
            tabs.forEach(t => {
                const btn = document.getElementById(`tab-site-${t}`);
                const view = document.getElementById(`view-site-${t}`);
                if (t === tab) {
                    btn.className = 'tab-btn active px-3.5 py-2.5 text-xs font-bold text-[#242b5f] transition flex items-center gap-2 border-b-[2.5px] border-[#242b5f] bg-white';
                    view.classList.remove('hidden');
                    if (t === 'geofence') {
                        setTimeout(initSiteDetailMap, 150);
                    }
                } else {
                    btn.className = 'tab-btn px-3.5 py-2.5 text-xs font-semibold text-gray-600 hover:text-[#242b5f] transition flex items-center gap-2 border-b-2 border-transparent';
                    view.classList.add('hidden');
                }
            });
        };

        // 2. Supervisor Modal Handlers
        window.openSupervisorModal = function() {
            document.getElementById('supervisor-modal').classList.remove('hidden');
        };

        window.closeSupervisorModal = function() {
            document.getElementById('supervisor-modal').classList.add('hidden');
        };

        window.saveSupervisorAssignment = function() {
            const val = document.getElementById('sup_engineer_select').value;
            const [name, role, phone] = val.split('|');

            siteData.supervisor = name;
            siteData.supervisorRole = role;
            siteData.supervisorPhone = phone;

            document.getElementById('disp-supervisor-name').innerText = name;
            document.getElementById('disp-supervisor-role').innerText = role;
            document.getElementById('disp-supervisor-phone').innerText = phone;

            closeSupervisorModal();
            showToast(`${name} assigned as official Site Incharge for ${siteData.name}!`, 'success');
        };

        // 3. Worker Transfer Handlers
        let activeTransferWorker = null;

        // Cities and Sites Directory
        const CITY_SITES_DIRECTORY = {
            'Karachi': [
                { code: 'CMX-SITE-101', name: 'Karachi High-Rise Commercial Tower (Clifton)' },
                { code: 'CMX-SITE-107', name: 'Bahria Town Substation & Transmission (Super Hwy)' },
                { code: 'CMX-SITE-110', name: 'Korangi Industrial Effluent & Pump Station' }
            ],
            'Lahore': [
                { code: 'CMX-SITE-100', name: 'Head Office & Central Fabrication Workshop (Gulberg III)' },
                { code: 'CMX-SITE-108', name: 'DHA Phase 8 Commercial Mall HVAC (DHA)' },
                { code: 'CMX-SITE-111', name: 'Sundar Industrial Estate Transformer Yard' }
            ],
            'Islamabad': [
                { code: 'CMX-SITE-102', name: 'Islamabad Govt Complex Site (Sector G-5)' },
                { code: 'CMX-SITE-109', name: 'Blue Area Corporate Tower MEP' }
            ],
            'Faisalabad': [
                { code: 'CMX-SITE-104', name: 'Faisalabad Textile Industrial Substation (Khurrianwala)' }
            ],
            'Peshawar': [
                { code: 'CMX-SITE-105', name: 'Peshawar Industrial Chiller Site (Hayatabad)' }
            ],
            'Multan': [
                { code: 'CMX-SITE-106', name: 'Multan Food Processing Plant (Industrial Estate)' }
            ]
        };

        window.openTransferModal = function(name, code, role, currentSite, currentCity) {
            activeTransferWorker = { name, code, role, currentSite, currentCity };

            document.getElementById('tr-worker-name').innerText = name;
            document.getElementById('tr-worker-meta').innerText = `${code} • ${role}`;
            document.getElementById('tr-current-site').innerText = currentSite;
            document.getElementById('tr-avatar').innerText = name.split(' ').map(n=>n[0]).join('');

            // Default destination to a different city to demonstrate outstation
            const destCitySelect = document.getElementById('tr_dest_city');
            destCitySelect.value = (currentCity === 'Karachi') ? 'Lahore' : 'Karachi';
            handleDestCityChange(destCitySelect.value);

            document.getElementById('transfer-modal').classList.remove('hidden');
        };

        window.closeTransferModal = function() {
            document.getElementById('transfer-modal').classList.add('hidden');
        };

        window.handleDestCityChange = function(selectedCity) {
            const siteSelect = document.getElementById('tr_dest_site');
            siteSelect.innerHTML = '';

            const availableSites = CITY_SITES_DIRECTORY[selectedCity] || [];
            availableSites.forEach(s => {
                const opt = document.createElement('option');
                opt.value = `${s.code}|${s.name}|${selectedCity}`;
                opt.innerText = `${s.name} (${s.code})`;
                siteSelect.appendChild(opt);
            });

            // Check if Outstation
            const isOutstation = (selectedCity.toLowerCase() !== siteData.city.toLowerCase());

            const outstationCard = document.getElementById('outstation-expense-card');
            const localNotice = document.getElementById('local-transfer-notice');

            if (isOutstation) {
                outstationCard.classList.remove('hidden');
                localNotice.classList.add('hidden');
                calculateOutstationTotal();
            } else {
                outstationCard.classList.add('hidden');
                localNotice.classList.remove('hidden');
            }
        };

        window.addCustomExpenseRow = function() {
            const container = document.getElementById('custom-expenses-container');
            const row = document.createElement('div');
            row.className = 'flex items-center gap-2 custom-exp-row';
            row.innerHTML = `
                <input type="text" placeholder="Expense description (e.g. Tool shipment)" class="flex-1 border rounded px-2 py-1 text-xs bg-white">
                <div class="flex items-center gap-1 w-28">
                    <span class="text-gray-400 text-xs">Rs.</span>
                    <input type="number" value="1500" oninput="calculateOutstationTotal()" class="w-full border rounded px-2 py-1 text-xs bg-white font-bold custom-exp-val">
                </div>
                <button type="button" onclick="removeCustomExpenseRow(this)" class="text-red-500 hover:text-red-700 text-xs px-1"><i class="fas fa-trash-alt"></i></button>
            `;
            container.appendChild(row);
            calculateOutstationTotal();
        };

        window.removeCustomExpenseRow = function(btn) {
            btn.closest('.custom-exp-row').remove();
            calculateOutstationTotal();
        };

        window.calculateOutstationTotal = function() {
            const days = parseFloat(document.getElementById('tr_duration_days').value) || 30;
            const dailyRate = parseFloat(document.getElementById('exp_daily_rate').value) || 0;
            const ticket = parseFloat(document.getElementById('exp_ticket_fare').value) || 0;
            const lodging = parseFloat(document.getElementById('exp_lodging').value) || 0;
            const advance = parseFloat(document.getElementById('exp_advance').value) || 0;

            const tadaTotal = days * dailyRate;
            document.getElementById('exp_tada_subtotal').innerText = `${days} days x Rs. ${dailyRate.toLocaleString()} = Rs. ${tadaTotal.toLocaleString()}`;

            let customTotal = 0;
            document.querySelectorAll('.custom-exp-val').forEach(input => {
                customTotal += (parseFloat(input.value) || 0);
            });

            const grandTotal = tadaTotal + ticket + lodging + advance + customTotal;
            document.getElementById('total-outstation-package-disp').innerText = `Rs. ${grandTotal.toLocaleString()}`;
            return grandTotal;
        };

        window.confirmWorkerTransfer = function() {
            if (!activeTransferWorker) return;

            const destRaw = document.getElementById('tr_dest_site').value;
            const [destCode, destName, destCity] = destRaw.split('|');
            const duration = document.getElementById('tr_duration_days').value;
            const isOutstation = (destCity.toLowerCase() !== siteData.city.toLowerCase());
            const totalCost = isOutstation ? calculateOutstationTotal() : 0;

            // 1. Remove worker row from current site roster table
            const workerRowId = `roster-${activeTransferWorker.code.toLowerCase()}`;
            const rowEl = document.getElementById(workerRowId);
            if (rowEl) {
                rowEl.style.transition = 'all 0.5s';
                rowEl.style.backgroundColor = '#fee2e2';
                setTimeout(() => rowEl.remove(), 400);
            }

            // 2. Decrement headcount
            siteData.headcount = Math.max(0, siteData.headcount - 1);
            document.getElementById('stat-site-headcount').innerHTML = `${siteData.headcount} <span class="text-[10px] text-emerald-600 font-normal">Active Staff</span>`;
            document.getElementById('badge-roster-count').innerText = siteData.headcount;

            // 3. If Outstation, log to Outstation Register tab
            if (isOutstation) {
                const outstationTbody = document.getElementById('outstation-register-body');
                const newTr = document.createElement('tr');
                newTr.className = 'hover:bg-amber-50/20 bg-amber-50/10 border-l-4 border-amber-500 transition';
                newTr.innerHTML = `
                    <td class="px-4 py-2.5">
                        <div class="font-bold text-gray-800">${activeTransferWorker.name}</div>
                        <div class="text-[9.5px] text-gray-400">${activeTransferWorker.code} • ${activeTransferWorker.role}</div>
                    </td>
                    <td class="px-4 py-2.5">
                        <div class="font-semibold text-[#242b5f]">${siteData.name} $\\rightarrow$ ${destName}</div>
                        <div class="text-[9px] text-amber-700 font-bold">Relocated to ${destCity}</div>
                    </td>
                    <td class="px-4 py-2.5">
                        <div class="font-medium text-gray-700">Just Transferred</div>
                        <span class="text-[9px] text-emerald-600 font-bold">${duration} Days Active Assignment</span>
                    </td>
                    <td class="px-4 py-2.5">
                        <div class="font-bold text-gray-800">Rs. 1,500 / day</div>
                    </td>
                    <td class="px-4 py-2.5 text-gray-600">
                        <div>Ticket + Lodging + Advance</div>
                    </td>
                    <td class="px-4 py-2.5">
                        <span class="text-amber-800 font-extrabold text-sm">Rs. ${totalCost.toLocaleString()}</span>
                    </td>
                    <td class="px-4 py-2.5 text-right">
                        <button onclick="showToast('Outstation transfer voucher generated!', 'success')" class="text-blue-600 hover:underline text-[10.5px] font-semibold"><i class="fas fa-file-invoice mr-1"></i> View Slip</button>
                    </td>
                `;
                outstationTbody.insertBefore(newTr, outstationTbody.firstChild);
            }

            closeTransferModal();

            if (isOutstation) {
                showToast(`Worker ${activeTransferWorker.name} transferred outstation to ${destName} (${destCity}) with Rs. ${totalCost.toLocaleString()} allowance package!`, 'success');
            } else {
                showToast(`Worker ${activeTransferWorker.name} reassigned to ${destName}!`, 'success');
            }
        };

        // 4. Leaflet Map for Tab 3
        let detailMap = null;
        function initSiteDetailMap() {
            if (detailMap) {
                detailMap.invalidateSize();
                return;
            }

            const mapEl = document.getElementById('site-detail-map');
            if (!mapEl || typeof L === 'undefined') return;

            detailMap = L.map('site-detail-map').setView([siteData.lat, siteData.lng], 16);

            L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
                maxZoom: 20,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
                attribution: '&copy; Google Maps'
            }).addTo(detailMap);

            // Perimeter Geofence Circle
            L.circle([siteData.lat, siteData.lng], {
                color: '#2563eb',
                weight: 2,
                fillColor: '#3b82f6',
                fillOpacity: 0.2,
                dashArray: '5, 5',
                radius: siteData.radius
            }).addTo(detailMap);

            // Center Pin
            const marker = L.marker([siteData.lat, siteData.lng]).addTo(detailMap);
            marker.bindPopup(`
                <div style="font-family:'Inter',sans-serif; font-size:11px;" class="p-1">
                    <b style="color:#242b5f;">${siteData.name}</b>
                    <p style="color:#64748b; margin:2px 0 0 0;">${siteData.address}</p>
                    <p style="color:#16a34a; font-weight:bold; margin:2px 0 0 0;">${siteData.radius}m Active Geofence Boundary</p>
                </div>
            `).openPopup();
        }

        window.pingCurrentSiteBiometric = function() {
            showToast(`Pinging ${siteData.biometricHardware}: Online (Latency 14ms)`, 'success');
        };

        window.openAddWorkerToSiteModal = function() {
            openModal(
                `Add Worker to ${siteData.name}`,
                `<div class="space-y-3 text-xs">
                    <label class="text-xs font-bold text-gray-700">Select Available Worker from Pool</label>
                    <select class="w-full border rounded p-2 text-xs bg-white">
                        <option>Suleman Shah (EMP-1077) • HVAC Helper</option>
                        <option>Naveed Akhtar (EMP-1078) • Cable Jointer</option>
                        <option>Babar Azam (EMP-1079) • Plumber</option>
                    </select>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] font-bold text-gray-600 mb-0.5">Deployment Type</label>
                            <select class="w-full border rounded p-1.5 text-xs bg-white">
                                <option>Local Site Assignment</option>
                                <option>Outstation Deployment</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-600 mb-0.5">Assigned Shift</label>
                            <select class="w-full border rounded p-1.5 text-xs bg-white">
                                <option>Morning (08:00 - 17:00)</option>
                                <option>Night Shift (20:00 - 05:00)</option>
                            </select>
                        </div>
                    </div>
                </div>`,
                () => showToast(`Worker added to ${siteData.name} roster!`, 'success')
            );
        };
    </script>
</body>
</html>
