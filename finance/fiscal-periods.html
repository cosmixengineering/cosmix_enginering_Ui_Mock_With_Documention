<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiscal Periods & GL Locking - Cosmix ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans flex h-screen overflow-hidden text-xs">

    <div id="app-layout" class="flex w-full h-full"></div>

    <script src="../assets/js/finance-store.js"></script>
    <script src="../assets/js/shared.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderLayout('fiscal-periods');

            const content = `
                <div class="p-4 space-y-4 max-w-7xl mx-auto pb-12">
                    
                    <!-- Header -->
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white p-4 rounded-xl border border-slate-200/80 shadow-xs">
                        <div>
                            <div class="flex items-center gap-2">
                                <a href="index.html" class="text-slate-400 hover:text-indigo-600 text-[11px]"><i class="fas fa-arrow-left mr-1"></i> Dashboard</a>
                                <span class="text-slate-300">/</span>
                                <span class="text-xs font-bold text-slate-700 uppercase tracking-wider">Audit Governance</span>
                            </div>
                            <h1 class="text-lg font-bold text-slate-800 mt-0.5">Fiscal Periods & Backdate Protection</h1>
                            <p class="text-[11px] text-slate-500">Monthly fiscal period locking mechanism to prevent unauthorized backdated journal vouchers.</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="px-2.5 py-1 bg-blue-50 text-blue-700 border border-blue-200 rounded-lg text-xs font-bold font-mono">
                                Active Year: FY 2026-2027
                            </span>
                        </div>
                    </div>

                    <!-- Periods Grid -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5" id="periods-grid">
                        <!-- Dynamic Period Cards -->
                    </div>

                </div>
            `;

            document.getElementById('main-content').innerHTML = content;
            renderPeriods();
        });

        function renderPeriods() {
            const periods = CosmixFinance.getFiscalPeriods();
            const grid = document.getElementById('periods-grid');
            if (!grid) return;

            grid.innerHTML = periods.map(p => {
                const isClosed = p.status === 'Closed';
                const isOpen = p.status === 'Open';
                const isFuture = p.status === 'Future';

                let badgeClass = 'bg-slate-100 text-slate-600';
                if (isClosed) badgeClass = 'bg-rose-50 text-rose-700 border border-rose-200';
                if (isOpen) badgeClass = 'bg-emerald-50 text-emerald-700 border border-emerald-200 ring-2 ring-emerald-100';
                if (isFuture) badgeClass = 'bg-blue-50 text-blue-700 border border-blue-200';

                return `
                    <div class="bg-white rounded-xl border ${isOpen ? 'border-emerald-300 shadow-sm' : 'border-slate-200/80'} shadow-xs p-4 flex flex-col justify-between space-y-3">
                        <div>
                            <div class="flex items-start justify-between gap-2">
                                <div>
                                    <span class="text-[10px] text-slate-400 font-mono font-bold">${p.startDate} to ${p.endDate}</span>
                                    <h3 class="font-bold text-slate-800 text-sm mt-0.5">${p.periodName}</h3>
                                </div>
                                <span class="px-2 py-0.5 rounded text-[9.5px] font-bold ${badgeClass}">
                                    ${isClosed ? '<i class="fas fa-lock mr-1"></i> LOCKED' : isOpen ? '<i class="fas fa-lock-open mr-1"></i> ACTIVE OPEN' : 'FUTURE'}
                                </span>
                            </div>

                            <div class="mt-3 bg-slate-50 p-2.5 rounded-lg border border-slate-100 text-[10.5px] space-y-1">
                                <div class="flex justify-between">
                                    <span class="text-slate-400">Postings Allowed:</span>
                                    <span class="font-bold ${isOpen ? 'text-emerald-700' : 'text-rose-700'}">${isOpen ? 'YES (Current GL Postings)' : 'NO (Locked by Audit)'}</span>
                                </div>
                                ${isClosed ? `
                                    <div class="flex justify-between">
                                        <span class="text-slate-400">Locked By:</span>
                                        <span class="font-medium text-slate-700">${p.closedBy}</span>
                                    </div>
                                    <div class="flex justify-between">
                                        <span class="text-slate-400">Locked Date:</span>
                                        <span class="font-mono text-slate-600">${p.closedAt}</span>
                                    </div>
                                ` : ''}
                            </div>
                        </div>

                        <div class="pt-2 border-t border-slate-100 flex items-center justify-between">
                            <span class="text-[10px] text-slate-400 font-medium">Audit Governance</span>
                            ${isClosed ? `
                                <button onclick="toggleLock('${p.id}', 'Open')" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded text-[10.5px] font-semibold">
                                    <i class="fas fa-unlock mr-1"></i> Unlock for Re-audit
                                </button>
                            ` : isOpen ? `
                                <button onclick="toggleLock('${p.id}', 'Closed')" class="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 rounded text-[10.5px] font-bold">
                                    <i class="fas fa-lock mr-1"></i> Close & Lock Month
                                </button>
                            ` : `
                                <button onclick="toggleLock('${p.id}', 'Open')" class="px-2.5 py-1 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 rounded text-[10.5px] font-bold">
                                    <i class="fas fa-play mr-1"></i> Open Period Early
                                </button>
                            `}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleLock(periodId, newStatus) {
            CosmixFinance.togglePeriodLock(periodId, newStatus);
            renderPeriods();
        }
    </script>
</body>
</html>
