<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart of Accounts (COA) - Cosmix ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans flex h-screen overflow-hidden text-xs">

    <div id="app-layout" class="flex w-full h-full"></div>

    <script src="../assets/js/finance-store.js"></script>
    <script src="../assets/js/shared.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderLayout('coa');

            const content = `
                <div class="p-4 space-y-4 max-w-7xl mx-auto pb-12">
                    
                    <!-- Header -->
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white p-4 rounded-xl border border-slate-200/80 shadow-xs">
                        <div>
                            <div class="flex items-center gap-2">
                                <a href="index.html" class="text-slate-400 hover:text-indigo-600 text-[11px]"><i class="fas fa-arrow-left mr-1"></i> Dashboard</a>
                                <span class="text-slate-300">/</span>
                                <span class="text-xs font-bold text-indigo-700 uppercase tracking-wider">General Ledger</span>
                            </div>
                            <h1 class="text-lg font-bold text-slate-800 mt-0.5">Pakistani 4-Digit Chart of Accounts (COA)</h1>
                            <p class="text-[11px] text-slate-500">Standardized enterprise GL code hierarchy: 1000 Assets, 2000 Liabilities, 3000 Equity, 4000 Revenue, 5000 Costs.</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="alert('Account creation requires CFO approval.')" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold shadow-xs flex items-center gap-1.5 transition-all">
                                <i class="fas fa-plus"></i> Add GL Account
                            </button>
                        </div>
                    </div>

                    <!-- Filter Bar -->
                    <div class="bg-white p-3 rounded-xl border border-slate-200/80 shadow-xs flex flex-wrap items-center justify-between gap-2 text-xs">
                        <div class="flex items-center gap-2 flex-1 min-w-[240px]">
                            <div class="relative w-full max-w-xs">
                                <i class="fas fa-search absolute left-2.5 top-2.5 text-slate-400 text-[10px]"></i>
                                <input type="text" id="coa-search" oninput="filterCoa()" placeholder="Search Account Code or Name..." class="w-full pl-7 pr-2.5 py-1.5 border border-slate-200 rounded-lg text-xs focus:ring-1 focus:ring-indigo-500 outline-none">
                            </div>
                            <select id="type-filter" onchange="filterCoa()" class="px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs outline-none">
                                <option value="">All Account Types</option>
                                <option value="Asset">1000 Assets</option>
                                <option value="Liability">2000 Liabilities</option>
                                <option value="Equity">3000 Equity</option>
                                <option value="Revenue">4000 Revenue</option>
                                <option value="Expense">5000 Expenses & COGS</option>
                            </select>
                        </div>
                        <div class="text-[11px] text-slate-500 font-medium" id="coa-count-label">Showing 18 Accounts</div>
                    </div>

                    <!-- COA Table -->
                    <div class="bg-white rounded-xl border border-slate-200/80 shadow-xs overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-[11px]">
                                <thead class="bg-slate-50/80 text-slate-500 font-semibold border-b border-slate-100">
                                    <tr>
                                        <th class="py-2.5 px-3">GL Code</th>
                                        <th class="py-2.5 px-3">Account Title</th>
                                        <th class="py-2.5 px-3">Type</th>
                                        <th class="py-2.5 px-3 text-center">Normal Balance</th>
                                        <th class="py-2.5 px-3 text-center">Control Account</th>
                                        <th class="py-2.5 px-3 text-right">Current Balance (PKR)</th>
                                    </tr>
                                </thead>
                                <tbody id="coa-rows" class="divide-y divide-slate-100">
                                    <!-- Dynamic Rows -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>
            `;

            document.getElementById('main-content').innerHTML = content;
            renderCoaTable();
        });

        function renderCoaTable() {
            filterCoa();
        }

        function filterCoa() {
            const list = CosmixFinance.getChartOfAccounts();
            const search = (document.getElementById('coa-search')?.value || '').toLowerCase();
            const type = document.getElementById('type-filter')?.value || '';

            const filtered = list.filter(acc => {
                const matchSearch = acc.code.toLowerCase().includes(search) || acc.name.toLowerCase().includes(search);
                const matchType = !type || acc.type === type;
                return matchSearch && matchType;
            });

            const countLabel = document.getElementById('coa-count-label');
            if (countLabel) countLabel.innerText = `Showing ${filtered.length} of ${list.length} Accounts`;

            const tbody = document.getElementById('coa-rows');
            if (!tbody) return;

            tbody.innerHTML = filtered.map(acc => {
                let typeBadge = 'bg-slate-100 text-slate-700';
                if (acc.type === 'Asset') typeBadge = 'bg-blue-50 text-blue-700 border border-blue-200';
                if (acc.type === 'Liability') typeBadge = 'bg-rose-50 text-rose-700 border border-rose-200';
                if (acc.type === 'Equity') typeBadge = 'bg-purple-50 text-purple-700 border border-purple-200';
                if (acc.type === 'Revenue') typeBadge = 'bg-emerald-50 text-emerald-700 border border-emerald-200';
                if (acc.type === 'Expense') typeBadge = 'bg-amber-50 text-amber-700 border border-amber-200';

                return `
                    <tr class="hover:bg-slate-50/80 transition-all">
                        <td class="py-2.5 px-3 font-mono font-bold text-indigo-700 text-xs">${acc.code}</td>
                        <td class="py-2.5 px-3 font-medium text-slate-800">${acc.name}</td>
                        <td class="py-2.5 px-3">
                            <span class="px-2 py-0.5 rounded-md text-[9.5px] font-bold ${typeBadge}">${acc.type}</span>
                        </td>
                        <td class="py-2.5 px-3 text-center">
                            <span class="px-1.5 py-0.5 rounded text-[9.5px] font-mono font-semibold ${acc.normalBalance === 'Debit' ? 'bg-blue-50 text-blue-700' : 'bg-emerald-50 text-emerald-700'}">
                                ${acc.normalBalance}
                            </span>
                        </td>
                        <td class="py-2.5 px-3 text-center">
                            ${acc.isControl ? '<span class="px-1.5 py-0.5 rounded bg-indigo-100 text-indigo-800 font-bold text-[9px]">CONTROL</span>' : '<span class="text-slate-300">-</span>'}
                        </td>
                        <td class="py-2.5 px-3 text-right font-mono font-bold text-slate-800 text-xs">
                            PKR ${acc.balancePkr.toLocaleString()}
                        </td>
                    </tr>
                `;
            }).join('');
        }
    </script>
</body>
</html>
