<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approved Vendor Master - Cosmix ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans flex h-screen overflow-hidden text-xs">

    <div id="app-layout" class="flex w-full h-full"></div>

    <!-- Add Vendor Modal -->
    <div id="vendor-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white w-full max-w-2xl rounded-xl shadow-xl border border-slate-200 flex flex-col max-h-[90vh]">
            <div class="px-5 py-3.5 border-b border-slate-100 flex items-center justify-between">
                <div>
                    <h3 class="font-bold text-sm text-slate-800">Onboard Approved Vendor</h3>
                    <p class="text-[11px] text-slate-500">Register new supplier with NTN, STRN, and commercial terms.</p>
                </div>
                <button onclick="closeVendorModal()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times"></i></button>
            </div>
            <form id="vendor-form" class="p-5 overflow-y-auto space-y-3.5 flex-1">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-600 mb-1">Company / Vendor Name *</label>
                        <input type="text" id="v-name" required placeholder="e.g. Millat Fasteners & Bolts" class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs focus:ring-1 focus:ring-teal-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-600 mb-1">Product / Supply Category *</label>
                        <select id="v-cat" class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs focus:ring-1 focus:ring-teal-500 outline-none">
                            <option value="Raw Steel & GI Sheets">Raw Steel & GI Sheets</option>
                            <option value="Compressors & Heavy Machinery">Compressors & Heavy Machinery</option>
                            <option value="Electrical, Drives & Switchgear">Electrical, Drives & Switchgear</option>
                            <option value="Thermal & Acoustic Insulation">Thermal & Acoustic Insulation</option>
                            <option value="Copper Pipes & Refrigeration">Copper Pipes & Refrigeration</option>
                            <option value="Bolts, Screws & Hardware">Bolts, Screws & Hardware</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-600 mb-1">National Tax Number (NTN) *</label>
                        <input type="text" id="v-ntn" required placeholder="e.g. 1234567-8" class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs font-mono focus:ring-1 focus:ring-teal-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-600 mb-1">Sales Tax Reg. (STRN) *</label>
                        <input type="text" id="v-strn" required placeholder="e.g. 17-00-1234-567-11" class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs font-mono focus:ring-1 focus:ring-teal-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-600 mb-1">Contact Person</label>
                        <input type="text" id="v-contact" placeholder="e.g. Tariq Mehmood" class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs focus:ring-1 focus:ring-teal-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-600 mb-1">Phone / WhatsApp</label>
                        <input type="text" id="v-phone" placeholder="+92 300 1234567" class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs font-mono focus:ring-1 focus:ring-teal-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-600 mb-1">Credit Terms</label>
                        <select id="v-credit" class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs focus:ring-1 focus:ring-teal-500 outline-none">
                            <option value="30">30 Days Net</option>
                            <option value="15">15 Days Credit</option>
                            <option value="7">7 Days Credit</option>
                            <option value="0">100% Advance</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 mb-1">Factory / Office Address</label>
                    <input type="text" id="v-address" placeholder="e.g. Plot 15, Sector 12, Korangi Industrial Area, Karachi" class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs focus:ring-1 focus:ring-teal-500 outline-none">
                </div>
            </form>
            <div class="px-5 py-3 bg-slate-50 border-t border-slate-100 flex items-center justify-end gap-2">
                <button type="button" onclick="closeVendorModal()" class="px-3 py-1.5 bg-white border border-slate-200 hover:bg-slate-100 rounded-lg text-xs font-semibold text-slate-600">Cancel</button>
                <button type="button" onclick="saveNewVendor()" class="px-3.5 py-1.5 bg-teal-600 hover:bg-teal-700 text-white rounded-lg text-xs font-bold shadow-xs">Register Vendor</button>
            </div>
        </div>
    </div>

    <script src="../assets/js/procurement-store.js"></script>
    <script src="../assets/js/shared.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderLayout('vendors');

            const content = `
                <div class="p-4 space-y-4 max-w-7xl mx-auto pb-12">
                    
                    <!-- Header -->
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white p-4 rounded-xl border border-slate-200/80 shadow-xs">
                        <div>
                            <div class="flex items-center gap-2">
                                <a href="index.html" class="text-slate-400 hover:text-teal-600 text-[11px]"><i class="fas fa-arrow-left mr-1"></i> Dashboard</a>
                                <span class="text-slate-300">/</span>
                                <span class="text-xs font-bold text-teal-700 uppercase tracking-wider">Master Data</span>
                            </div>
                            <h1 class="text-lg font-bold text-slate-800 mt-0.5">Approved Vendor Master</h1>
                            <p class="text-[11px] text-slate-500">Authorized suppliers with verified NTN, active FBR tax filing status, and credit limits.</p>
                        </div>
                        <button onclick="openVendorModal()" class="px-3 py-1.5 bg-teal-600 hover:bg-teal-700 text-white rounded-lg text-xs font-bold shadow-xs flex items-center gap-1.5 transition-all">
                            <i class="fas fa-plus"></i> Onboard New Vendor
                        </button>
                    </div>

                    <!-- Filter Bar -->
                    <div class="bg-white p-3 rounded-xl border border-slate-200/80 shadow-xs flex flex-wrap items-center justify-between gap-2 text-xs">
                        <div class="flex items-center gap-2 flex-1 min-w-[240px]">
                            <div class="relative w-full max-w-xs">
                                <i class="fas fa-search absolute left-2.5 top-2.5 text-slate-400 text-[10px]"></i>
                                <input type="text" id="v-search" oninput="filterVendorList()" placeholder="Search Vendor, NTN, category..." class="w-full pl-7 pr-2.5 py-1.5 border border-slate-200 rounded-lg text-xs focus:ring-1 focus:ring-teal-500 outline-none">
                            </div>
                            <select id="cat-filter" onchange="filterVendorList()" class="px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs outline-none">
                                <option value="">All Categories</option>
                                <option value="Raw Steel & GI Sheets">Raw Steel & GI Sheets</option>
                                <option value="Compressors & Heavy Machinery">Compressors</option>
                                <option value="Electrical, Drives & Switchgear">Electrical & Drives</option>
                                <option value="Thermal & Acoustic Insulation">Insulation</option>
                                <option value="Copper Pipes & Refrigeration">Copper & Refrigeration</option>
                                <option value="Bolts, Screws & Hardware">Hardware & Fasteners</option>
                            </select>
                        </div>
                        <div class="text-[11px] text-slate-500 font-medium" id="v-count-label">Showing 6 Approved Vendors</div>
                    </div>

                    <!-- Vendor Grid -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5" id="vendor-grid">
                        <!-- Populated Dynamically -->
                    </div>

                </div>
            `;

            document.getElementById('main-content').innerHTML = content;
            renderVendorCards();
        });

        function renderVendorCards() {
            filterVendorList();
        }

        function filterVendorList() {
            const vendors = CosmixProcurement.getVendors();
            const search = (document.getElementById('v-search')?.value || '').toLowerCase();
            const cat = document.getElementById('cat-filter')?.value || '';

            const filtered = vendors.filter(v => {
                const matchSearch = v.name.toLowerCase().includes(search) || 
                                    v.ntn.toLowerCase().includes(search) || 
                                    v.category.toLowerCase().includes(search);
                const matchCat = !cat || v.category === cat;
                return matchSearch && matchCat;
            });

            const countLabel = document.getElementById('v-count-label');
            if (countLabel) countLabel.innerText = `Showing ${filtered.length} of ${vendors.length} Approved Vendors`;

            const grid = document.getElementById('vendor-grid');
            if (!grid) return;

            grid.innerHTML = filtered.map(v => {
                const isApproved = v.status === 'Approved';

                return `
                    <div class="bg-white rounded-xl border border-slate-200/80 shadow-xs p-4 flex flex-col justify-between space-y-3 hover:border-teal-300 transition-all">
                        <div>
                            <div class="flex items-start justify-between gap-2">
                                <div>
                                    <span class="px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 font-mono text-[9px] font-bold">${v.code}</span>
                                    <h3 class="font-bold text-slate-800 text-xs mt-1">${v.name}</h3>
                                    <span class="text-[10px] text-teal-700 font-medium">${v.category}</span>
                                </div>
                                <span class="px-2 py-0.5 rounded text-[9.5px] font-bold ${isApproved ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-amber-50 text-amber-700 border border-amber-200'}">
                                    ${v.status}
                                </span>
                            </div>

                            <div class="mt-3 bg-slate-50 p-2.5 rounded-lg border border-slate-100 space-y-1 text-[10.5px]">
                                <div class="flex justify-between">
                                    <span class="text-slate-400">NTN / Tax ID:</span>
                                    <span class="font-mono font-bold text-slate-700">${v.ntn}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-slate-400">STRN:</span>
                                    <span class="font-mono text-slate-600">${v.strn || 'N/A'}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-slate-400">FBR Status:</span>
                                    <span class="text-emerald-700 font-semibold"><i class="fas fa-check-circle text-[9px]"></i> ${v.fbrStatus}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-slate-400">Credit Terms:</span>
                                    <span class="font-medium text-slate-700">${v.creditDays} Days Net</span>
                                </div>
                            </div>
                        </div>

                        <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-[11px]">
                            <div class="text-slate-500">
                                <i class="fas fa-user-tie text-slate-400 mr-1"></i> ${v.contactPerson || 'N/A'}
                            </div>
                            <div class="flex items-center gap-1 text-amber-500 font-bold">
                                <i class="fas fa-star text-[10px]"></i>
                                <span class="text-slate-700">${v.rating}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openVendorModal() {
            document.getElementById('vendor-modal').classList.remove('hidden');
        }

        function closeVendorModal() {
            document.getElementById('vendor-modal').classList.add('hidden');
        }

        function saveNewVendor() {
            const name = document.getElementById('v-name').value;
            const cat = document.getElementById('v-cat').value;
            const ntn = document.getElementById('v-ntn').value;
            const strn = document.getElementById('v-strn').value;
            const contact = document.getElementById('v-contact').value;
            const phone = document.getElementById('v-phone').value;
            const creditDays = parseInt(document.getElementById('v-credit').value) || 15;
            const address = document.getElementById('v-address').value;

            if (!name || !ntn) {
                alert('Please enter vendor name and NTN');
                return;
            }

            CosmixProcurement.createVendor({
                name: name,
                category: cat,
                ntn: ntn,
                strn: strn,
                contactPerson: contact,
                phone: phone,
                creditDays: creditDays,
                address: address
            });

            closeVendorModal();
            renderVendorCards();
        }
    </script>
</body>
</html>
