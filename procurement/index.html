<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procurement & Supply Chain Command Center - Cosmix ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans flex h-screen overflow-hidden text-xs">

    <div id="app-layout" class="flex w-full h-full"></div>

    <script src="../assets/js/procurement-store.js"></script>
    <script src="../assets/js/shared.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderLayout('dashboard');

            const content = `
                <div class="p-4 space-y-4 max-w-7xl mx-auto pb-12">
                    
                    <!-- Header -->
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white p-4 rounded-xl border border-slate-200/80 shadow-xs">
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="px-2 py-0.5 rounded-md bg-teal-50 text-teal-700 font-bold border border-teal-200 text-[10px] tracking-wider uppercase">SCM & Tendering</span>
                                <span class="text-slate-400 text-xs">•</span>
                                <span class="text-xs text-slate-500 font-medium">BOM Sourcing & 3-Way Match Verification</span>
                            </div>
                            <h1 class="text-lg font-bold text-slate-800 mt-0.5">Procurement Command Center</h1>
                            <p class="text-[11px] text-slate-500">Automated Purchase Orders, L1 Comparative RFQs, and PO-GRN-Vendor Bill settlement pipeline.</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <a href="purchase-orders.html" class="px-3 py-1.5 bg-teal-600 hover:bg-teal-700 text-white rounded-lg text-xs font-semibold shadow-xs flex items-center gap-1.5 transition-all">
                                <i class="fas fa-plus"></i> New Purchase Order
                            </a>
                            <a href="three-way-match.html" class="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 rounded-lg text-xs font-semibold shadow-xs flex items-center gap-1.5 transition-all">
                                <i class="fas fa-cubes-stacked"></i> 3-Way Match Hub
                            </a>
                        </div>
                    </div>

                    <!-- KPI Cards -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                        <div class="bg-white p-3.5 rounded-xl border border-slate-200/80 shadow-xs">
                            <div class="flex items-center justify-between">
                                <span class="text-[11px] font-semibold text-slate-500">Active Commitments</span>
                                <div class="w-7 h-7 rounded-lg bg-teal-50 text-teal-600 flex items-center justify-center text-xs">
                                    <i class="fas fa-file-invoice-dollar"></i>
                                </div>
                            </div>
                            <div class="mt-2 flex items-baseline gap-2">
                                <span class="text-lg font-bold text-slate-800 font-mono" id="dash-po-val">PKR 9.43M</span>
                                <span class="text-[10px] text-teal-600 font-semibold" id="dash-po-count">6 POs</span>
                            </div>
                            <p class="text-[10px] text-slate-400 mt-1">Directly tied to released Project BOMs</p>
                        </div>

                        <div class="bg-white p-3.5 rounded-xl border border-slate-200/80 shadow-xs">
                            <div class="flex items-center justify-between">
                                <span class="text-[11px] font-semibold text-slate-500">3-Way Match AP Cleared</span>
                                <div class="w-7 h-7 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center text-xs">
                                    <i class="fas fa-check-double"></i>
                                </div>
                            </div>
                            <div class="mt-2 flex items-baseline gap-2">
                                <span class="text-lg font-bold text-emerald-700 font-mono" id="dash-cleared-val">PKR 1.96M</span>
                                <span class="text-[10px] text-emerald-600 font-semibold" id="dash-cleared-count">2 Clean</span>
                            </div>
                            <p class="text-[10px] text-slate-400 mt-1">Automated VB-MATCH Vouchers</p>
                        </div>

                        <div class="bg-white p-3.5 rounded-xl border border-rose-200 shadow-xs">
                            <div class="flex items-center justify-between">
                                <span class="text-[11px] font-semibold text-slate-500">Contradictions Flagged</span>
                                <div class="w-7 h-7 rounded-lg bg-rose-50 text-rose-600 flex items-center justify-center text-xs">
                                    <i class="fas fa-triangle-exclamation"></i>
                                </div>
                            </div>
                            <div class="mt-2 flex items-baseline gap-2">
                                <span class="text-lg font-bold text-rose-700 font-mono" id="dash-contra-count">2 Alerts</span>
                                <span class="text-[10px] text-rose-600 font-semibold">Overbill / Rate</span>
                            </div>
                            <p class="text-[10px] text-slate-400 mt-1">AP release held for reconciliation</p>
                        </div>

                        <div class="bg-white p-3.5 rounded-xl border border-slate-200/80 shadow-xs">
                            <div class="flex items-center justify-between">
                                <span class="text-[11px] font-semibold text-slate-500">Approved Vendors</span>
                                <div class="w-7 h-7 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center text-xs">
                                    <i class="fas fa-building-circle-check"></i>
                                </div>
                            </div>
                            <div class="mt-2 flex items-baseline gap-2">
                                <span class="text-lg font-bold text-slate-800 font-mono" id="dash-vnd-count">6 Vendors</span>
                                <span class="text-[10px] text-amber-600 font-semibold">100% Verified</span>
                            </div>
                            <p class="text-[10px] text-slate-400 mt-1">FBR Active Taxpayer list verified</p>
                        </div>
                    </div>

                    <!-- Main Grid -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
                        
                        <!-- Active Purchase Orders Table (2 Cols) -->
                        <div class="lg:col-span-2 bg-white rounded-xl border border-slate-200/80 shadow-xs flex flex-col">
                            <div class="p-3.5 border-b border-slate-100 flex items-center justify-between">
                                <div class="flex items-center gap-2">
                                    <i class="fas fa-file-contract text-teal-600"></i>
                                    <h2 class="font-bold text-slate-800 text-sm">Recent Purchase Orders</h2>
                                </div>
                                <a href="purchase-orders.html" class="text-[11px] font-semibold text-teal-600 hover:text-teal-700">View All POs &rarr;</a>
                            </div>
                            <div class="overflow-x-auto flex-1">
                                <table class="w-full text-left">
                                    <thead class="bg-slate-50/80 text-slate-500 font-semibold border-b border-slate-100">
                                        <tr>
                                            <th class="py-2.5 px-3">PO Number</th>
                                            <th class="py-2.5 px-3">Vendor</th>
                                            <th class="py-2.5 px-3">Project Ref</th>
                                            <th class="py-2.5 px-3 text-right">Amount (PKR)</th>
                                            <th class="py-2.5 px-3 text-center">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody id="po-table-body" class="divide-y divide-slate-100 text-[11px]">
                                        <!-- Dynamically Populated -->
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- 3-Way Match Action Queue (1 Col) -->
                        <div class="bg-white rounded-xl border border-slate-200/80 shadow-xs flex flex-col">
                            <div class="p-3.5 border-b border-slate-100 flex items-center justify-between">
                                <div class="flex items-center gap-2">
                                    <i class="fas fa-cubes-stacked text-indigo-600"></i>
                                    <h2 class="font-bold text-slate-800 text-sm">3-Way Match Verification</h2>
                                </div>
                                <a href="three-way-match.html" class="text-[11px] font-semibold text-indigo-600 hover:text-indigo-700">Full Audit &rarr;</a>
                            </div>
                            <div class="p-3.5 space-y-2.5 flex-1 overflow-y-auto" id="three-way-match-queue">
                                <!-- Dynamically Populated -->
                            </div>
                        </div>
                    </div>

                    <!-- Flow Infographic Card -->
                    <div class="bg-[#1e2552] text-white p-4 rounded-xl shadow-xs">
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div>
                                <h3 class="font-bold text-sm text-teal-300 flex items-center gap-2">
                                    <i class="fas fa-network-wired"></i> Procurement SOP Flow (Zero Leakage SCM)
                                </h3>
                                <p class="text-slate-300 text-[11px] mt-1">
                                    Released BOM &rarr; RFQ / Comparative L1 Selection &rarr; Approved PO &rarr; Physical Gate Inward (GRN) &rarr; 3-Way Match (PO + GRN + Bill) &rarr; Auto AP Voucher.
                                </p>
                            </div>
                            <div class="flex items-center gap-2 shrink-0">
                                <a href="vendor-quotations.html" class="px-3 py-1.5 bg-teal-500 hover:bg-teal-400 text-slate-900 font-bold rounded-lg text-[11px] transition-all">
                                    <i class="fas fa-scale-balanced mr-1"></i> Comparative Statements
                                </a>
                                <a href="vendor-directory.html" class="px-3 py-1.5 bg-white/10 hover:bg-white/20 text-white rounded-lg text-[11px] font-medium border border-white/20 transition-all">
                                    <i class="fas fa-address-book mr-1"></i> Approved Vendors
                                </a>
                            </div>
                        </div>
                    </div>

                </div>
            `;

            document.getElementById('main-content').innerHTML = content;
            renderDashboardData();
        });

        function renderDashboardData() {
            const pos = CosmixProcurement.getPurchaseOrders();
            const matches = CosmixProcurement.getThreeWayMatches();
            const vendors = CosmixProcurement.getVendors();
            const stats = CosmixProcurement.getSummaryStats();

            // Bind KPIs
            const totalPoCommitment = pos.reduce((acc, p) => acc + (p.totalPkr || 0), 0);
            const poValEl = document.getElementById('dash-po-val');
            const poCountEl = document.getElementById('dash-po-count');
            const clearedValEl = document.getElementById('dash-cleared-val');
            const clearedCountEl = document.getElementById('dash-cleared-count');
            const contraCountEl = document.getElementById('dash-contra-count');
            const vndCountEl = document.getElementById('dash-vnd-count');

            if (poValEl) poValEl.innerText = 'PKR ' + (totalPoCommitment / 1000000).toFixed(2) + 'M';
            if (poCountEl) poCountEl.innerText = `${pos.length} POs`;
            if (clearedValEl) clearedValEl.innerText = 'PKR ' + (stats.totalReconciledValuePkr / 1000000).toFixed(2) + 'M';
            if (clearedCountEl) clearedCountEl.innerText = `${stats.cleanMatchesCount} Clean`;
            if (contraCountEl) contraCountEl.innerText = `${stats.contradictionCount + stats.missingGrnCount} Alerts`;
            if (vndCountEl) vndCountEl.innerText = `${vendors.length} Vendors`;

            // Populate POs
            const poBody = document.getElementById('po-table-body');
            if (poBody) {
                poBody.innerHTML = pos.map(p => {
                    let badgeClass = 'bg-slate-100 text-slate-700';
                    if (p.status === 'Draft') badgeClass = 'bg-slate-100 text-slate-600 border border-slate-200';
                    if (p.status === 'Issued') badgeClass = 'bg-blue-50 text-blue-700 border border-blue-200';
                    if (p.status === 'PartiallyReceived') badgeClass = 'bg-amber-50 text-amber-700 border border-amber-200';
                    if (p.status === 'Received') badgeClass = 'bg-teal-50 text-teal-700 border border-teal-200';
                    if (p.status === 'Invoiced') badgeClass = 'bg-emerald-50 text-emerald-700 border border-emerald-200';

                    return `
                        <tr class="hover:bg-slate-50/70 transition-all">
                            <td class="py-2.5 px-3 font-semibold text-teal-700 font-mono">
                                <a href="purchase-orders.html?po=${p.poNumber}" class="hover:underline">${p.poNumber}</a>
                            </td>
                            <td class="py-2.5 px-3">
                                <div class="font-medium text-slate-800">${p.vendorName}</div>
                                <div class="text-[9px] text-slate-400 font-mono">NTN: ${p.vendorNtn}</div>
                            </td>
                            <td class="py-2.5 px-3 text-slate-600 truncate max-w-[200px]" title="${p.projectRef}">${p.projectRef}</td>
                            <td class="py-2.5 px-3 text-right font-mono font-bold text-slate-800">PKR ${p.totalPkr.toLocaleString()}</td>
                            <td class="py-2.5 px-3 text-center">
                                <span class="px-2 py-0.5 rounded-md text-[9.5px] font-bold ${badgeClass}">${p.status}</span>
                            </td>
                        </tr>
                    `;
                }).join('');
            }

            // Populate 3-Way Match queue
            const matchContainer = document.getElementById('three-way-match-queue');
            if (matchContainer) {
                matchContainer.innerHTML = matches.map(m => {
                    const isMatched = m.status === 'Matched';
                    const isApproved = m.status === 'ApprovedWithVariance';
                    const isCreditNote = m.status === 'CreditNoteRequested';
                    let bgBox = isMatched ? 'bg-emerald-50/50 border-emerald-200' : 'bg-rose-50/50 border-rose-200';
                    if (isApproved) bgBox = 'bg-purple-50/50 border-purple-200';
                    if (isCreditNote) bgBox = 'bg-amber-50/50 border-amber-200';

                    return `
                        <div class="p-3 rounded-lg border ${bgBox} text-[11px] space-y-1.5">
                            <div class="flex items-center justify-between">
                                <span class="font-mono font-bold text-slate-800">${m.matchCode}</span>
                                <span class="px-1.5 py-0.5 rounded text-[9px] font-bold ${isMatched ? 'bg-emerald-100 text-emerald-800' : isApproved ? 'bg-purple-100 text-purple-800' : isCreditNote ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-800'}">
                                    ${m.status}
                                </span>
                            </div>
                            <div class="flex items-center justify-between text-slate-500 text-[10px]">
                                <span>PO: <strong class="text-slate-700 font-mono">${m.poNumber}</strong></span>
                                <span>GRN: <strong class="text-slate-700 font-mono">${m.grnNumber}</strong></span>
                            </div>
                            <div class="flex items-center justify-between text-slate-600 pt-1 border-t border-slate-200/50 font-mono">
                                <span>Bill: ${m.vendorBillNumber}</span>
                                <span class="font-bold text-slate-800">PKR ${m.billAmountPkr.toLocaleString()}</span>
                            </div>
                            ${m.apVoucherCreated ? `
                                <div class="text-[9.5px] text-emerald-700 font-semibold flex items-center gap-1">
                                    <i class="fas fa-check-circle"></i> AP Voucher: ${m.apVoucherRef}
                                </div>
                            ` : `
                                <div class="pt-1">
                                    <a href="three-way-match.html?po=${m.poNumber}" class="block text-center w-full py-1 bg-[#1e2552] hover:bg-[#28326e] text-white rounded text-[10px] font-semibold transition-all">
                                        Review Variance & Match &rarr;
                                    </a>
                                </div>
                            `}
                        </div>
                    `;
                }).join('');
            }
        }
    </script>
</body>
</html>
